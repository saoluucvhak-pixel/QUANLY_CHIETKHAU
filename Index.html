<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Chiết khấu Nhà cung cấp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy-950:#0a0f1a;
  --navy-900:#0d1526;
  --navy-800:#141f36;
  --navy-700:#1c2a47;
  --slate-50:#f6f7f9;
  --slate-100:#eef0f4;
  --slate-200:#dfe3ea;
  --slate-400:#8993a4;
  --slate-500:#69728a;
  --slate-600:#4c5568;
  --ink:#151b2b;
  --emerald:#0a8f6b;
  --emerald-dark:#066a4f;
  --emerald-soft:#e2f5ee;
  --gold:#c8951f;
  --gold-soft:#faf1dc;
  --red:#c4432f;
  --red-soft:#fbeae7;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--slate-50);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* SỬA LỖI: icon SVG (ICON.xxx) chỉ khai viewBox, không có width/height riêng — nếu chèn ở chỗ không có
   class nào ràng buộc kích thước (VD ngay trong nút <button class="btn">), trình duyệt sẽ tự cho icon
   kích thước mặc định rất lớn, phá vỡ bố cục và che mất nội dung bên dưới. Quy định chung: mọi SVG mặc
   định to bằng đúng cỡ chữ hiện tại (1em) trừ khi có rule cụ thể hơn ghi đè (xem .nav-item .ic svg,
   .small-x svg bên dưới) — luôn có 1 kích thước hợp lý, không bao giờ "bùng nổ" ra to bất thường. */
svg{width:1em;height:1em;flex-shrink:0;display:inline-block;vertical-align:-0.15em;}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
::selection{background:var(--emerald-soft);}

#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:268px;flex-shrink:0;background:var(--navy-950);
  color:var(--slate-200);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  padding:22px 20px 18px;border-bottom:1px solid var(--navy-700);
}
.brand .mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:15px;margin-bottom:10px;
}
.brand .name{font-family:'Space Grotesk';font-weight:600;font-size:15px;color:#fff;letter-spacing:.2px;}
.brand .sub{font-size:11.5px;color:var(--slate-400);margin-top:2px;}

.nav{padding:14px 10px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 10px;border-radius:8px;cursor:pointer;
  color:var(--slate-400);font-size:13px;font-weight:500;
  margin-bottom:2px;transition:background .12s,color .12s;
  user-select:none;
}
.nav-item .ic{width:17px;height:17px;flex-shrink:0;opacity:.8;}
.nav-item .ic svg{width:17px;height:17px;}
.nav-item > span:not(.ic):not(.badge-count){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item:hover{background:var(--navy-800);color:var(--slate-100);}
.nav-item.active{background:var(--navy-800);color:#fff;}
.nav-item.active .ic{opacity:1;color:var(--emerald);}
.nav-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--slate-500);padding:16px 10px 6px;font-weight:600;
}
.nav-item.active{box-shadow:inset 3px 0 0 var(--emerald);}

.sidebar-foot{
  padding:14px 20px 18px;border-top:1px solid var(--navy-700);
  font-size:11px;color:var(--slate-500);
}
.storage-pill{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--slate-400);
  margin-bottom:8px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);flex-shrink:0;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  padding:18px 32px;background:#fff;border-bottom:1px solid var(--slate-200);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px;}
.topbar .desc{font-size:12.5px;color:var(--slate-500);margin-top:2px;}
.content{padding:28px 32px 60px;max-width:1600px;width:100%;margin:0 auto;}

/* Cards & layout helpers */
.card{
  background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.card-head h2{font-size:15.5px;margin:0;font-weight:600;}
.card-head .hint{font-size:12px;color:var(--slate-500);margin-top:2px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.kpi{
  background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
}
.kpi .lbl{font-size:11.5px;color:var(--slate-500);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.kpi .val{font-family:'Space Grotesk';font-size:24px;font-weight:700;margin-top:6px;color:var(--ink);}
.kpi .sub{font-size:11.5px;color:var(--slate-500);margin-top:4px;}
.kpi.accent-gold .val{color:var(--gold);}
.kpi.accent-emerald .val{color:var(--emerald);}

/* buttons */
.btn{
  font-family:'Inter';font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px;
  border:1px solid var(--slate-200);background:#fff;color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:all .12s;white-space:nowrap;
}
.btn:hover{border-color:var(--slate-400);background:var(--slate-50);}
.btn-primary{background:var(--emerald);border-color:var(--emerald);color:#fff;}
.btn-primary:hover{background:var(--emerald-dark);border-color:var(--emerald-dark);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--slate-100);}
.btn-danger{color:var(--red);}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red-soft);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

input[type=text],input[type=number],input[type=date],select,textarea{
  font-family:'Inter';font-size:13px;padding:8px 10px;border-radius:7px;
  border:1px solid var(--slate-200);background:#fff;color:var(--ink);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--emerald-soft);border-color:var(--emerald);}
label{font-size:12px;font-weight:600;color:var(--slate-600);display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--slate-200);border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:600px;}
thead th{
  background:var(--slate-50);color:var(--slate-600);text-align:left;
  padding:9px 12px;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
  border-bottom:1px solid var(--slate-200);white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--slate-100);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--slate-50);}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
.tag{
  display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;
  background:var(--slate-100);color:var(--slate-600);
}
.tag-ok{background:var(--emerald-soft);color:var(--emerald-dark);}
.tag-no{background:var(--red-soft);color:var(--red);}
.tag-gold{background:var(--gold-soft);color:var(--gold);}

.empty{
  text-align:center;padding:44px 20px;color:var(--slate-500);
}
.empty .big{font-size:34px;margin-bottom:8px;}
.empty b{color:var(--ink);}

.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--slate-200);margin-bottom:18px;flex-wrap:wrap;}
.tab2{
  padding:9px 14px;font-size:13px;font-weight:600;color:var(--slate-500);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab2:hover{color:var(--ink);}
.tab2.active{color:var(--emerald-dark);border-bottom-color:var(--emerald);}

.modal-bg{
  position:fixed;inset:0;background:rgba(10,15,26,.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal-bg.show{display:flex;}
.modal{
  background:#fff;border-radius:14px;padding:24px 26px;width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal.modal-wide{max-width:min(1400px,94vw);}
.modal h3{margin:0 0 16px;font-size:16px;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy-950);color:#fff;padding:11px 16px;border-radius:9px;font-size:12.8px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;
  animation:slidein .18s ease;max-width:340px;
}
.toast.err{background:var(--red);}
.toast.ok{background:var(--emerald-dark);}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.badge-count{
  background:var(--navy-700);color:var(--slate-200);font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:20px;margin-left:auto;flex-shrink:0;
}
.nav-item.active .badge-count{background:var(--emerald);color:#fff;}

.section-note{
  font-size:12px;color:var(--slate-500);background:var(--slate-50);border:1px solid var(--slate-200);
  border-radius:8px;padding:10px 12px;margin-bottom:16px;
}
.stair{display:flex;align-items:flex-end;gap:3px;height:64px;}
.stair i{display:block;flex:1;background:linear-gradient(180deg,var(--emerald),var(--emerald-dark));border-radius:3px 3px 0 0;}

.rowline{display:flex;gap:10px;align-items:center;}
.small-x{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--slate-200);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate-500);flex-shrink:0;
}
.small-x svg{width:15px;height:15px;}
.small-x:hover{border-color:var(--red);color:var(--red);background:var(--red-soft);}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--slate-200);border-radius:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>
/* =========================================================================
   QUẢN LÝ CHIẾT KHẤU NHÀ CUNG CẤP (ĐỒNG BỘ GOOGLE SHEET CLOUD)
   ========================================================================= */

const DIM_KEYS = ['thuonghieu','nhomkh','loaisp','dactinh','congdung','quycach'];
const DIM_LABELS = {
  thuonghieu:'Thương hiệu', nhomkh:'Nhóm hàng', loaisp:'Loại sản phẩm',
  dactinh:'Đặc tính', congdung:'Công dụng', quycach:'Quy cách'
};

const HT_OPTIONS = [
  {v:'PERCENT_GIAMUA', l:'% theo Giá mua (lấy từ Sổ chi tiết mua hàng)'},
  {v:'PERCENT_GIACONGBO', l:'% theo Giá công bố (theo thông báo NCC)'},
  {v:'DONGIA_CODINH', l:'Số tiền chiết khấu cố định / đơn vị'},
  {v:'LUY_KE', l:'Lũy kế (chỉ dùng làm chương trình gốc cho Chiết khấu lũy kế, không tự trả CK trực tiếp)'}
];
const TT_CK_OPTIONS = [
  {v:'GIAM_HOADON', l:'Giảm hóa đơn'},
  {v:'GIAM_GIABAN', l:'Giảm giá bán'}
];
const THOIDIEM_OPTIONS = ['Tháng','Quý','6 Tháng','Năm','Theo hiệu lực CTKM'];
const THANG_OPTIONS = Array.from({length:12}, (_,i)=>i+1); // 1..12

let DB = {
  catalog: { thuonghieu:[], nhomkh:[], loaisp:[], dactinh:[], congdung:[], quycach:[], mhck:[], giacongbo:[] },
  programs: [],
  purchases: [],
  programsLuyKe: [],
  reportCKTH: [],
  reportCKCT: [],
  // THEO MÔ HÌNH 3 TẦNG: Tầng 1 = Danh mục chương trình (Mã CT, Nội dung, Từ ngày–Đến ngày);
  // Tầng 2 = Mã chiết khấu (DB.programs, có thể liên kết chuongtrinh_id); Tầng 3 = Bậc điều kiện con
  // của từng mã chiết khấu (nhiều bậc/dòng cho 1 mã). TƯƠNG THÍCH NGƯỢC: nếu 1 mã chiết khấu KHÔNG có
  // bậc con nào trong DB.dieukien, hệ thống tự dùng đúng các trường SL/DT/TL_CK... ngay trên chính dòng
  // đó (y hệt cách tính cũ) — dữ liệu cũ không cần chuyển đổi vẫn chạy đúng.
  chuongtrinh: [],
  dieukien: [],
  // MỚI: Danh mục tổng hợp doanh thu sản lượng (Mã doanh thu) + Danh mục kế hoạch doanh thu
  doanhthu: [],
  kehoach: [],
  kehoachChiTiet: [], // Chi tiết kế hoạch theo từng kỳ (Tháng/Quý/6 Tháng/Năm hoặc kỳ tùy chỉnh) của 1 kế hoạch
  // THEO GÓP Ý: Giá công bố (1.365 dòng) và Mua hàng (1.435 dòng) không tự tải lúc mở app
  // nữa — chỉ tải khi người dùng thật sự vào đúng menu cần dùng. Cờ dưới đây đánh dấu đã tải hay chưa.
  _giacongboLoaded: false,
  _purchasesLoaded: false,
  // 'all' = đã tải TOÀN BỘ Sổ mua hàng; mảng NCC = đã tải LỌC theo đúng các NCC đó (dùng riêng cho tab
  // Sổ chi tiết mua hàng); null = chưa tải gì. QUAN TRỌNG: mọi nơi khác cần dữ liệu ĐẦY ĐỦ (Tổng quan,
  // Tính chiết khấu, Báo cáo, Đối chiếu giá) PHẢI kiểm tra scope==='all', KHÔNG được chỉ kiểm tra
  // _purchasesLoaded — nếu không sẽ vô tình dùng dữ liệu THIẾU (mới lọc 1 phần) để tính chiết khấu,
  // gây SAI SỐ tài chính mà không có cảnh báo gì.
  _purchasesScope: null
};
let UI = { tab:'dashboard', catalogSub:'thuonghieu', reportResult:null, purchaseFilters:{} };
// Kiểm tra Sổ mua hàng đã được tải ĐẦY ĐỦ (toàn bộ NCC) hay chưa — dùng ở MỌI nơi cần dữ liệu đầy đủ để
// tính toán (khác với chỉ xem/lọc trong tab Sổ chi tiết mua hàng, nơi được phép tải lọc 1 phần).
function purchasesFullyLoaded_(){ return DB._purchasesScope === 'all'; }

/* ---------------------------- utils ---------------------------- */
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (s) => (s==null?'':String(s)).trim().toUpperCase();
const fmtNum = (n) => (isFinite(n) ? Math.round(n).toLocaleString('vi-VN') : '0');
const fmtVND = (n) => fmtNum(n) + ' đ';
const fmtPct = (n) => (n==null||n==='') ? '' : (Number(n)).toLocaleString('vi-VN',{maximumFractionDigits:2}) + '%';
function fmtDate(d){
  if(!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt)) return String(d);
  return dt.toLocaleDateString('vi-VN');
}
function toISO(d){
  if(!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt)) return '';
  // Dùng getFullYear/getMonth/getDate (giờ địa phương), KHÔNG dùng toISOString() (quy đổi UTC
  // sẽ lùi mất 1 ngày với múi giờ Việt Nam UTC+7, ví dụ 01/02 local -> 31/01 nếu convert UTC)
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toISO(new Date()); }

/* ---------------------------- ô nhập số nguyên có định dạng phân cách nghìn ---------------------------- */
// Dùng cho các trường: Sản lượng Min/Max, Doanh thu Min/Max, Số tiền CK cố định, Doanh thu kế hoạch...
// Gõ tới đâu tự format dấu phân cách tới đó (vd 1000000 -> 1.000.000), khi lưu sẽ đọc lại số gốc.
function fmtIntInputVal(v){
  if(v===''||v==null) return '';
  const n = Number(String(v).replace(/[^\d-]/g,''));
  return isNaN(n) ? '' : n.toLocaleString('vi-VN');
}
function liveFormatIntInput(el){
  const raw = el.value.replace(/[^\d-]/g,'');
  if(raw===''||raw==='-'){ el.value = raw; return; }
  const n = parseInt(raw,10);
  const caretAtEnd = el.selectionEnd === el.value.length;
  el.value = isNaN(n) ? '' : n.toLocaleString('vi-VN');
  if(caretAtEnd) el.selectionStart = el.selectionEnd = el.value.length;
}
window.liveFormatIntInput = liveFormatIntInput;
function rawIntVal(id){
  const el = document.getElementById(id);
  if(!el) return '';
  const digits = el.value.replace(/[^\d-]/g,'');
  return digits==='' ? '' : digits;
}

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}

function openModal(html, opts){
  const el = document.getElementById('modalBody');
  el.innerHTML = html;
  el.classList.toggle('modal-wide', !!(opts && opts.wide));
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeModal(); });

/* ---------------------------- Apps Script API Bridge ---------------------------- */
/* Cache cục bộ (localStorage): tránh phải tải lại toàn bộ Sheet (danh mục, chương trình, sổ mua hàng)
   mỗi lần mở lại ứng dụng nếu dữ liệu trên Sheet chưa thay đổi kể từ lần tải trước. */
const CACHE_KEY = 'ckapp_cache_v1';
function safeLocalGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
// TỐI ƯU: trước đây lỗi ghi cache (VD vượt quota 5MB của localStorage) bị NUỐT HOÀN TOÀN, im lặng —
// khiến app tưởng đã cache thành công nhưng thực ra lần mở sau vẫn phải tải lại từ đầu, không có cách
// nào biết vì sao. Nay: nếu ghi thất bại, THỬ XOÁ cache cũ (khả năng cao do rác cũ chiếm chỗ) rồi ghi
// lại 1 lần nữa; nếu vẫn thất bại thì log cảnh báo ra console (không làm phiền người dùng bằng toast,
// vì đây không phải lỗi nghiêm trọng — app vẫn chạy đúng, chỉ mất tác dụng cache).
function safeLocalSet(k,v){
  try{ localStorage.setItem(k,v); return true; }
  catch(e){
    try{ localStorage.removeItem(k); localStorage.setItem(k,v); return true; }
    catch(e2){ console.warn('Không thể ghi cache cục bộ (localStorage):', e2 && e2.message); return false; }
  }
}
function readCache(){
  const raw = safeLocalGet(CACHE_KEY);
  if(!raw) return null;
  try { return JSON.parse(raw); } catch(e){ return null; }
}
function writeCache(version, data){
  safeLocalSet(CACHE_KEY, JSON.stringify({ version: String(version), data, savedAt: Date.now() }));
}
// Google Sheets có thể tự động chuyển các cột chứa chuỗi dạng "2026-01-01" thành kiểu Date thật khi
// lưu; lần tải lại sau đó, google.script.run trả các ô đó về client dưới dạng đối tượng Date (không
// còn là chuỗi text), khiến các phép so sánh chuỗi ngày (VD khóa chống trùng khi lưu báo cáo, lọc theo
// khoảng ngày...) bị sai lệch. Chuẩn hóa lại thành chuỗi yyyy-MM-dd ngay khi nạp dữ liệu để toàn bộ
// phần còn lại của ứng dụng luôn làm việc với chuỗi nhất quán.
function normDateField(v){
  if(v==null || v==='') return v;
  if(typeof v === 'string') return v; // đã là chuỗi đúng định dạng, giữ nguyên
  return toISO(v); // đối tượng Date (hoặc khác) -> chuyển về yyyy-MM-dd theo giờ địa phương
}
function normalizeDateFields_(arr, fields){
  if(!Array.isArray(arr)) return;
  arr.forEach(o=>{ if(!o) return; fields.forEach(f=>{ if(f in o) o[f] = normDateField(o[f]); }); });
}
function applyLoadedData(data){
  DB.catalog = (data && data.catalog) || defaultCatalog();
  DB.programs = (data && data.programs) || [];
  DB.purchases = (data && data.purchases) || [];
  DB.programsLuyKe = (data && data.programsLuyKe) || [];
  DB.reportCKTH = (data && data.reportCKTH) || [];
  DB.reportCKCT = (data && data.reportCKCT) || [];
  DB.chuongtrinh = (data && data.chuongtrinh) || [];
  DB.dieukien = (data && data.dieukien) || [];
  DB.doanhthu = (data && data.doanhthu) || [];
  DB.kehoach = (data && data.kehoach) || [];
  DB.kehoachChiTiet = (data && data.kehoachChiTiet) || [];
  DB._lastLoadedAt = new Date(); // THEO GÓP Ý: ghi lại thời điểm tải dữ liệu gần nhất để hiển thị cho người dùng yên tâm
  normalizeDateFields_(DB.purchases, ['ngay']);
  normalizeDateFields_(DB.programs, ['hieuluctu','hieulucden']);

  normalizeDateFields_(DB.reportCKTH, ['ngay_tinh','tu_ngay','den_ngay']);
  normalizeDateFields_(DB.reportCKCT, ['ngay_tinh','tu_ngay','den_ngay']);
  normalizeDateFields_(DB.kehoach, ['ngaylap','hieuluctu','hieulucden']);
  normalizeDateFields_(DB.kehoachChiTiet, ['tu_ngay','den_ngay']);
  ensureNO();
  migrateProgramsToDoanhThu_(); // MỚI: tự tạo "Mã doanh thu" cho các Mã chiết khấu cũ chưa có (chạy nền)
}
// TỐI ƯU (giảm dung lượng cache localStorage, tránh vượt quota 5MB): trước đây snapshot cache đưa cả
// Giá công bố (DB.catalog.giacongbo, ~1.365 dòng) và Sổ chi tiết mua hàng (DB.purchases, ~1.435 dòng)
// vào localStorage — đây là 2 bảng LỚN NHẤT và TĂNG DẦN theo thời gian, dễ khiến cache vượt quota rồi
// âm thầm không lưu được (trước đây không có cảnh báo gì, xem safeLocalSet ở trên). Nay CHỦ ĐỘNG loại
// bỏ 2 bảng này khỏi cache — không ảnh hưởng tính đúng đắn vì 2 bảng này ĐÃ CÓ SẴN cơ chế tải riêng
// theo chunk (ensureGiaCongBoLoaded/ensurePurchasesLoaded), tự tải ngay khi người dùng vào đúng menu
// cần dùng, có thanh tiến độ + tự thử lại — bền hơn nhiều so với 1 khối cache lớn trong localStorage.
function snapshotDB(){
  const catalogLight = Object.assign({}, DB.catalog);
  delete catalogLight.giacongbo;
  return { catalog: catalogLight, programs: DB.programs, programsLuyKe: DB.programsLuyKe, reportCKTH: DB.reportCKTH, reportCKCT: DB.reportCKCT, chuongtrinh: DB.chuongtrinh, dieukien: DB.dieukien, doanhthu: DB.doanhthu, kehoach: DB.kehoach, kehoachChiTiet: DB.kehoachChiTiet };
}
// Gọi 1 hàm server qua google.script.run dạng Promise (đơn giản, tuần tự, không có logic thử lại
// phức tạp — bản trước dùng tự động thử lại song song nhưng gây tranh chấp/kết quả chập chờn).
function callServerFn_(fnName, args){
  args = args || [];
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](...args);
  });
}
// TỐI ƯU: gộp chung 3 vòng lặp "thử lại" gần như giống hệt nhau (cho hàm không tham số, hàm có
// offset/limit, hàm đếm dòng) thành 1 hàm dùng chung duy nhất — nhận vào 1 hàm gọi Promise bất kỳ.
function retryCall_(invokeFn, isEmpty, maxRetries, delayMs){
  maxRetries = maxRetries==null ? 2 : maxRetries;
  delayMs = delayMs==null ? 1200 : delayMs;
  let attempt = 0;
  function tryOnce(){
    attempt++;
    return invokeFn()
      .then(res => {
        let empty = false;
        try { empty = isEmpty ? isEmpty(res) : false; } catch(e) { empty = true; }
        if (empty && attempt <= maxRetries) {
          return new Promise(r => setTimeout(r, delayMs)).then(tryOnce);
        }
        return res;
      })
      .catch(err => {
        if (attempt <= maxRetries) {
          return new Promise(r => setTimeout(r, delayMs)).then(tryOnce);
        }
        throw err;
      });
  }
  return tryOnce();
}
// Gọi tuần tự, tự động thử lại nếu lỗi hoặc kết quả rỗng bất thường — dùng ĐÚNG cách gọi "1 lần,
// đợi, rồi gọi tiếp" đã được kiểm chứng ổn định 10/10 qua nút "Test kết nối cơ bản".
function callServerFnRetry_(fnName, isEmpty, maxRetries, delayMs, args){
  return retryCall_(() => callServerFn_(fnName, args), isEmpty, maxRetries, delayMs);
}
function fullReloadFromSheet(resolve, reject){
  // THEO Ý KIẾN NGƯỜI DÙNG: lúc mở app chỉ tải phần NHẸ (danh mục nhỏ + chương trình chiết khấu —
  // dưới 100 dòng) để mở nhanh, ổn định, gần như không thể timeout. Giá công bố (1.365 dòng) và
  // Mua hàng (1.435 dòng) KHÔNG tự tải nữa — mỗi menu đó sẽ tự tải riêng khi người dùng vào tới,
  // qua ensureGiaCongBoLoaded()/ensurePurchasesLoaded() bên dưới.
  callServerFnRetry_('loadCoreData', r => !r || !r.catalog || !Array.isArray(r.programs), 2, 1500)
    .then(core => {
      if (!core || !core.catalog) throw new Error('Không tải được Danh mục/Chương trình sau nhiều lần thử.');
      core.catalog.giacongbo = DB._giacongboLoaded ? DB.catalog.giacongbo : [];
      core.purchases = DB._purchasesLoaded ? DB.purchases : [];
      // DM_DIEUKIEN (bậc điều kiện con của mã chiết khấu) nay tải riêng theo chunk — cùng cơ chế
      // phòng ngừa timeout như Giá công bố/Mua hàng, sẵn sàng chịu được khi dữ liệu tăng dần theo
      // thời gian mà không cần đổi gì thêm ở đây.
      return loadInChunks_('getDieuKienRowCount', 'loadDieuKienChunk', 500)
        .then(res => { core.dieukien = rowsToObjects_(res.headers, res.rows); return core; });
    })
    .then(core => {
      applyLoadedData(core);
      if (core.version) writeCache(core.version, snapshotDB());
      resolve();
    })
    .catch(reject);
}
// Ráp lại mảng {headers, rows} (định dạng gọn từ server) thành mảng object như cũ, để phần còn lại
// của app không cần đổi gì thêm.
function rowsToObjects_(headers, rows){
  if(!Array.isArray(headers) || !Array.isArray(rows)) return [];
  return rows.map(r => { const o={}; headers.forEach((h,i)=> o[h]=r[i]); return o; });
}
// SỬA LỖI: cách gọi động "[tenHam](...args)" khi ghép với việc TRUYỀN THAM SỐ (offset, limit) không
// tới được máy chủ (không có bản ghi thực thi nào trong Executions — nghĩa là lỗi xảy ra ngay ở trình
// duyệt, trước khi gửi yêu cầu đi). Nay gọi TƯỜNG MINH bằng tên hàm cụ thể, không qua cách gọi động.
function callChunkFn_(chunkFnName, offset, limit, extraArg){
  return new Promise((resolve, reject) => {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    if (chunkFnName === 'loadPurchasesChunk') runner.loadPurchasesChunk(offset, limit);
    else if (chunkFnName === 'loadGiaCongBoChunk') runner.loadGiaCongBoChunk(offset, limit);
    else if (chunkFnName === 'loadDieuKienChunk') runner.loadDieuKienChunk(offset, limit);
    else if (chunkFnName === 'loadPurchasesChunkBySupplier') runner.loadPurchasesChunkBySupplier(extraArg, offset, limit);
    else reject(new Error('Hàm tải gói không xác định: ' + chunkFnName));
  });
}
function callChunkFnRetry_(chunkFnName, offset, limit, isEmpty, maxRetries, delayMs, extraArg){
  return retryCall_(() => callChunkFn_(chunkFnName, offset, limit, extraArg), isEmpty, maxRetries, delayMs);
}
// Tương tự cho hàm đếm tổng dòng (không tham số, nhưng để đồng bộ cách gọi tường minh luôn)
function callCountFn_(countFnName, extraArg){
  return new Promise((resolve, reject) => {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    if (countFnName === 'getPurchasesRowCount') runner.getPurchasesRowCount();
    else if (countFnName === 'getGiaCongBoRowCount') runner.getGiaCongBoRowCount();
    else if (countFnName === 'getDieuKienRowCount') runner.getDieuKienRowCount();
    else if (countFnName === 'getPurchasesRowCountBySupplier') runner.getPurchasesRowCountBySupplier(extraArg);
    else reject(new Error('Hàm đếm dòng không xác định: ' + countFnName));
  });
}
function callCountFnRetry_(countFnName, maxRetries, delayMs, extraArg){
  return retryCall_(() => callCountFn_(countFnName, extraArg), null, maxRetries, delayMs);
}
// Tải 1 sheet lớn theo TỪNG GÓI NHỎ (chunk), gọi lần lượt cho tới khi đủ — mỗi gói luôn nhỏ, không
// bao giờ đủ lớn để bị lỗi truyền qua kênh giao tiếp iframe của Apps Script. onProgress(loaded, total)
// để hiện tiến độ cho người dùng thấy trong lúc chờ.
// THEO YÊU CẦU: thêm tham số extraArg (tuỳ chọn) để truyền thêm điều kiện lọc (VD danh sách Nhà cung
// cấp) xuống hàm đếm/hàm tải gói tương ứng — dùng cho ensurePurchasesLoadedFiltered() bên dưới. Hoàn
// toàn tương thích ngược: các lượt gọi cũ không truyền extraArg vẫn hoạt động y hệt trước (undefined).
async function loadInChunks_(countFnName, chunkFnName, chunkSize, onProgress, extraArg){
  const countRes = await callCountFnRetry_(countFnName, 2, 1500, extraArg);
  const total = (countRes && countRes.total) || 0;
  if (total === 0) return { headers: [], rows: [] };
  let headers = [];
  const allRows = [];
  let offset = 0;
  while (offset < total) {
    if (onProgress) onProgress(offset, total);
    const chunk = await callChunkFnRetry_(chunkFnName, offset, chunkSize, r => !r || !Array.isArray(r.rows), 2, 1200, extraArg);
    if (!chunk || !Array.isArray(chunk.rows)) throw new Error('Không tải được gói dữ liệu tại vị trí ' + offset + '.');
    if (chunk.headers && chunk.headers.length) headers = chunk.headers;
    allRows.push(...chunk.rows);
    // SỬA LỖI: trước đây nếu 1 gói (chunk) trả về 0 dòng (VD gặp 1 khoảng dòng TRẮNG dài hơn
    // chunkSize nằm giữa sheet) thì dừng vòng lặp NGAY, coi như đã hết dữ liệu — nhưng thực tế phía
    // sau khoảng trắng đó vẫn có thể còn dữ liệu thật, bị bỏ sót mà không báo lỗi gì. offset tính theo
    // VỊ TRÍ DÒNG TRONG SHEET (không phải số dòng đã lọc được), nên điều kiện while(offset < total) ở
    // trên đã tự đảm bảo vòng lặp luôn dừng đúng lúc — không cần "đoán" hết dữ liệu qua độ dài gói.
    offset += chunkSize;
  }
  if (onProgress) onProgress(total, total);
  return { headers, rows: allRows };
}
// Tải riêng dữ liệu Giá công bố khi cần (lần đầu vào menu, hoặc bấm "Nạp lại dữ liệu").
// force=true để bỏ qua cờ đã tải, tải lại mới hoàn toàn.
async function ensureGiaCongBoLoaded(force){
  if (DB._giacongboLoaded && !force) return;
  const res = await loadInChunks_('getGiaCongBoRowCount', 'loadGiaCongBoChunk', 300,
    (loaded, total) => loadingPane_(`Đang tải Giá công bố... ${loaded}/${total} dòng`));
  const newData = rowsToObjects_(res.headers, res.rows);
  // BẢO VỆ DỮ LIỆU: nếu đang có sẵn dữ liệu đúng (từ lần tải trước) mà lần tải lại này về rỗng bất
  // thường (dù không báo lỗi kỹ thuật), KHÔNG ghi đè mất — giữ nguyên dữ liệu cũ và báo rõ cho người
  // dùng biết, thay vì âm thầm xóa sạch bảng đang hiển thị đúng.
  if (newData.length === 0 && DB._giacongboLoaded && DB.catalog.giacongbo.length > 0) {
    throw new Error('Máy chủ trả về 0 dòng bất thường — đã GIỮ NGUYÊN dữ liệu cũ, chưa ghi đè. Vui lòng thử lại sau ít phút.');
  }
  DB.catalog.giacongbo = newData;
  normalizeDateFields_(DB.catalog.giacongbo, ['hieuluctu','hieulucden']);
  DB._giacongboLoaded = true;
}
window.ensureGiaCongBoLoaded = ensureGiaCongBoLoaded;
// Tải riêng dữ liệu Sổ chi tiết mua hàng khi cần (bấm "Áp dụng bộ lọc" lần đầu, hoặc "Nạp lại dữ liệu").
async function ensurePurchasesLoaded(force){
  // SỬA quan trọng: kiểm tra scope==='all' (đã tải ĐẦY ĐỦ) thay vì chỉ _purchasesLoaded — vì
  // _purchasesLoaded có thể đang true do trước đó người dùng chỉ mới tải LỌC theo 1 vài NCC ở tab Sổ
  // chi tiết mua hàng (xem ensurePurchasesLoadedFiltered bên dưới). Nếu chỉ kiểm tra _purchasesLoaded,
  // các nơi cần dữ liệu ĐẦY ĐỦ (Tổng quan/Tính CK/Báo cáo/Đối chiếu) sẽ SAI SỐ vì tính thiếu NCC.
  if (purchasesFullyLoaded_() && !force) return;
  const res = await loadInChunks_('getPurchasesRowCount', 'loadPurchasesChunk', 300,
    (loaded, total) => loadingPane_(`Đang tải Sổ chi tiết mua hàng... ${loaded}/${total} dòng`));
  const newData = rowsToObjects_(res.headers, res.rows);
  if (newData.length === 0 && DB._purchasesLoaded && DB.purchases.length > 0) {
    throw new Error('Máy chủ trả về 0 dòng bất thường — đã GIỮ NGUYÊN dữ liệu cũ, chưa ghi đè. Vui lòng thử lại sau ít phút.');
  }
  DB.purchases = newData;

window.ensurePurchasesLoaded = ensurePurchasesLoaded;
// THEO YÊU CẦU: chỉ tải dữ liệu Mua hàng của CÁC NHÀ CUNG CẤP ĐƯỢC CHỌN — dùng riêng cho tab "Sổ chi
// tiết mua hàng" khi người dùng chủ động chọn 1 vài NCC cần xem thay vì toàn bộ ~1.400+ dòng. TUYỆT ĐỐI
// KHÔNG dùng hàm này ở bất kỳ nơi nào khác cần dữ liệu đầy đủ để tính chiết khấu (Tổng quan/Tính
// CK/Báo cáo/Đối chiếu) — các nơi đó phải dùng ensurePurchasesLoaded() (tải toàn bộ) như cũ.
async function ensurePurchasesLoadedFiltered(suppliers, force){
  const wanted = (suppliers||[]).slice().sort();
  const key = wanted.join('|');
  const currentKey = Array.isArray(DB._purchasesScope) ? DB._purchasesScope.slice().sort().join('|') : '';
  if (!force && purchasesFullyLoaded_()) return; // đã có sẵn toàn bộ rồi thì khỏi cần tải lọc lại
  if (!force && currentKey === key && DB._purchasesLoaded) return; // đã tải đúng đúng bộ NCC này rồi
  const res = await loadInChunks_('getPurchasesRowCountBySupplier', 'loadPurchasesChunkBySupplier', 300,
    (loaded, total) => loadingPane_(`Đang tải Sổ chi tiết mua hàng (${wanted.length} NCC đã chọn)... ${loaded}/${total} dòng`), wanted);
  const newData = rowsToObjects_(res.headers, res.rows);
  DB.purchases = newData;
  normalizeDateFields_(DB.purchases, ['ngay']);
  DB._purchasesLoaded = true;
  DB._purchasesScope = wanted;
}
window.ensurePurchasesLoadedFiltered = ensurePurchasesLoadedFiltered;
function loadAll() {
  return new Promise((resolve, reject) => {
    try {
      // Bước 1: chỉ hỏi phiên bản dữ liệu hiện tại (rất nhẹ, không đọc toàn bộ Sheet)
      google.script.run
        .withSuccessHandler((version) => {
          const cached = readCache();
          if (cached && cached.data && String(cached.version) === String(version)) {
            // Dữ liệu chưa đổi kể từ lần tải trước -> dùng lại cache, không cần tải lại Sheet
            applyLoadedData(cached.data);
            // Nếu cache có sẵn dữ liệu Giá công bố/Mua hàng (từ lần trước người dùng đã từng vào các
            // menu đó), coi như đã tải — khỏi bắt tải lại ngay; nếu cache rỗng phần này thì vẫn cần
            // tải khi người dùng vào đúng menu.
            DB._giacongboLoaded = (DB.catalog.giacongbo||[]).length > 0;
            DB._purchasesLoaded = (DB.purchases||[]).length > 0;
            DB._purchasesScope = DB._purchasesLoaded ? 'all' : null;
            resolve();
            return;
          }
          // Dữ liệu đã đổi (hoặc chưa có cache) -> tải đầy đủ 1 lần rồi lưu cache
          fullReloadFromSheet(resolve, reject);
        })
        .withFailureHandler(() => {
          // Không lấy được phiên bản (VD lần đầu deploy) -> tải đầy đủ như bình thường
          fullReloadFromSheet(resolve, reject);
        })
        .getDataVersion();
    } catch (e) {
      reject(e);
    }
  });
}
// Ép tải lại TOÀN BỘ dữ liệu trực tiếp từ Google Sheet thật, bỏ qua cache — dùng khi nghi ngờ dữ liệu
// hiển thị chưa đúng (VD vừa sửa tay trực tiếp trên Sheet) hoặc muốn chắc chắn 100% là bản mới nhất.
function forceRefreshData(){
  toast('Đang tải lại dữ liệu từ Google Sheet...', 'ok');
  const wasGcbLoaded = DB._giacongboLoaded;
  const wasPurScope = DB._purchasesScope; // 'all' | mảng NCC đã lọc | null (chưa tải gì)
  new Promise((resolve, reject) => fullReloadFromSheet(resolve, reject))
    .then(async () => {
      // Nếu trước đó Giá công bố/Mua hàng đã từng được tải, tải lại luôn phần đó cho mới nhất
      // (vì fullReloadFromSheet giờ chỉ tải phần nhẹ theo mặc định).
      if (wasGcbLoaded) await ensureGiaCongBoLoaded(true);
      // THEO YÊU CẦU: nếu trước đó người dùng chỉ đang xem Mua hàng LỌC theo 1 số NCC (ở tab Sổ chi
      // tiết mua hàng), "Làm mới dữ liệu" cũng chỉ tải lại ĐÚNG các NCC đó — không âm thầm tải lại
      // TOÀN BỘ ~1.400+ dòng (đi ngược lại đúng mục đích giảm tải mà tính năng lọc NCC hướng tới).
      if (wasPurScope === 'all') await ensurePurchasesLoaded(true);
      else if (Array.isArray(wasPurScope) && wasPurScope.length) await ensurePurchasesLoadedFiltered(wasPurScope, true);
      toast('Đã tải lại dữ liệu mới nhất từ Sheet', 'ok');
      try{
        renderShell();
      }catch(renderErr){
        toast('⚠ Lỗi khi vẽ giao diện: ' + (renderErr && renderErr.message ? renderErr.message : renderErr), 'err');
        console.error('renderShell error:', renderErr);
      }
    })
    .catch((err) => {
      toast('Lỗi tải lại dữ liệu: ' + (err && err.message ? err.message : err), 'err');
    });
}

  google.script.run
    .withSuccessHandler((info) => {
      // SỬA LỖI: trước đây chẩn đoán chỉ đếm SỐ DÒNG THÔ trong sheet (getLastRow()-1), không kiểm tra
      // xem hàm loadAllData() (hàm THẬT SỰ app dùng để tải dữ liệu lên giao diện) có đọc và phân tích
      // được đúng dữ liệu đó hay không. Nay gọi thêm chính loadAllData() để so sánh trực tiếp — nếu số

      // CỘT (row 1 không đúng tên cột script cần), không cần mở Console/DevTools để kiểm tra nữa.
      google.script.run

        DM_LOAISP: (real.catalog.loaisp||[]).length,

        SO_CHI_TIET_MUA_HANG: (real.purchases||[]).length,
        CHUONGTRINHCHIETKHAU_LUYKE: (real.programsLuyKe||[]).length,
        REPORT_CKTH: (real.reportCKTH||[]).length,
        REPORT_CKCT: (real.reportCKCT||[]).length
      } : {};
      const rowsHtml = info.expected.map(e => {
        const realCount = real ? (realCounts[e.expectedName] ?? 0) : null;
        const mismatch = real && e.rowCount>0 && realCount===0;
        return `
        <div class="rowline" style="justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--slate-100);${mismatch?'background:#fff1f1':''}">
          <span class="mono" style="font-size:12.5px">${esc(e.expectedName)}</span>
          <span style="display:flex;align-items:center;gap:10px;flex-shrink:0">

            <span class="mono" style="font-size:12.5px;min-width:75px;text-align:right;font-weight:700;color:${e.found && e.rowCount>0 ? 'var(--emerald-dark)' : 'var(--red)'}">${e.found ? fmtNum(e.rowCount)+' dòng thô' : '—'}</span>
            <span class="mono" style="font-size:12.5px;min-width:90px;text-align:right;font-weight:700;color:${mismatch?'var(--red)':'var(--navy-700)'}">${real ? (mismatch ? '⚠ 0 đọc được' : fmtNum(realCount)+' đọc được') : (realErr?'lỗi':'—')}</span>

      }).join('');

        <div class="field"><label>So sánh: số dòng thô trong Sheet vs. số dòng loadAllData() thực sự đọc được</label>
          <div style="border:1px solid var(--slate-200);border-radius:8px;overflow:hidden">${rowsHtml}</div>
        </div>

        ${totalRows===0
          ? `<div class="section-note" style="border-color:var(--red);color:var(--red)">⚠ TẤT CẢ các sheet đều 0 dòng dữ liệu. Đây không phải lỗi đọc sai file/sai tên — file và tên sheet đã khớp đúng. Vấn đề nằm ở chỗ khác, xem hướng dẫn bên dưới.</div>`

          : `<div class="section-note" style="border-color:var(--emerald);color:var(--emerald-dark)">✓ Tổng ${fmtNum(totalRows)} dòng dữ liệu được đọc thấy, và loadAllData() đọc đúng khớp số dòng. Nếu app vẫn hiện 0 ở giao diện, vấn đề nằm ở khâu hiển thị (render), báo lại cho người hỗ trợ.</div>`}
        <div class="btn-row" style="justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" onclick="closeModal()">Đóng</button></div>

// ===== TEST KẾT NỐI TỐI GIẢN: gọi ping() 10 lần liên tiếp (không đọc/ghi Sheet) để xác định xem
// vấn đề chập chờn nằm ở KẾT NỐI CƠ BẢN (mạng/hạ tầng Google) hay ĐẶC THÙ Ở VIỆC ĐỌC SHEET. =====
function pingTest10x(){
  openModal(`<h3>Đang kiểm tra kết nối cơ bản (10 lần)...</h3><div id="pingResults" class="mono" style="font-size:12.5px;white-space:pre-line;padding:10px;background:var(--slate-50);border-radius:8px;border:1px solid var(--slate-200);min-height:200px"></div>`);
  const results = [];
  const resultsEl = () => document.getElementById('pingResults');
  function render(){
    const el = resultsEl();
    if(!el) return;
    el.textContent = results.map((r,i)=>`Lần ${i+1}: ${r.ok ? '✓ OK ('+r.ms+'ms)' : '✗ LỖI: '+r.err}`).join('\n');
  }
  function runOne(i){
    const t0 = Date.now();
    google.script.run
      .withSuccessHandler((res)=>{
        results.push({ok:true, ms: Date.now()-t0});
        render();
        if(i<9) setTimeout(()=>runOne(i+1), 200); else finish();
      })
      .withFailureHandler((err)=>{
        results.push({ok:false, err: (err&&err.message)||String(err)});
        render();
        if(i<9) setTimeout(()=>runOne(i+1), 200); else finish();
      })
      .ping();
  }
  function finish(){
    const okCount = results.filter(r=>r.ok).length;
    const el = resultsEl();
    if(el){
      el.textContent += `\n\n— Kết quả: ${okCount}/10 lần thành công —`;
      el.textContent += okCount===10
        ? '\n✓ Kết nối cơ bản hoàn toàn ổn định. Nếu app vẫn lỗi đọc Sheet chập chờn, vấn đề nằm riêng ở việc ĐỌC DỮ LIỆU (Sheet lớn/timeout), không phải do kết nối mạng.'
        : '\n⚠ Ngay cả kết nối cơ bản (không đụng Sheet) cũng chập chờn — nhiều khả năng do MẠNG/TRÌNH DUYỆT lúc này, không phải do code đọc Sheet.';
    }
  }
  runOne(0);
}

function runFormulaTests(){
  const results = [];
  function test(name, fn){
    try{ fn(); results.push({ name, ok:true }); }
    catch(e){ results.push({ name, ok:false, err: e.message||String(e) }); }
  }
  function assertEqual(actual, expected, label){
    if(actual !== expected) throw new Error(`${label||''} kỳ vọng ${JSON.stringify(expected)}, thực tế ${JSON.stringify(actual)}`);
  }
  function assertClose(actual, expected, label, eps){
    eps = eps==null?0.001:eps;
    if(Math.abs(actual-expected) > eps) throw new Error(`${label||''} kỳ vọng ~${expected}, thực tế ${actual}`);
  }
  function assertTrue(cond, label){ if(!cond) throw new Error(label||'Điều kiện phải đúng (true)'); }

  /* ---- dimsMatch ---- */
  const allNo = {thuonghieu:'NO',nhomkh:'NO',loaisp:'NO',dactinh:'NO',congdung:'NO',quycach:'NO'};
  test('dimsMatch: chương trình chọn NO ở 1 cột -> bỏ qua, luôn khớp cột đó', ()=>{
    assertTrue(dimsMatch({...allNo, thuonghieu:'CASU'}, allNo));
  });
  test('dimsMatch: khớp đúng giá trị cụ thể', ()=>{
    assertTrue(dimsMatch({...allNo, thuonghieu:'CASU'}, {...allNo, thuonghieu:'CASU'}));
  });
  test('dimsMatch: không khớp khi giá trị khác nhau', ()=>{
    assertTrue(!dimsMatch({...allNo, thuonghieu:'CASU'}, {...allNo, thuonghieu:'BRIDGESTONE'}));
  });
  test('dimsMatch: mã hỗn hợp "TBR,BIAS" khớp nếu sản phẩm thuộc 1 trong 2 mã', ()=>{
    assertTrue(dimsMatch({...allNo, loaisp:'TBR'}, {...allNo, loaisp:'TBR,BIAS'}));
    assertTrue(dimsMatch({...allNo, loaisp:'BIAS'}, {...allNo, loaisp:'TBR,BIAS'}));
    assertTrue(!dimsMatch({...allNo, loaisp:'PCR'}, {...allNo, loaisp:'TBR,BIAS'}));
  });

  /* ---- periodOverlap ---- */
  test('periodOverlap: 2 khoảng có giao nhau -> true', ()=>{
    assertTrue(periodOverlap('2026-01-01','2026-01-31','2026-01-15','2026-02-15'));
  });
  test('periodOverlap: 2 khoảng tách rời -> false', ()=>{
    assertTrue(!periodOverlap('2026-01-01','2026-01-31','2026-02-01','2026-02-28'));
  });
  test('periodOverlap: hiệu lực chương trình để trống -> luôn coi là còn hiệu lực', ()=>{
    assertTrue(periodOverlap('2026-01-01','2026-01-31','',''));
  });

  /* ---- inBracket ---- */
  test('inBracket: max=0 nghĩa là KHÔNG giới hạn trên (quy ước riêng của app)', ()=>{
    assertTrue(inBracket(999999999, 100, 0));
  });
  test('inBracket: min/max để trống -> không giới hạn cả 2 phía', ()=>{
    assertTrue(inBracket(-500, '', ''));
  });
  test('inBracket: đúng tại 2 biên min/max, sai ngay ngoài biên', ()=>{
    assertTrue(inBracket(100, 100, 200) && inBracket(200, 100, 200));
    assertTrue(!inBracket(99.99, 100, 200) && !inBracket(200.01, 100, 200));
  });

  /* ---- checkSlDtBracket: logic AND/OR giữa bậc Sản lượng và Doanh thu ---- */
  test('checkSlDtBracket: AND -> phải đạt CẢ 2 điều kiện', ()=>{
    const prog = {sl_min:100, sl_max:0, dt_min:1000000, dt_max:0, dieukien_sldt:'AND'};
    assertTrue(checkSlDtBracket(prog, 150, 2000000).dat);
    assertTrue(!checkSlDtBracket(prog, 150, 500000).dat, 'DT chưa đạt thì AND phải KHÔNG đạt');
  });
  test('checkSlDtBracket: OR -> chỉ cần đạt 1 TRONG 2', ()=>{
    const prog = {sl_min:100, sl_max:0, dt_min:1000000, dt_max:0, dieukien_sldt:'OR'};
    assertTrue(checkSlDtBracket(prog, 150, 500000).dat, 'SL đạt thì OR phải đạt dù DT chưa đạt');
  });

  /* ---- calcDiscountForProgram: 3 hình thức chiết khấu ---- */
  test('calcDiscountForProgram: % theo giá mua (PERCENT_GIAMUA)', ()=>{
    assertClose(calcDiscountForProgram({ht_chietkhau:'PERCENT_GIAMUA', tl_ck:5}, 100, 1000000, 0), 50000);
  });
  test('calcDiscountForProgram: % theo giá công bố (PERCENT_GIACONGBO)', ()=>{
    assertClose(calcDiscountForProgram({ht_chietkhau:'PERCENT_GIACONGBO', tl_ck:10}, 100, 0, 20000), 200000);
  });
  test('calcDiscountForProgram: đơn giá cố định (DONGIA_CODINH)', ()=>{
    assertClose(calcDiscountForProgram({ht_chietkhau:'DONGIA_CODINH', dongia_codinh:1500}, 100, 0, 0), 150000);
  });
  test('calcDiscountForProgram: hình thức không xác định -> trả 0đ (không lỗi)', ()=>{
    assertEqual(calcDiscountForProgram({ht_chietkhau:'KHONG_TON_TAI'}, 100, 1000000, 0), 0);
  });

  /* ---- giaMuaBinhQuan ---- */
  test('giaMuaBinhQuan: SL=0 -> trả 0 (không chia cho 0 ra lỗi/NaN)', ()=>{
    assertEqual(giaMuaBinhQuan(0, 500000), 0);
  });
  test('giaMuaBinhQuan: tính đúng giá bình quân = DT/SL', ()=>{
    assertClose(giaMuaBinhQuan(100, 1000000), 10000);
  });

  /* ---- resolveEffectiveBac_: mô hình 3 tầng, bậc điều kiện con (DB.dieukien) ---- */
  const dieukienBackup = DB.dieukien;
  try{
    test('resolveEffectiveBac_: không có bậc con -> dùng thẳng chính CT (tương thích ngược)', ()=>{
      DB.dieukien = [];
      const prog = {id:'P1', sl_min:0, sl_max:0, dt_min:0, dt_max:0, tl_ck:5};
      const r = resolveEffectiveBac_(prog, 100, 100);
      assertTrue(!r.noBacMatched);

    });
    test('resolveEffectiveBac_: có bậc con, chọn đúng bậc khớp SL thực tế', ()=>{
      DB.dieukien = [
        { id:'D1', program_id:'P1', sl_min:0, sl_max:99, dt_min:0, dt_max:0, tl_ck:3 },
        { id:'D2', program_id:'P1', sl_min:100, sl_max:0, dt_min:0, dt_max:0, tl_ck:7 }
      ];
      const r = resolveEffectiveBac_({id:'P1', tl_ck:0}, 150, 0);
      assertEqual(r.matchedBac.id, 'D2');
      assertEqual(r.effective.tl_ck, 7);
    });
    test('resolveEffectiveBac_: nhiều bậc chồng lấn -> ưu tiên tỷ lệ CK CAO NHẤT', ()=>{
      DB.dieukien = [
        { id:'D1', program_id:'P1', sl_min:0, sl_max:0, dt_min:0, dt_max:0, tl_ck:3 },
        { id:'D2', program_id:'P1', sl_min:0, sl_max:0, dt_min:0, dt_max:0, tl_ck:9 }
      ];
      assertEqual(resolveEffectiveBac_({id:'P1'}, 10, 10).matchedBac.id, 'D2');
    });
    test('resolveEffectiveBac_: có bậc con nhưng KHÔNG bậc nào khớp -> noBacMatched=true', ()=>{
      DB.dieukien = [{ id:'D1', program_id:'P1', sl_min:1000, sl_max:0, dt_min:0, dt_max:0, tl_ck:5 }];
      assertTrue(resolveEffectiveBac_({id:'P1'}, 10, 10).noBacMatched);
    });
  } finally {
    DB.dieukien = dieukienBackup;
  }

  /* ---- snapPeriodFromDate: chuẩn hoá ranh giới kỳ (nền tảng của cơ chế chống trùng báo cáo) ---- */
  test('snapPeriodFromDate: Tháng -> đúng ngày 1 và ngày cuối tháng', ()=>{
    const r = snapPeriodFromDate('2026-07-15', 'Tháng');
    assertEqual(r.from, '2026-07-01'); assertEqual(r.to, '2026-07-31');
  });

    const r = snapPeriodFromDate('2026-08-10', 'Quý'); // tháng 8 -> Quý 3 (7,8,9)
    assertEqual(r.from, '2026-07-01'); assertEqual(r.to, '2026-09-30');
  });
  test('snapPeriodFromDate: "Tùy chọn" -> không tự quy đổi (trả null)', ()=>{
    assertEqual(snapPeriodFromDate('2026-07-15', ''), null);
  });

  /* ---- Bài test tích hợp: computeReport() trên dữ liệu mua hàng + chương trình giả lập ---- */

  try{
    DB = {

// TỐI ƯU (gộp code trùng lặp): trước đây mỗi hàm saveXxx() dưới đây là 1 khối Promise gần như giống
// hệt nhau, chỉ khác tên hàm server + dữ liệu truyền vào. Nay dùng chung 1 hàm saveToSheet_() để giảm
// trùng lặp và đảm bảo mọi nơi lưu đều cùng 1 cách xử lý phiên bản/cache.
// SỬA LỖI: trước đây không có withFailureHandler — nếu server báo lỗi (VD "hệ thống đang bận xử lý
// một lượt lưu khác" khi 2 người cùng lưu, hoặc từ chối quyền truy cập), Promise TREO VĨNH VIỄN, nút
// Lưu không phản hồi mà cũng không có thông báo lỗi nào cho người dùng biết nguyên nhân. Nay bắt lỗi
// rõ ràng và báo qua toast, đồng thời NÉM LẠI lỗi (reject) để nơi gọi (openXxxForm/saveXxxForm) có thể
// tự xử lý thêm nếu cần (VD không đóng modal khi lưu thất bại).
function saveToSheet_(serverFnName, dataRef){
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler((version) => {
        writeCache(version, snapshotDB());
        res(true);
      })
      .withFailureHandler((err) => {
        toast('⚠ Lưu thất bại: ' + (err && err.message ? err.message : err), 'err');
        rej(err);
      })
      [serverFnName](dataRef);
  });
}
// SỬA LỖI HIỆU NĂNG: trước đây saveCatalog() luôn gửi NGUYÊN object DB.catalog (gồm cả MHCK và Giá
// công bố — có thể hơn 1.300 dòng) lên server mỗi khi chỉ sửa 1 dòng ở 1 danh mục nhỏ (VD Thương
// hiệu), khiến server ghi đè lại toàn bộ sheet MHCK/Giá công bố không cần thiết mỗi lần lưu, vừa
// chậm vừa tốn quota Apps Script. Nay tách thành 3 hàm riêng — mỗi hàm chỉ gửi đúng phần dữ liệu
// thực sự thay đổi:
//  - saveCatalogDims(): 6 danh mục kích thước nhỏ (thương hiệu, nhóm hàng, loại SP, đặc tính, công
//    dụng, quy cách) — dùng khi sửa/xóa các danh mục này.
//  - saveMhck(): riêng bảng Mã hàng → Nhóm chiết khấu.

async function saveCatalogDims(){
  const dims = {};
  DIM_KEYS.forEach(k => { dims[k] = DB.catalog[k]; });
  return saveToSheet_('saveCatalogData', dims);
}

// Lưu báo cáo chiết khấu (cộng dồn trên Sheet) — cập nhật lại DB.reportCKTH/CKCT cục bộ theo kiểu
// upsert tương tự để lần "Tính chiết khấu bổ sung" tiếp theo trong CÙNG phiên làm việc dùng được ngay,
// không cần đợi tải lại từ Sheet.
function upsertLocal(arr, rows, keyFn){
  rows.forEach(r=>{
    const k = keyFn(r);
    const i = arr.findIndex(x=>keyFn(x)===k);
    if(i>-1) arr[i] = Object.assign({}, arr[i], r); else arr.push(r);
  });
}
// SỬA LỖI: bổ sung withFailureHandler ở cả 2 lượt gọi (trước đây thiếu, lỗi từ server bị treo im lặng
// — xem giải thích chi tiết tại saveToSheet_ phía trên).
async function saveReportToSheet(ckthRows, ckctRows){
  await new Promise((res, rej)=>{
    google.script.run
      .withSuccessHandler((version)=>{
        upsertLocal(DB.reportCKTH, ckthRows, r=>[r.program_id,r.tu_ngay,r.den_ngay].join('||'));
        writeCache(version, snapshotDB());
        res(true);
      })
      .withFailureHandler((err)=>{
        toast('⚠ Lưu báo cáo tổng hợp thất bại: ' + (err && err.message ? err.message : err), 'err');
        rej(err);
      })
      .saveReportCKTH(ckthRows);
  });
  await new Promise((res, rej)=>{
    google.script.run
      .withSuccessHandler((version)=>{
        upsertLocal(DB.reportCKCT, ckctRows, r=>[r.program_id,r.tu_ngay,r.den_ngay,r.mahang].join('||'));
        writeCache(version, snapshotDB());
        res(true);
      })
      .withFailureHandler((err)=>{
        toast('⚠ Lưu báo cáo chi tiết thất bại: ' + (err && err.message ? err.message : err), 'err');
        rej(err);
      })
      .saveReportCKCT(ckctRows);
  });
}

/* ---------------------------- catalog helpers ---------------------------- */
function dimName(dimKey, code){
  if(!code) code='NO';
  // Mã hỗn hợp: nhiều mã cách nhau dấu "," -> ghép tên của từng mã lại
  if(String(code).indexOf(',')>-1){
    return String(code).split(',').map(c=>dimName(dimKey, c.trim())).filter(Boolean).join(', ');
  }
  const list = DB.catalog[dimKey] || [];
  const f = list.find(x=>norm(x.ma)===norm(code));
  return f ? f.ten : code;
}
function mhckMap(){
  const m = {};
  DB.catalog.mhck.forEach(r=>{ if(r.mamh) m[norm(r.mamh)] = r; });
  return m;
}
function lookupItemDims(mahang, map){
  const rec = map[norm(mahang)];
  if(!rec) return {thuonghieu:'NO',nhomkh:'NO',loaisp:'NO',dactinh:'NO',congdung:'NO',quycach:'NO', matched:false, tenhang:null};
  return {
    thuonghieu:rec.thuonghieu||'NO', nhomkh:rec.nhomkh||'NO', loaisp:rec.loaisp||'NO',
    dactinh:rec.dactinh||'NO', congdung:rec.congdung||'NO', quycach:rec.quycach||'NO',
    matched:true, tenhang:rec.tenhang||null
  };
}
function dimsLabel(dims){
  const parts = DIM_KEYS.map(k=>{
    const v = dims[k];
    if(!v || norm(v)==='NO') return null;
    return dimName(k, v);
  }).filter(Boolean);
  return parts.length ? parts.join(' · ') : 'Tất cả (không phân biệt)';
}
function dimsMatch(itemDims, ruleDims) {
  // itemDims là thuộc tính của sản phẩm (ví dụ: 'TBR', 'BIAS') — LUÔN là 1 giá trị cụ thể
  // ruleDims là thuộc tính bạn chọn trong chương trình — có thể là "NO", 1 mã cụ thể,
  // hoặc MÃ HỖN HỢP nhiều mã cách nhau dấu "," (VD "TBR,BIAS") áp dụng cho cột
  // Loại SP / Đặc tính / Công dụng / Quy cách — chỉ cần khớp 1 trong các mã đó là đạt.
  return DIM_KEYS.every(k => {
    const rv = norm(ruleDims[k]); // Giá trị bạn chọn trong chương trình
    const iv = norm(itemDims[k]); // Giá trị thực tế của sản phẩm

    // LOGIC CỐT LÕI:
    // Nếu chương trình chọn "NO" hoặc để trống, bỏ qua không xét cột này (Khớp ngay)
    if (rv === 'NO' || rv === '') return true;

    // Mã hỗn hợp: khớp nếu sản phẩm có giá trị trùng với BẤT KỲ mã nào trong danh sách
    if (rv.indexOf(',') > -1) {
      const list = rv.split(',').map(x=>x.trim()).filter(Boolean);
      return list.includes(iv);
    }

    // Nếu chương trình chọn giá trị cụ thể, sản phẩm bắt buộc phải khớp
    return iv === rv;
  });
}

/* ---------------------------- period helpers ---------------------------- */
function periodOverlap(aStart,aEnd,bStart,bEnd){
  if(!aStart || !aEnd) return true;
  const as=new Date(aStart), ae=new Date(aEnd), bs=bStart?new Date(bStart):new Date('1900-01-01'), be=bEnd?new Date(bEnd):new Date('2999-12-31');
  return as <= be && bs <= ae;
}
function inBracket(val, min, max){
  const mn = (min===''||min==null) ? -Infinity : Number(min);
  const mx = (max===''||max==null || Number(max)===0) ? Infinity : Number(max);
  return val >= mn && val <= mx;
}

// THEO MÔ HÌNH 3 TẦNG: 1 mã chiết khấu (Tầng 2) có thể có NHIỀU bậc điều kiện con (Tầng 3, DB.dieukien).
// Hàm này tìm bậc PHÙ HỢP nhất (SL/DT thực tế rơi đúng khoảng bậc đó), trả về 1 "prog hiệu lực" đã GỘP
// đúng SL/DT/Tỷ lệ CK của bậc đó — để calcDiscountForProgram()/checkSlDtBracket() dùng lại y nguyên
// không cần sửa gì thêm. TƯƠNG THÍCH NGƯỢC: nếu mã chiết khấu không có bậc con nào, dùng thẳng chính nó
// (đúng hành vi cũ, không có gì thay đổi).
function resolveEffectiveBac_(prog, totalSl, totalDt){
  const bacList = (DB.dieukien||[]).filter(d=>d.program_id===prog.id);
  if(!bacList.length) return { effective: prog, bacList: [], matchedBac: null, noBacMatched: false };
  const matched = bacList
    .map(d=>({ d, chk: checkSlDtBracket(d, totalSl, totalDt) }))
    .filter(x=>x.chk.dat);
  if(!matched.length) return { effective: prog, bacList, matchedBac: null, noBacMatched: true };
  // Nếu nhiều bậc cùng khớp (bậc khai chồng lấn), ưu tiên bậc có mức chiết khấu CAO NHẤT
  matched.sort((a,b)=> (Number(b.d.tl_ck||0)+Number(b.d.dongia_codinh||0)) - (Number(a.d.tl_ck||0)+Number(a.d.dongia_codinh||0)));
  const bestBac = matched[0].d;
  const effective = Object.assign({}, prog, {
    sl_min: bestBac.sl_min, sl_max: bestBac.sl_max, dt_min: bestBac.dt_min, dt_max: bestBac.dt_max,
    dieukien_sldt: bestBac.dieukien_sldt, tl_ck: bestBac.tl_ck, dongia_codinh: bestBac.dongia_codinh,
    dt_kehoach: bestBac.dt_kehoach, pct_kh_min: bestBac.pct_kh_min, pct_kh_max: bestBac.pct_kh_max
  });
  return { effective, bacList, matchedBac: bestBac, noBacMatched: false };
}
/* ---------------------------- discount calc engine ---------------------------- */
function calcDiscountForProgram(prog, sl, dt, giaCongBoTB){
  const tl = Number(prog.tl_ck||0)/100;
  // % theo giá mua: áp tỷ lệ % lên giá trị mua thực tế (giá mua bình quân × sản lượng) lấy từ Sổ chi tiết mua hàng
  if(prog.ht_chietkhau==='PERCENT_GIAMUA') return dt * tl;
  // % theo giá công bố: áp tỷ lệ % lên giá công bố bình quân của nhóm (tra theo mã hàng ở tab Giá công bố NCC) × sản lượng
  if(prog.ht_chietkhau==='PERCENT_GIACONGBO') return sl * Number(giaCongBoTB||0) * tl;
  // Số tiền chiết khấu cố định / đơn vị × sản lượng
  if(prog.ht_chietkhau==='DONGIA_CODINH') return sl * Number(prog.dongia_codinh||0);
  return 0;
}
// Kiểm tra điều kiện bậc Sản lượng (SL) và Doanh thu (DT) kết hợp theo AND/OR do chương trình khai báo:
//  - AND (mặc định): PHẢI đạt CẢ 2 điều kiện SL và DT thì mới được tính chiết khấu.
//  - OR: chỉ cần đạt 1 TRONG 2 điều kiện (SL hoặc DT) là được tính chiết khấu.
function checkSlDtBracket(prog, totalSl, totalDt){
  const slDat = inBracket(totalSl, prog.sl_min, prog.sl_max);
  const dtDat = inBracket(totalDt, prog.dt_min, prog.dt_max);
  const logic = (prog.dieukien_sldt === 'OR') ? 'OR' : 'AND';
  const dat = logic==='OR' ? (slDat || dtDat) : (slDat && dtDat);
  return { dat, slDat, dtDat, logic };
}
// Đánh giá 1 chương trình (hoặc 1 "chương trình ảo" ghép từ điều kiện Chiết khấu lũy kế) có ĐẠT hay
// không trong 1 khoảng ngày [fromDate,toDate] BẤT KỲ (không nhất thiết là kỳ báo cáo chính đang xem).
// Dùng lại đúng logic bậc SL/DT (AND/OR) + %KH Min-Max như computeReport, để tái sử dụng cho:
//  - Chiết khấu lũy kế: tính bậc riêng của chương trình lũy kế trên toàn kỳ đã chọn.
function evaluateProgramForPeriod(prog, fromDate, toDate, supplierFilter){
  if(!periodOverlap(fromDate, toDate, prog.hieuluctu, prog.hieulucden)){
    return { dat:false, totalSl:0, totalDt:0, hoanthanh:null, matchingSkus:[], reason:'Ngoài hiệu lực chương trình' };
  }
  const map = mhckMap();
  const purchases = DB.purchases.filter(p=>{
    if(!p.ngay) return false;
    if(fromDate && p.ngay < fromDate) return false;
    if(toDate && p.ngay > toDate) return false;
    if(supplierFilter && norm(p.nhacungcap).indexOf(norm(supplierFilter)) === -1) return false;
    return true;
  });
  const skuAgg = {};
  purchases.forEach(p=>{
    const dims = lookupItemDims(p.mahang, map);
    if(!dims.matched) return;
    const key = norm(p.mahang);
    if(!skuAgg[key]) skuAgg[key] = { mahang:p.mahang, tenhang:(map[key]&&map[key].tenhang)||p.tenhang||'', dims, sl:0, dt:0 };
    skuAgg[key].sl += Number(p.soluong)||0;
    skuAgg[key].dt += Number(p.giatri)||0;
  });
  const pd = {thuonghieu:prog.dim_thuonghieu,nhomkh:prog.dim_nhomkh,loaisp:prog.dim_loaisp,dactinh:prog.dim_dactinh,congdung:prog.dim_congdung,quycach:prog.dim_quycach};
  const matchingSkus = Object.values(skuAgg).filter(s=>dimsMatch(s.dims, pd));
  const totalSl = matchingSkus.reduce((a,x)=>a+x.sl,0);
  const totalDt = matchingSkus.reduce((a,x)=>a+x.dt,0);
  if(matchingSkus.length===0) return { dat:false, totalSl:0, totalDt:0, hoanthanh:null, matchingSkus:[], reason:'Không có mã hàng phát sinh mua trong kỳ' };
  const { effective, bacList, matchedBac, noBacMatched } = resolveEffectiveBac_(prog, totalSl, totalDt);
  if(noBacMatched){
    return { dat:false, totalSl, totalDt, hoanthanh:null, matchingSkus, reason:`Không đạt bậc nào trong ${bacList.length} bậc đã khai báo`, bacList, matchedBac:null };
  }
  const bracketChk = checkSlDtBracket(effective, totalSl, totalDt);
  const khRef = lookupKeHoach_(prog.ma_doanhthu, toDate || fromDate);
  const dtkh = khRef ? Number(khRef.dt_kehoach||0) : Number(effective.dt_kehoach||0);
  const hoanthanh = dtkh ? (totalDt/dtkh*100) : null;
  const dtkhSource = khRef
    ? { loai:'kehoach', ma_kehoach: khRef.parent?.ma_kehoach || '', ky: khRef.ky || null }
    : (dtkh ? { loai:'chuongtrinh' } : { loai:'none' });
  let datKH = true;
  if(dtkh && hoanthanh!=null){
    const mn = (effective.pct_kh_min===''||effective.pct_kh_min==null) ? -Infinity : Number(effective.pct_kh_min);
    const mx = (effective.pct_kh_max===''||effective.pct_kh_max==null||Number(effective.pct_kh_max)===0) ? Infinity : Number(effective.pct_kh_max);
    if(hoanthanh<mn || hoanthanh>mx) datKH = false;
  }
  const dat = bracketChk.dat && datKH;
  return { dat, datBac:bracketChk.dat, datKH, slDat:bracketChk.slDat, dtDat:bracketChk.dtDat, sldtLogic:bracketChk.logic, totalSl, totalDt, hoanthanh, dtkhSource, matchingSkus, effectiveProg: effective, bacList, matchedBac };
}
function ttCkLabel(v){
  return TT_CK_OPTIONS.find(o=>o.v===v)?.l || v || '';
}
function giaMuaBinhQuan(sl, dt){
  return sl ? dt/sl : 0;
}

function computeReport(fromDate, toDate, supplierFilter, onlyMapped, programFilter, thoidiemFilter){
  const map = mhckMap();
  const gcbMap = giaCongBoMap();
  const purchases = DB.purchases.filter(p=>{
    if(!p.ngay) return false;
    const d = p.ngay;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    if(supplierFilter && norm(p.nhacungcap).indexOf(norm(supplierFilter)) === -1) return false;
    return true;
  });

  // BƯỚC 1: Gom dữ liệu mua hàng về TỪNG MÃ HÀNG (đơn vị nhỏ nhất).
  // Đây là dữ liệu gốc dùng cho cả 2 việc:
  //  (a) Gộp đúng phạm vi của TỪNG "mã chiết khấu" (chương trình) để so bậc thang — 1 chương trình
  //      có điều kiện lỏng (VD chỉ chọn Loại SP, còn lại "NO") sẽ SUM toàn bộ mã hàng con thoả điều
  //      kiện đó lại, không tách nhỏ theo từng tổ hợp đặc tính cụ thể như trước (đây là lỗi cũ).
  //  (b) Tính tiền chiết khấu CHI TIẾT theo từng mã hàng đạt điều kiện, rồi SUM lại thành tổng tiền CK.
  const skuAgg = {};
  purchases.forEach(p=>{
    const dims = lookupItemDims(p.mahang, map);
    if(onlyMapped && !dims.matched) return;
    const key = norm(p.mahang);
    if(!skuAgg[key]) skuAgg[key] = {
      mahang: p.mahang, tenhang: (map[key] && map[key].tenhang) || p.tenhang || '',
      dims, matched: dims.matched, sl:0, dt:0, cbGT:0, cbSL:0, hasNCC:false
    };
    const s = skuAgg[key];
    const sl = Number(p.soluong)||0;
    s.sl += sl;
    s.dt += Number(p.giatri)||0;
    const mhckRec = map[key];
    const maMH = mhckRec ? mhckRec.mamh_ncc : '';
    if(maMH) s.hasNCC = true;
    const gcb = maMH ? lookupGiaCongBo(maMH, p.ngay, gcbMap) : null;
    if(gcb!=null){ s.cbGT += gcb*sl; s.cbSL += sl; }
  });
  const skus = Object.values(skuAgg);
  const matchedSkus = skus.filter(s=>s.matched);
  const unmatchedSkus = skus.filter(s=>!s.matched);

  let activePrograms = DB.programs.filter(pr=>periodOverlap(fromDate,toDate,pr.hieuluctu,pr.hieulucden));
  if(programFilter) activePrograms = activePrograms.filter(pr=>pr.id===programFilter);
  // Lọc theo "Thời điểm chiết khấu" đã chọn ở kỳ báo cáo (Tháng/Quý/6 Tháng/Năm/Theo hiệu lực CTKM)
  if(thoidiemFilter) activePrograms = activePrograms.filter(pr=>pr.thoidiem_ck===thoidiemFilter);

  const skuDetailRow = (s, prog) => {
    const giaCongBoTB = s.cbSL ? s.cbGT/s.cbSL : 0;
    const giaMuaTB = giaMuaBinhQuan(s.sl, s.dt);
    const tienck = calcDiscountForProgram(prog, s.sl, s.dt, giaCongBoTB);
    return {
      mahang: s.mahang, tenhang: s.tenhang, sl: s.sl, dt: s.dt,
      giaMuaTB, giaCongBoTB, coGiaCongBo: s.cbSL>0, hasNCC: s.hasNCC,
      tienck, pctTheoGiaMua: s.dt ? (tienck/s.dt*100) : null
    };
  };

  const result = [];
  const coveredSkuKeys = new Set(); // mã hàng đã thuộc phạm vi ít nhất 1 chương trình (dù đạt bậc hay chưa)

  // BƯỚC 2: Với TỪNG chương trình (mã chiết khấu), gộp toàn bộ mã hàng khớp điều kiện dims lại
  // thành 1 tổng thể để so với bậc thang Min-Max. Nếu tổng gộp đạt -> toàn bộ mã hàng con đều đạt.
  activePrograms.forEach(prog=>{
    const pd = {thuonghieu:prog.dim_thuonghieu,nhomkh:prog.dim_nhomkh,loaisp:prog.dim_loaisp,dactinh:prog.dim_dactinh,congdung:prog.dim_congdung,quycach:prog.dim_quycach};
    const matchingSkus = matchedSkus.filter(s=> dimsMatch(s.dims, pd));
    if(matchingSkus.length===0) return; // chương trình này không có mã hàng nào phát sinh mua trong kỳ
    matchingSkus.forEach(s=>coveredSkuKeys.add(norm(s.mahang)));

    const totalSl = matchingSkus.reduce((a,x)=>a+x.sl,0);
    const totalDt = matchingSkus.reduce((a,x)=>a+x.dt,0);
    // THEO MÔ HÌNH 3 TẦNG: nếu mã chiết khấu này có các bậc điều kiện con (DB.dieukien), tìm đúng bậc
    // khớp với SL/DT thực tế và dùng SL/DT/Tỷ lệ CK của BẬC ĐÓ để tính — vẫn giữ nguyên id/ma_chietkhau/
    // dims/ht_chietkhau của chính mã chiết khấu. Nếu KHÔNG có bậc con nào, effective === prog (y hệt cũ).
    const { effective: effProg, bacList: progBacList, matchedBac, noBacMatched } = resolveEffectiveBac_(prog, totalSl, totalDt);
    const bracketChk = checkSlDtBracket(effProg, totalSl, totalDt);
    const datBac = noBacMatched ? false : bracketChk.dat;

    // SỬA LỖI HIỂN THỊ: khi mã chiết khấu có bậc con nhưng KHÔNG bậc nào khớp SL/DT thực tế, không nên
    // hiện "% hoàn thành kế hoạch" tính theo dt_kehoach của CHÍNH mã chiết khấu (không liên quan, dễ gây
    // hiểu nhầm) — để trống, chỉ rõ nguyên nhân là chưa khớp bậc nào.
    const khRef = noBacMatched ? null : lookupKeHoach_(prog.ma_doanhthu, toDate || fromDate);
    const dtkh = noBacMatched ? 0 : (khRef ? Number(khRef.dt_kehoach||0) : Number(effProg.dt_kehoach||0));
    const hoanthanh = dtkh ? (totalDt/dtkh*100) : null;
    // THEO YÊU CẦU: minh bạch hoá nguồn Doanh thu kế hoạch dùng để tính %hoàn thành KH — trước đây
    // dtkh được lấy ngầm (ưu tiên Danh mục kế hoạch, không có thì rơi về số khai trực tiếp trên Mã
    // chiết khấu/bậc), người xem báo cáo không biết con số đang dùng lấy từ đâu, dễ nhầm khi có nhiều
    // kế hoạch trùng Mã doanh thu hoặc khi quên cập nhật Danh mục kế hoạch cho kỳ mới. Nay gắn kèm
    // dtkhSource mô tả rõ 1 trong 3 trường hợp, hiển thị dạng tooltip cạnh %Hoàn thành KH trên bảng kết
    // quả (xem renderReportResult) và cột riêng khi xuất Excel (xem exportReportXlsx).
    const dtkhSource = noBacMatched ? null : (
      khRef
        ? { loai:'kehoach', ma_kehoach: khRef.parent?.ma_kehoach || '', ky: khRef.ky || null }
        : (dtkh ? { loai:'chuongtrinh' } : { loai:'none' })
    );

    // Kiểm tra thêm điều kiện % Kế hoạch Min-Max (nếu chương trình có khai báo Doanh thu kế hoạch
    // và khoảng % KH): % hoàn thành kế hoạch phải nằm trong [%KH Min, %KH Max] thì mới được tính CK.
    let datKH = true;
    if(dtkh && hoanthanh!=null){
      const mn = (effProg.pct_kh_min===''||effProg.pct_kh_min==null) ? -Infinity : Number(effProg.pct_kh_min);
      const mx = (effProg.pct_kh_max===''||effProg.pct_kh_max==null || Number(effProg.pct_kh_max)===0) ? Infinity : Number(effProg.pct_kh_max);
      if(hoanthanh < mn || hoanthanh > mx) datKH = false;
    }
    const dat = datBac && datKH;

    // BƯỚC 3: MỚI — nếu "Mã doanh thu tính chiết khấu" khác "Mã doanh thu điều kiện", doanh thu dùng
    // để nhân tỷ lệ % được lấy theo tổ hợp thuộc tính RIÊNG đó, không phải toàn bộ phạm vi đã dùng để
    // xét đạt bậc (VD: xét SL/DT trên toàn đơn hàng nhưng chỉ trả CK cho 1 nhóm sản phẩm cụ thể).
    let skuDetails = [], tienck = 0;
    if(dat){
      let baseSkus = matchingSkus;
      if(prog.ma_doanhthu_tinhck && prog.ma_doanhthu_tinhck !== prog.ma_doanhthu){
        const tinhCkDims = doanhThuDims_(prog.ma_doanhthu_tinhck);
        if(tinhCkDims) baseSkus = matchedSkus.filter(s=>dimsMatch(s.dims, tinhCkDims));
      }
      skuDetails = baseSkus.map(s=>skuDetailRow(s, effProg)).sort((a,b)=>b.tienck-a.tienck);
      tienck = skuDetails.reduce((a,x)=>a+x.tienck,0);
    }
    let hasNCCany = false, cbGTsum=0, cbSLsum=0;
    matchingSkus.forEach(s=>{ if(s.hasNCC) hasNCCany = true; cbGTsum+=s.cbGT; cbSLsum+=s.cbSL; });

    result.push({
      key: 'prog_'+prog.id,
      label: dimsLabel(pd),
      program: effProg, matched:true, dat, datBac, datKH,
      slDat: bracketChk.slDat, dtDat: bracketChk.dtDat, sldtLogic: bracketChk.logic,
      sl: totalSl, dt: totalDt, soMaHang: matchingSkus.length,
      tienck, dtkh, hoanthanh, dtkhSource,
      giaMuaTB: giaMuaBinhQuan(totalSl,totalDt),
      giaCongBoTB: cbSLsum ? cbGTsum/cbSLsum : 0,
      coGiaCongBo: cbSLsum>0, hasNCC: hasNCCany,
      pctTheoGiaMua: totalDt ? (tienck/totalDt*100) : null,
      htChietkhau: HT_OPTIONS.find(o=>o.v===prog.ht_chietkhau)?.l || prog.ht_chietkhau,
      ttChietkhau: ttCkLabel(prog.tt_ck),
      bacList: progBacList, matchedBac, soBac: progBacList.length,
      skuDetails
    });
  });

  // Các mã hàng đã gắn nhóm CK nhưng không thuộc phạm vi bất kỳ chương trình nào (trong kỳ đã chọn)
  // và các mã hàng chưa gắn nhóm CK — chỉ hiển thị khi xem "Tất cả chương trình" để không gây nhiễu
  // khi người dùng đã chủ động chọn riêng 1 chương trình.
  if(!programFilter){
    const leftover = matchedSkus.filter(s=>!coveredSkuKeys.has(norm(s.mahang)));
    if(leftover.length){
      const totalSl = leftover.reduce((a,x)=>a+x.sl,0);
      const totalDt = leftover.reduce((a,x)=>a+x.dt,0);
      result.push({
        key:'no_program', label:'Có nhóm CK nhưng chưa có chương trình phù hợp',
        program:null, matched:true, dat:false,
        sl: totalSl, dt: totalDt, soMaHang: leftover.length,
        tienck:0, dtkh:0, hoanthanh:null,
        giaMuaTB: giaMuaBinhQuan(totalSl,totalDt), giaCongBoTB:0, coGiaCongBo:false, hasNCC:false,
        pctTheoGiaMua:null, htChietkhau:'', ttChietkhau:'', skuDetails:[]
      });
    }
    if(unmatchedSkus.length){
      const totalSl = unmatchedSkus.reduce((a,x)=>a+x.sl,0);
      const totalDt = unmatchedSkus.reduce((a,x)=>a+x.dt,0);
      result.push({
        key:'unmapped', label:'Chưa gắn nhóm chiết khấu (kiểm tra Danh mục)',
        program:null, matched:false, dat:false,
        sl: totalSl, dt: totalDt, soMaHang: unmatchedSkus.length,
        tienck:0, dtkh:0, hoanthanh:null,
        giaMuaTB: giaMuaBinhQuan(totalSl,totalDt), giaCongBoTB:0, coGiaCongBo:false, hasNCC:false,
        pctTheoGiaMua:null, htChietkhau:'', ttChietkhau:'', skuDetails:[]
      });
    }
  }

  result.sort((a,b)=> b.dt - a.dt);
  // THEO YÊU CẦU: đính kèm tổng doanh thu mua ĐÃ GỘP THEO TỪNG MÃ HÀNG (không trùng lặp) ngay tại đây —
  // dùng đúng tập mã hàng đang được đối chiếu chiết khấu (skus, gộp theo mahang một lần duy nhất) thay
  // vì cộng lại từ Sổ chi tiết mua hàng riêng biệt (có thể lệch bộ lọc). Gắn vào mảng kết quả để nơi
  // hiển thị dùng lại đúng con số này, đảm bảo luôn khớp với chính dữ liệu đang hiển thị.
  result.totalDT = skus.reduce((s,x)=>s+x.dt,0);
  result.totalSL = skus.reduce((s,x)=>s+x.sl,0);
  return result;
}
// Tổng hợp toàn bộ chi tiết mặt hàng nhận chiết khấu từ TẤT CẢ các chương trình đạt bậc trong 1 báo cáo,
// SUM theo từng mã hàng (nếu 1 mã hàng thuộc nhiều chương trình đạt bậc cùng lúc, tiền CK sẽ được cộng dồn).
function buildSkuAggregateView(rows){
  const m = {};
  rows.forEach(r=>{
    if(!r.dat || !r.skuDetails || !r.skuDetails.length) return;
    r.skuDetails.forEach(s=>{
      const k = norm(s.mahang);
      if(!m[k]) m[k] = { mahang:s.mahang, tenhang:s.tenhang, sl:s.sl, dt:s.dt, tienck:0, programs:[] };
      m[k].tienck += s.tienck;
      m[k].programs.push({ ma: r.program.ma_chietkhau, ht: r.htChietkhau });
    });
  });
  return Object.values(m).sort((a,b)=>b.tienck-a.tienck);
}

      <div class="tab2 ${isMhck?'active':''}" data-sub="mhck">Mã hàng → Nhóm CK <span class="badge-count" style="background:var(--slate-100);color:var(--slate-500)">${DB.catalog.mhck.length}</span></div>

function openDimForm(dimKey, idx){
  const hasRange = dimKey==='quycach';
  const row = idx!=null ? DB.catalog[dimKey][idx] : {ma:'',ten:'',min:'',max:''};
  openModal(`
    <h3>${idx!=null?'Sửa':'Thêm'} ${DIM_LABELS[dimKey]}</h3>
    <div class="field"><label>Mã</label><input type="text" id="f_ma" value="${esc(row.ma)}" ${idx!=null?'disabled':''}></div>
    <div class="field"><label>Tên</label><input type="text" id="f_ten" value="${esc(row.ten)}"></div>
    ${hasRange?`<div class="grid grid-2">
      <div class="field"><label>Quy cách từ</label><input type="number" id="f_min" value="${row.min??''}"></div>
      <div class="field"><label>Quy cách đến</label><input type="number" id="f_max" value="${row.max??''}"></div>
    </div>`:''}
    <div class="btn-row" style="justify-content:flex-end;margin-top:8px">
      <button class="btn" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" onclick="saveDimForm('${dimKey}',${idx!=null?idx:'null'})">Lưu lên Sheet</button>
    </div>
  `);
}
async function saveDimForm(dimKey, idx){
  const ma = document.getElementById('f_ma').value.trim();
  const ten = document.getElementById('f_ten').value.trim();
  if(!ma || !ten){ toast('Vui lòng nhập đủ Mã và Tên','err'); return; }
  const row = {ma, ten};
  if(dimKey==='quycach'){
    row.min = document.getElementById('f_min').value || null;
    row.max = document.getElementById('f_max').value || null;
  }
  if(idx!=null){ DB.catalog[dimKey][idx] = {...DB.catalog[dimKey][idx], ...row}; }
  else {
    if(DB.catalog[dimKey].some(x=>norm(x.ma)===norm(ma))){ toast('Mã đã tồn tại','err'); return; }
    DB.catalog[dimKey].push(row);
  }
  await saveCatalogDims();
  closeModal(); toast('Đã lưu dữ liệu lên đám mây','ok'); renderCatalog();
}
window.openDimForm = openDimForm;
window.saveDimForm = saveDimForm;
window.editDimRow = (dimKey,i)=>openDimForm(dimKey,i);
window.deleteDimRow = async (dimKey,i)=>{
  if(!confirm('Xóa mục này khỏi bộ nhớ đám mây?')) return;
  DB.catalog[dimKey].splice(i,1);
  await saveCatalogDims(); toast('Đã xóa thành công','ok'); renderCatalog();
};

// Hàm lọc dùng chung cho danh sách Mã hàng→Nhóm CK — tái sử dụng ở cả renderMhckResults() và khi
// xuất Excel theo đúng bộ lọc đang áp dụng (thay vì luôn xuất toàn bộ).
function getFilteredMhck_(){
  const q = UI._mhckSearch || '';
  const f = UI._mhckFilters || {};
  return DB.catalog.mhck.filter(r=>{
    if(q && norm(r.mamh+r.mamh_ncc+r.tenhang).indexOf(norm(q))===-1) return false;
    if(f.thuonghieu && norm(r.thuonghieu)!==norm(f.thuonghieu)) return false;
    if(f.nhomkh && norm(r.nhomkh)!==norm(f.nhomkh)) return false;
    if(f.loaisp && norm(r.loaisp)!==norm(f.loaisp)) return false;
    if(f.dactinh && norm(r.dactinh)!==norm(f.dactinh)) return false;
    if(f.congdung && norm(r.congdung)!==norm(f.congdung)) return false;
    if(f.quycach && norm(r.quycach)!==norm(f.quycach)) return false;
    if(f.chuagan==='1' && r.mamh_ncc) return false;
    if(f.chuagan==='0' && !r.mamh_ncc) return false;
    if(f.rasoat==='1' && !r.can_ra_soat) return false;
    return true;
  });
}
function exportMhckFilteredXlsx(){
  const rows = getFilteredMhck_();
  if(!rows.length){ toast('Không có dòng nào để xuất theo bộ lọc hiện tại','err'); return; }
  const wb = XLSX.utils.book_new();
  const mh = rows.map(r=>({
    'Mã hàng_misa':r.mamh, 'Mã MH':r.mamh_ncc||'', 'Tên hàng':r.tenhang, DM_THUONGHIEU:r.thuonghieu, DM_NHOMKH:r.nhomkh,
    DM_LOAISP:r.loaisp, DM_DACTINH:r.dactinh, DM_CONGDUNG:r.congdung, DM_QUYCACH:r.quycach
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mh), 'DM_MHCK');
  downloadWb(wb, 'DM_MHCK_theo_bo_loc_export.xlsx');
  toast(`Đã xuất ${rows.length} dòng theo bộ lọc`,'ok');
}
window.exportMhckFilteredXlsx = exportMhckFilteredXlsx;

  // tìm kiếm) — ô input bị thay bằng phần tử DOM MỚI mỗi lần gõ, làm mất focus ngay sau 1 ký tự, phải
  // bấm lại vào ô mới gõ tiếp được. Nay tách riêng: PHẦN BỘ LỌC (ô tìm kiếm + 6 dropdown) chỉ vẽ 1 LẦN
  // DUY NHẤT, còn PHẦN KẾT QUẢ (bảng danh sách) nằm trong khung riêng, chỉ khung đó được vẽ lại mỗi khi

      <div class="btn-row">
        <button class="btn" onclick="exportMhckFilteredXlsx()">${ICON.download} Xuất Excel (theo bộ lọc)</button>
        <button class="btn btn-primary btn-sm" onclick="openMhckForm()">${ICON.plus} Thêm mã hàng</button>
      </div>
    </div>
    <div style="padding:0 16px 14px;border-bottom:1px solid var(--slate-100)">

        <div class="field" style="margin:0;grid-column:span 2">
          <label style="font-size:11px">Tìm kiếm</label>
          <input type="text" id="mhckSearchInput" placeholder="Mã hàng / Mã MH / tên hàng…" value="${esc(q)}" oninput="UI._mhckSearch=this.value;UI._mhckPageSize=20;renderMhckResults()">
        </div>
        ${dimSel('thuonghieu','Thương hiệu')}
        ${dimSel('nhomkh','Nhóm hàng')}

        ${dimSel('congdung','Công dụng')}
        ${dimSel('quycach','Quy cách')}
        <div class="field" style="margin:0">
          <label style="font-size:11px">Trạng thái gán</label>

            <option value="">Tất cả</option>
            <option value="1" ${f.chuagan==='1'?'selected':''}>⚠ Chưa gắn Mã MH</option>

        <div class="field" style="margin:0">

        </div>
