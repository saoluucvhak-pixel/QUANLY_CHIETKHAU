window.renderMhckTable = renderMhckTable;
function renderMhckResults(){
  const filtered = getFilteredMhck_();
  const pageSize = UI._mhckPageSize || 20;
  const shown = filtered.slice(0, pageSize);
  if(!UI._mhckSelected) UI._mhckSelected = new Set();
  // MỚI: đếm số lần xuất hiện của từng Mã hàng (MISA) trên TOÀN BỘ danh sách (không chỉ theo bộ lọc)
  // để cảnh báo nếu có mã hàng bị khai báo trùng nhiều dòng — dễ gây sai lệch khi tra cứu/tính chiết khấu.
  const mamhCount = {};
  DB.catalog.mhck.forEach(r=>{ const k = norm(r.mamh); if(k) mamhCount[k] = (mamhCount[k]||0)+1; });
  const rowsHtml = shown.map((r,i)=>{
    const realIdx = DB.catalog.mhck.indexOf(r);
    const isDup = r.mamh && mamhCount[norm(r.mamh)] > 1;
    return `<tr style="${isDup?'background:#fff8e6':''}">
      <td style="width:34px"><input type="checkbox" class="mhck-chk" data-idx="${realIdx}" ${UI._mhckSelected.has(realIdx)?'checked':''} onchange="toggleMhckSelect(${realIdx},this.checked)"></td>
      <td class="mono">${esc(r.mamh)}${isDup?'<div class="hint" style="color:var(--gold-dark,#b8860b);font-size:10.5px">⚠ Trùng mã hàng ('+mamhCount[norm(r.mamh)]+' dòng)</div>':''}${r.can_ra_soat?'<div class="hint" style="color:var(--blue-dark,#1d4ed8);font-size:10.5px">🆕 Tự động thêm — cần rà soát nhóm</div>':''}</td>
      <td class="mono">${r.mamh_ncc ? esc(r.mamh_ncc) : '<span class="hint" style="color:var(--red)">⚠ chưa gắn</span>'}</td>
      <td>${esc(r.tenhang||'')}</td>
      <td><span class="tag">${esc(r.thuonghieu||'NO')}</span></td>
      <td><span class="tag">${esc(r.nhomkh||'NO')}</span></td>
      <td><span class="tag">${esc(r.loaisp||'NO')}</span></td>
      <td><span class="tag">${esc(r.dactinh||'NO')}</span></td>
      <td><span class="tag">${esc(r.congdung||'NO')}</span></td>
      <td><span class="tag">${esc(r.quycach||'NO')}</span></td>
      <td style="width:70px"><div class="rowline">
        <span class="small-x" onclick="openMhckForm(${realIdx})">${ICON.edit}</span>
        <span class="small-x" onclick="deleteMhckRow(${realIdx})">${ICON.trash}</span>
      </div></td>
    </tr>`;
  }).join('');
  const hint = document.getElementById('mhckCountHint');
  const dupTotal = Object.values(mamhCount).filter(c=>c>1).length;
  const rasoatTotal = DB.catalog.mhck.filter(r=>r.can_ra_soat).length;
  if(hint) hint.innerHTML = `${DB.catalog.mhck.length} mã hàng đã gắn nhóm · đang hiện ${shown.length}/${filtered.length} theo bộ lọc · cột <b>Mã MH</b> dùng để đối chiếu Bảng giá công bố NCC${dupTotal?` · <span style="color:var(--red)">⚠ ${dupTotal} mã hàng bị trùng</span>`:''}${rasoatTotal?` · <span style="color:var(--blue-dark,#1d4ed8)">🆕 ${rasoatTotal} mã hàng cần rà soát</span>`:''}`;
  const allShownChecked = shown.length>0 && shown.every(r=>UI._mhckSelected.has(DB.catalog.mhck.indexOf(r)));
  // THANH THAO TÁC HÀNG LOẠT: chỉ hiện khi có ít nhất 1 dòng được chọn — cho phép gán chung 1 giá trị
  // của 1 kích thước (VD Thương hiệu) cho toàn bộ các dòng đã tick chọn, tiết kiệm thời gian sửa từng dòng.
  const bulkBarHtml = UI._mhckSelected.size ? `
    <div class="btn-row" style="padding:10px 16px;background:var(--navy-50,#eef2ff);border-bottom:1px solid var(--slate-200);flex-wrap:wrap;gap:8px;align-items:center">
      <b style="font-size:13px">${UI._mhckSelected.size} dòng đã chọn</b>
      <select id="bulkDimSel" onchange="updateMhckBulkValOptions()">
        <option value="thuonghieu">Thương hiệu</option>
        <option value="nhomkh">Nhóm hàng</option>
        <option value="loaisp">Loại SP</option>
        <option value="dactinh">Đặc tính</option>
        <option value="congdung">Công dụng</option>
        <option value="quycach">Quy cách</option>
      </select>
      <select id="bulkValSel" style="min-width:150px">${DB.catalog.thuonghieu.map(o=>`<option value="${esc(o.ma)}">${esc(o.ten||o.ma)}</option>`).join('')}</select>
      <button class="btn btn-primary btn-sm" onclick="applyMhckBulkAssign()">Áp dụng cho ${UI._mhckSelected.size} dòng</button>
      <button class="btn btn-sm" onclick="UI._mhckSelected=new Set();renderMhckResults()">Bỏ chọn</button>
    </div>
  ` : '';
  document.getElementById('mhckResultsBody').innerHTML = filtered.length ? `${bulkBarHtml}<div class="table-wrap"><table>
      <thead><tr><th style="width:34px"><input type="checkbox" ${allShownChecked?'checked':''} onchange="toggleMhckSelectAll(this.checked)"></th><th>Mã hàng (MISA)</th><th>Mã MH (NCC)</th><th>Tên hàng</th><th>Thương hiệu</th><th>Nhóm hàng</th><th>Loại SP</th><th>Đặc tính</th><th>Công dụng</th><th>Quy cách</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    ${filtered.length > shown.length ? `<div style="text-align:center;padding:14px"><button class="btn btn-sm" onclick="UI._mhckPageSize=(UI._mhckPageSize||20)+20;renderMhckResults()">Xem thêm 20 dòng (còn ${filtered.length-shown.length})</button></div>` : ''}
    ` : `<div class="empty"><div class="big">🏷️</div>Không có mã hàng nào khớp bộ lọc hiện tại.</div>`;
}
window.renderMhckResults = renderMhckResults;
window.toggleMhckSelect = function(realIdx, checked){
  if(checked) UI._mhckSelected.add(realIdx); else UI._mhckSelected.delete(realIdx);
  renderMhckResults();
};
window.toggleMhckSelectAll = function(checked){
  const filtered = getFilteredMhck_();
  const shown = filtered.slice(0, UI._mhckPageSize||20);
  shown.forEach(r=>{
    const idx = DB.catalog.mhck.indexOf(r);
    if(checked) UI._mhckSelected.add(idx); else UI._mhckSelected.delete(idx);

window.updateMhckBulkValOptions = function(){

window.applyMhckBulkAssign = async function(){
  const dim = document.getElementById('bulkDimSel').value;
  const val = document.getElementById('bulkValSel').value;
  if(!val){ toast('Vui lòng chọn giá trị cần gán','err'); return; }

    if(DB.catalog.mhck[idx]){
      DB.catalog.mhck[idx][dim] = val;
      delete DB.catalog.mhck[idx].can_ra_soat; // coi như đã rà soát khi được gán nhóm thủ công

  });
  const n = UI._mhckSelected.size;
  UI._mhckSelected = new Set();
  await saveMhck();
  toast(`Đã gán cho ${n} dòng`,'ok');
  renderMhckResults();
};

// Lưu ý quan trọng: Bảng giá công bố của NCC dùng "Mã MH" (cột A trong DM_MHCK) — KHÔNG PHẢI
// "Mã hàng_misa" dùng trong Sổ chi tiết mua hàng. Vì vậy chuỗi tra cứu giá công bố cho 1 dòng
// mua hàng là: Mã hàng_misa (Sổ chi tiết) → tra DM_MHCK → lấy Mã MH tương ứng → tra Bảng giá công bố theo Mã MH.
function giaCongBoMap(){
  // Gom theo Mã MH, mỗi Mã MH có thể có nhiều bản ghi giá theo từng giai đoạn hiệu lực
  const m = {};
  (DB.catalog.giacongbo||[]).forEach(r=>{
    const k = norm(r.mamh_ncc);
    if(!k) return;
    if(!m[k]) m[k] = [];
    m[k].push(r);
  });
  Object.keys(m).forEach(k => m[k].sort((a,b)=> String(a.hieuluctu||'').localeCompare(String(b.hieuluctu||''))));
  return m;
}
// Tìm giá công bố áp dụng cho 1 Mã MH tại 1 ngày cụ thể (ngày mua hàng)
function lookupGiaCongBo(maMH, ngay, map){
  if(!maMH) return null;
  const list = map[norm(maMH)];
  if(!list || !list.length) return null;
  let best = null;
  list.forEach(r=>{
    const tu = r.hieuluctu || '0000-01-01';
    const den = r.hieulucden || '9999-12-31';
    if((!ngay) || (ngay >= tu && ngay <= den)) best = r;
  });
  if(!best){
    // Không có bản ghi đúng khoảng ngày -> lấy bản ghi gần nhất trước ngày mua (giá công bố cũ nhất còn hiệu lực)
    list.forEach(r=>{ if((r.hieuluctu||'') <= (ngay||'9999-12-31')) best = r; });
  }
  const v = best ? Number(best.gia_congbo) : null;
  return (v==null || isNaN(v)) ? null : v;
}

async function handleGiaCongBoFile(file){
  try{
    const wb = await readWorkbook(file);
    const ws = findSheet(wb, ['DM_GIACONGBO','GIACONGBO','GIA CONG BO','BANG GIA']) || wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {defval:''});
    let added=0, updated=0;
    data.forEach(row=>{
      const maMH = getVal(row, ['Mã MH','MaMH','Mã hàng']);
      const gia = getVal(row, ['Giá công bố','GIA_CONGBO','Đơn giá công bố']);
      if(!maMH || gia==='') return;
      const rec = {
        mamh_ncc: String(maMH).trim(),
        tenhang: String(getVal(row,['Tên hàng'])||'').trim(),
        gia_congbo: cleanExcelNumber(gia),
        hieuluctu: excelDateToISO(getVal(row,['Hiệu lực từ ngày','Ngày hiệu lực'])),
        hieulucden: excelDateToISO(getVal(row,['Hiệu lực đến ngày']))
      };
      // Cập nhật đè nếu đã có bản ghi cùng Mã MH + cùng khoảng hiệu lực (tránh tạo dòng trùng khi tải lại file)
      const i = DB.catalog.giacongbo.findIndex(x=>
        norm(x.mamh_ncc)===norm(rec.mamh_ncc) &&
        String(x.hieuluctu||'')===String(rec.hieuluctu||'') &&
        String(x.hieulucden||'')===String(rec.hieulucden||'')
      );
      if(i>-1){ DB.catalog.giacongbo[i] = rec; updated++; }
      else { DB.catalog.giacongbo.push(rec); added++; }
    });
    await saveGiaCongBo();
    toast(`Đã nạp giá công bố: ${added} dòng mới, ${updated} dòng cập nhật`, 'ok');
    renderGiaCongBo();
  }catch(err){ toast('Lỗi đọc tệp giá công bố: ' + err.message, 'err'); }
}
function exportGiaCongBoXlsx(){
  const rows = (DB.catalog.giacongbo||[]).map(r=>({
    'Mã MH': r.mamh_ncc, 'Tên hàng': r.tenhang, 'Giá công bố': r.gia_congbo,
    'Hiệu lực từ ngày': r.hieuluctu, 'Hiệu lực đến ngày': r.hieulucden
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'DM_GIACONGBO');
  downloadWb(wb, 'GIA_CONGBO_export.xlsx');
  toast('Đã xuất file giá công bố','ok');
}

function doanhThuDims_(maDoanhThuId){
  const dt = (DB.doanhthu||[]).find(x=>x.id===maDoanhThuId);
  if(!dt) return null;
  return {thuonghieu:dt.dim_thuonghieu,nhomkh:dt.dim_nhomkh,loaisp:dt.dim_loaisp,dactinh:dt.dim_dactinh,congdung:dt.dim_congdung,quycach:dt.dim_quycach};
}
function doanhThuLabel(id){
  const dt = (DB.doanhthu||[]).find(x=>x.id===id);
  if(!dt) return '(không xác định)';
  return (dt.ma||dt.id) + (dt.ten?(' — '+dt.ten):'');
}
function makeUniqueMaDoanhThu_(){
  let n = (DB.doanhthu||[]).length + 1;
  const exists = (ma)=> (DB.doanhthu||[]).some(x=>norm(x.ma)===norm(ma));
  let ma = 'DT' + String(n).padStart(3,'0');
  while(exists(ma)){ n++; ma = 'DT' + String(n).padStart(3,'0'); }
  return ma;
}
function findOrCreateDoanhThu_(dims, thoidiem, tenGoiY){
  const found = (DB.doanhthu||[]).find(x=>
    DIM_KEYS.every(k=>norm(x['dim_'+k]||'NO')===norm(dims[k]||'NO')) &&
    norm(x.thoidiem_ck||'')===norm(thoidiem||'')
  );
  if(found) return found;
  const row = { id: uid(), ma: makeUniqueMaDoanhThu_(), ten: tenGoiY||'', thoidiem_ck: thoidiem||'' };
  DIM_KEYS.forEach(k=> row['dim_'+k] = dims[k]||'NO');
  DB.doanhthu.push(row);
  return row;
}
let _migratingDoanhThu = false;
async function migrateProgramsToDoanhThu_(){
  if(_migratingDoanhThu) return;
  const needMigrate = (DB.programs||[]).some(p=>!p.ma_doanhthu) || (DB.programsLuyKe||[]).some(lk=>!lk.ma_doanhthu_tinhck && lk.ma_ck_chinh);
  if(!needMigrate) return;
  _migratingDoanhThu = true;
  try{
    let changedDoanhThu = false, changedPrograms = false, changedLuyKe = false;
    (DB.programs||[]).forEach(p=>{
      if(p.ma_doanhthu) return;
      const dims = {thuonghieu:p.dim_thuonghieu,nhomkh:p.dim_nhomkh,loaisp:p.dim_loaisp,dactinh:p.dim_dactinh,congdung:p.dim_congdung,quycach:p.dim_quycach};
      const dt = findOrCreateDoanhThu_(dims, p.thoidiem_ck, 'Tự tạo từ mã chiết khấu ' + (p.ma_chietkhau||''));
      p.ma_doanhthu = dt.id;
      p.ma_doanhthu_tinhck = dt.id;
      changedDoanhThu = true; changedPrograms = true;
    });
    (DB.programsLuyKe||[]).forEach(lk=>{
      if(lk.ma_doanhthu_tinhck || !lk.ma_ck_chinh) return;
      const bp = DB.programs.find(p=>p.id===lk.ma_ck_chinh);
      if(bp && bp.ma_doanhthu){ lk.ma_doanhthu_tinhck = bp.ma_doanhthu; changedLuyKe = true; }
    });
    if(changedDoanhThu) await saveDoanhThu();
    if(changedPrograms) await savePrograms();
    if(changedLuyKe) await saveLuyKe();
    if(changedDoanhThu || changedPrograms || changedLuyKe){
      toast('Đã tự động tạo Danh mục Mã doanh thu cho các Mã chiết khấu cũ','ok');
      if(UI.tab==='doanhthu') renderDoanhThu();
      if(UI.tab==='programs') renderProgramsHub();
    }
  } finally {
    _migratingDoanhThu = false;
  }
}

/* ============================ DANH MỤC KẾ HOẠCH DOANH THU ============================ */
function ymdStamp_(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return '' + y + m + day;
}
function makeMaKeHoach_(ngayLapISO){
  const d = ngayLapISO ? new Date(ngayLapISO) : new Date();
  const prefix = ymdStamp_(d) + '.';
  let maxSeq = 0;
  (DB.kehoach||[]).forEach(r=>{
    if(String(r.ma_kehoach||'').indexOf(prefix)===0){
      const seq = parseInt(String(r.ma_kehoach).slice(prefix.length),10);
      if(!isNaN(seq) && seq>maxSeq) maxSeq = seq;
    }
  });
  return prefix + String(maxSeq+1).padStart(3,'0');
}
// Tìm kế hoạch khớp Mã doanh thu (ưu tiên khớp đích danh trước "ALL") + khớp ngày rơi vào khoảng kỳ.
// MỚI: tra theo 2 tầng — trước tiên tìm trong "Chi tiết kế hoạch" (bảng con, theo từng kỳ Tháng/Quý/
// 6 Tháng/Năm/kỳ tùy chỉnh) của các kế hoạch (cha) áp dụng cho đúng Mã doanh thu; nếu kế hoạch cha có
// chi tiết nhưng KHÔNG có kỳ nào khớp đúng ngày, KHÔNG rơi về số tổng của cha (vì cha lúc này chỉ là
// khung bao ngoài để sinh kỳ, số liệu thật nằm ở từng kỳ con) — chỉ rơi về số của cha khi cha CHƯA hề
// có chi tiết nào (kế hoạch đơn giản, dùng ngay số tổng của cha, y hệt hành vi ban đầu).
function keHoachAppliesToDoanhThu_(r, maDoanhThuId){
  const raw = String(r.ma_doanhthu||'').trim();
  if(!raw || norm(raw)==='ALL') return true;
  const list = raw.split(',').map(x=>x.trim()).filter(Boolean);
  return list.includes(maDoanhThuId);
}
function lookupKeHoach_(maDoanhThuId, ngayISO){
  if(!ngayISO) return null;
  const parents = (DB.kehoach||[]).filter(r=>
    periodOverlap(ngayISO, ngayISO, r.hieuluctu, r.hieulucden) && keHoachAppliesToDoanhThu_(r, maDoanhThuId)
  );
  if(!parents.length) return null;
  // Ưu tiên kế hoạch áp dụng ĐÍCH DANH mã doanh thu (không phải "ALL" hoặc danh sách nhiều mã) trước
  parents.sort((a,b)=>{
    const aAll = norm(a.ma_doanhthu)==='ALL' || !a.ma_doanhthu ? 1 : 0;
    const bAll = norm(b.ma_doanhthu)==='ALL' || !b.ma_doanhthu ? 1 : 0;
    return aAll - bAll;
  });
  for(const p of parents){
    const children = (DB.kehoachChiTiet||[]).filter(c=>c.kehoach_id===p.id && periodOverlap(ngayISO, ngayISO, c.tu_ngay, c.den_ngay));
    if(children.length){
      // Nếu nhiều kỳ cùng khớp (VD Tháng + Quý + 6 Tháng đều chứa ngày này), ưu tiên kỳ NGẮN NHẤT
      // (chi tiết nhất — Tháng trước Quý, Quý trước 6 Tháng...) để phản ánh đúng kế hoạch sát nhất.
      children.sort((a,b)=> (new Date(a.den_ngay)-new Date(a.tu_ngay)) - (new Date(b.den_ngay)-new Date(b.tu_ngay)));
      return { dt_kehoach: children[0].dt_kehoach, sl_kehoach: children[0].sl_kehoach, ky: children[0].ky, parent: p };
    }
    const hasAnyChild = (DB.kehoachChiTiet||[]).some(c=>c.kehoach_id===p.id);
    if(!hasAnyChild && (p.dt_kehoach || p.sl_kehoach)){
      return { dt_kehoach: p.dt_kehoach, sl_kehoach: p.sl_kehoach, ky: null, parent: p };
    }
  }
  return null;
}

async function handleKeHoachFile(file){
  try{
    const wb = await readWorkbook(file);
    const ws = findSheet(wb, ['DM_KEHOACH','KEHOACH']) || wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {defval:''});
    let c=0;
    data.forEach(row=>{
      const hieuluctu = excelDateToISO(getVal(row,['Hiệu lực từ ngày','HIEULUCTU']));
      const hieulucden = excelDateToISO(getVal(row,['Hiệu lực đến ngày','HIEULUCDEN']));
      if(!hieuluctu || !hieulucden) return;
      const maDtRaw = String(getVal(row,['Mã doanh thu','MA_DOANHTHU'])||'ALL').trim();
      let ma_doanhthu = 'ALL';
      if(norm(maDtRaw)!=='ALL' && maDtRaw!==''){
        const codes = maDtRaw.split(',').map(x=>x.trim()).filter(Boolean);
        const ids = codes.map(code=>(DB.doanhthu.find(d=>norm(d.ma)===norm(code))||{}).id).filter(Boolean);
        ma_doanhthu = ids.length ? ids.join(',') : 'ALL';
      }
      let ma_kehoach = String(getVal(row,['Mã kế hoạch','MA_KEHOACH'])||'').trim();
      const ngaylap = excelDateToISO(getVal(row,['Ngày lập kế hoạch','NGAYLAP'])) || todayISO();
      if(!ma_kehoach) ma_kehoach = makeMaKeHoach_(ngaylap);
      const rowObj = {
        ma_kehoach, ngaylap, hieuluctu, hieulucden,
        dt_kehoach: cleanExcelNumber(getVal(row,['Doanh thu kế hoạch','DT_KEHOACH'])),
        sl_kehoach: cleanExcelNumber(getVal(row,['Sản lượng kế hoạch','SL_KEHOACH'])),
        ma_doanhthu
      };
      const existing = DB.kehoach.find(x=>norm(x.ma_kehoach)===norm(ma_kehoach));
      if(existing) Object.assign(existing, rowObj); else DB.kehoach.push({ id: uid(), ...rowObj });
      c++;
    });
    // Nạp kèm sheet Chi tiết kế hoạch theo kỳ, nếu file có (tra ngược Mã kế hoạch -> id)
    const wsCt = findSheet(wb, ['DM_KEHOACH_CHITIET','KEHOACH_CHITIET']);
    let cCt = 0;
    if(wsCt){
      const dataCt = XLSX.utils.sheet_to_json(wsCt, {defval:''});
      dataCt.forEach(row=>{
        const maKeHoach = String(getVal(row,['Mã kế hoạch','MA_KEHOACH'])||'').trim();
        const kh = DB.kehoach.find(x=>norm(x.ma_kehoach)===norm(maKeHoach));
        const tu = excelDateToISO(getVal(row,['Từ ngày','TU_NGAY']));
        const den = excelDateToISO(getVal(row,['Đến ngày','DEN_NGAY']));
        if(!kh || !tu || !den) return;
        const ky = String(getVal(row,['Kỳ','KY'])||'').trim() || (tu+'~'+den);
        const rowObj = {
          kehoach_id: kh.id, ky, tu_ngay: tu, den_ngay: den,
          dt_kehoach: cleanExcelNumber(getVal(row,['Doanh thu kế hoạch','DT_KEHOACH'])),
          sl_kehoach: cleanExcelNumber(getVal(row,['Sản lượng kế hoạch','SL_KEHOACH']))
        };
        const existing = DB.kehoachChiTiet.find(x=>x.kehoach_id===kh.id && norm(x.ky)===norm(ky));
        if(existing) Object.assign(existing, rowObj); else DB.kehoachChiTiet.push({ id: uid(), ...rowObj });
        cCt++;
      });
    }
    await saveKeHoach();
    if(cCt) await saveKeHoachChiTiet();
    toast(`Đã nạp ${c} kế hoạch doanh thu${cCt?` · ${cCt} dòng chi tiết theo kỳ`:''}`,'ok');
    renderKeHoach();
  }catch(err){ toast('Lỗi xử lý tệp Danh mục kế hoạch: ' + err.message, 'err'); }
}

/* ---- Chi tiết kế hoạch: bảng con theo từng kỳ (Tháng/Quý/6 Tháng/Năm — tự sinh, hoặc kỳ tùy chỉnh) ---- */
// Sinh danh sách các kỳ chuẩn (Tháng/Quý/6 Tháng/Năm) nằm TRỌN trong khoảng [hieuluctu, hieulucden]
function periodsWithinRange_(hieuluctu, hieulucden){
  const result = [];
  if(!hieuluctu || !hieulucden) return result;
  const start = new Date(hieuluctu), end = new Date(hieulucden);
  if(isNaN(start) || isNaN(end) || start>end) return result;
  for(let y=start.getFullYear(); y<=end.getFullYear(); y++){
    for(let m=1; m<=12; m++){
      const ms = new Date(y,m-1,1), me = new Date(y,m,0);
      if(ms>=start && me<=end) result.push({ ky:`T${m}_${y}`, tu_ngay: toISO(ms), den_ngay: toISO(me) });
    }
    for(let q=1; q<=4; q++){
      const qs = new Date(y,(q-1)*3,1), qe = new Date(y,q*3,0);
      if(qs>=start && qe<=end) result.push({ ky:`Q${q}_${y}`, tu_ngay: toISO(qs), den_ngay: toISO(qe) });
    }
    for(let h=1; h<=2; h++){
      const hs = new Date(y,(h-1)*6,1), he = new Date(y,h*6,0);
      if(hs>=start && he<=end) result.push({ ky:`6T${h}_${y}`, tu_ngay: toISO(hs), den_ngay: toISO(he) });
    }
    const ys = new Date(y,0,1), ye = new Date(y,11,31);
    if(ys>=start && ye<=end) result.push({ ky:`Nam_${y}`, tu_ngay: toISO(ys), den_ngay: toISO(ye) });
  }
  return result;
}

        <button class="btn btn-sm" onclick="openKeHoachChiTietForm('${kehoachId}')">${ICON.plus} Thêm kỳ tùy chỉnh</button>
      </div>
      <button class="btn" onclick="closeModal()">Đóng</button>

async function autoGenKeHoachChiTiet(kehoachId){
  const kh = DB.kehoach.find(x=>x.id===kehoachId);
  if(!kh) return;
  if(!kh.hieuluctu || !kh.hieulucden){ toast('Kế hoạch chưa có đủ Hiệu lực từ/đến ngày để tự sinh kỳ','err'); return; }
  const periods = periodsWithinRange_(kh.hieuluctu, kh.hieulucden);
  const existingKy = new Set(DB.kehoachChiTiet.filter(c=>c.kehoach_id===kehoachId).map(c=>norm(c.ky)));
  let added = 0;
  periods.forEach(p=>{
    if(existingKy.has(norm(p.ky))) return;
    DB.kehoachChiTiet.push({ id: uid(), kehoach_id: kehoachId, ky: p.ky, tu_ngay: p.tu_ngay, den_ngay: p.den_ngay, dt_kehoach:'', sl_kehoach:'' });
    added++;
  });
  if(added){
    await saveKeHoachChiTiet();
    toast(`Đã tự động sinh ${added} kỳ mới`,'ok');
  } else {
    toast('Không có kỳ mới nào để sinh thêm (đã đủ hoặc khung hiệu lực chưa đủ 1 kỳ trọn vẹn)','err');
  }
  renderKeHoachChiTietManagerBody(kehoachId);
  renderKeHoach();
}
window.autoGenKeHoachChiTiet = autoGenKeHoachChiTiet;

      <div class="field"><label>Sản lượng kế hoạch</label><input type="text" inputmode="numeric" id="kc_sl" value="${fmtIntInputVal(row.sl_kehoach)}" oninput="liveFormatIntInput(this)"></div>
    </div>

async function saveKeHoachChiTietForm(kehoachId, idx){
  const ky = document.getElementById('kc_ky').value.trim();
  const tu_ngay = document.getElementById('kc_tu').value;
  const den_ngay = document.getElementById('kc_den').value;
  if(!ky || !tu_ngay || !den_ngay){ toast('Vui lòng nhập đủ Tên kỳ, Từ ngày, Đến ngày','err'); return; }
  if((DB.kehoachChiTiet||[]).some((x,i)=>x.kehoach_id===kehoachId && norm(x.ky)===norm(ky) && i!==idx)){
    toast('Kỳ này đã tồn tại trong kế hoạch — đổi tên kỳ khác hoặc sửa kỳ đã có','err'); return;
  }
  const row = {
    id: idx!=null ? DB.kehoachChiTiet[idx].id : uid(),
    kehoach_id: kehoachId, ky, tu_ngay, den_ngay,
    dt_kehoach: rawIntVal('kc_dt'), sl_kehoach: rawIntVal('kc_sl')
  };
  if(idx!=null) DB.kehoachChiTiet[idx] = row; else DB.kehoachChiTiet.push(row);
  await saveKeHoachChiTiet();
  toast('Đã lưu kỳ chi tiết','ok');
  openKeHoachChiTietManager(kehoachId);
  renderKeHoach();
}
window.saveKeHoachChiTietForm = saveKeHoachChiTietForm;
window.deleteKeHoachChiTietRow = async (idx, kehoachId)=>{
  if(!confirm('Xóa kỳ chi tiết này?')) return;
  DB.kehoachChiTiet.splice(idx,1);
  await saveKeHoachChiTiet();
  toast('Đã xóa','ok');
  openKeHoachChiTietManager(kehoachId);
  renderKeHoach();
};

// Bỏ hậu tố số thứ tự (_001, _002...) để lấy lại "mã gốc" theo tổ hợp dims
function stripSeqSuffix(code){
  return String(code||'').replace(/_\d{3}$/, '');
}
// Luôn sinh mã chiết khấu DUY NHẤT: nếu 2 chương trình có cùng tổ hợp dims (VD cùng chọn Loại SP=TBR,
// còn lại NO) thì mã gốc sẽ trùng nhau -> gây lỗi khi lưu báo cáo (REPORT_CKTH dùng Mã chiết khấu làm
// khóa, 2 chương trình trùng mã sẽ ghi đè/cộng dồn sai doanh số cho nhau). Nay LUÔN ghép thêm số thứ tự
// 3 chữ số (_001, _002...) theo thứ tự tạo trước - sau trong nhóm cùng tổ hợp dims.
function makeUniqueMaChietkhau(baseCode, excludeId){
  const siblings = DB.programs.filter(p => p.id!==excludeId && stripSeqSuffix(p.ma_chietkhau)===baseCode);
  const n = siblings.length + 1;
  return baseCode + '_' + String(n).padStart(3,'0');
}
// THEO GÓP Ý: kiểm tra 2 chương trình có TRÙNG PHẠM VI kích thước hay không (dùng khi cảnh báo chồng
// chéo lúc tạo/sửa chương trình) — coi "NO"/rỗng là áp dụng cho tất cả (giao với mọi giá trị khác),
// danh sách nhiều mã cách nhau dấu "," coi là tập hợp OR, chỉ cần giao nhau 1 giá trị là coi như trùng.
function programsOverlapDims(a, b){
  return DIM_KEYS.every(k=>{
    const av = norm(a['dim_'+k]), bv = norm(b['dim_'+k]);
    if(av==='NO'||av===''||bv==='NO'||bv==='') return true;
    const aset = av.split(',').map(x=>x.trim());
    const bset = bv.split(',').map(x=>x.trim());
    return aset.some(x=>bset.includes(x));
  });
}
async function saveProgramForm(idx) {
  // 1. Lấy nút Lưu và đổi trạng thái để tránh bấm nhiều lần
  const saveBtn = event.target;
  const originalText = saveBtn.innerText;
  saveBtn.disabled = true;
  saveBtn.innerHTML = 'Đang lưu...';

  try {
    const g = (id) => document.getElementById(id).value;
    const ma_doanhthu = g('f_ma_doanhthu');
    if(!ma_doanhthu){
      toast('Vui lòng chọn Mã doanh thu (điều kiện)','err');
      saveBtn.disabled = false; saveBtn.innerText = originalText;
      return;
    }
    const ma_doanhthu_tinhck = g('f_ma_doanhthu_tinhck') || ma_doanhthu;
    const dtDims = doanhThuDims_(ma_doanhthu) || {thuonghieu:'NO',nhomkh:'NO',loaisp:'NO',dactinh:'NO',congdung:'NO',quycach:'NO'};
    const dims = {};
    DIM_KEYS.forEach(k => dims['dim_' + k] = dtDims[k] || 'NO');
    const baseCode = DIM_KEYS.map(k => dims['dim_' + k]).join('_');
    const existingId = idx != null ? DB.programs[idx].id : null;
    let ma_chietkhau;
    if(idx != null && stripSeqSuffix(DB.programs[idx].ma_chietkhau) === baseCode){
      // Sửa chương trình nhưng KHÔNG đổi tổ hợp dims -> giữ nguyên mã (và số thứ tự) đã gán trước đó
      ma_chietkhau = DB.programs[idx].ma_chietkhau;
    } else {
      // Chương trình mới, hoặc đổi tổ hợp dims -> cấp mã mới kèm số thứ tự duy nhất
      ma_chietkhau = makeUniqueMaChietkhau(baseCode, existingId);
    }
    
    const row = {
      id: idx != null ? DB.programs[idx].id : uid(),
      ngaytao: idx != null ? DB.programs[idx].ngaytao : todayISO(),
      chuongtrinh_id: document.getElementById('f_chuongtrinh_id').value || '',
      hieuluctu: g('f_hieuluctu'), 
      hieulucden: g('f_hieulucden'),
      ...dims, 
      ma_doanhthu, ma_doanhthu_tinhck,
      ma_chietkhau,
      sl_min: rawIntVal('f_sl_min'), 
      sl_max: rawIntVal('f_sl_max'), 
      dt_min: rawIntVal('f_dt_min'), 
      dt_max: rawIntVal('f_dt_max'),
      dieukien_sldt: g('f_dieukien_sldt'),
      thoidiem_ck: g('f_thoidiem_ck'), 
      ht_chietkhau: g('f_ht_chietkhau'),
      tt_ck: g('f_tt_ck'),
      dt_kehoach: rawIntVal('f_dt_kehoach'), 
      tl_ck: g('f_tl_ck'), 
      dongia_codinh: rawIntVal('f_dongia_codinh'),
      pct_kh_min: g('f_pct_kh_min'),
      pct_kh_max: g('f_pct_kh_max'),
      ghichu: g('f_ghichu'),
      // THEO GÓP Ý: ghi vết người sửa/thời điểm sửa gần nhất — hữu ích khi có nhiều người cùng thao tác
      created_by: idx != null ? (DB.programs[idx].created_by || '') : (window.CURRENT_USER_EMAIL || ''),
      updated_by: window.CURRENT_USER_EMAIL || 'Không xác định',
      updated_at: new Date().toISOString()
    };

    if (!row.hieuluctu || !row.hieulucden) {
      toast('Vui lòng nhập hiệu lực từ/đến ngày', 'err');
      saveBtn.disabled = false;
      saveBtn.innerText = originalText;
      return;
    }

    // THEO GÓP Ý: cảnh báo chủ động nếu chương trình này TRÙNG PHẠM VI (cùng tổ hợp kích thước giao
    // nhau) VÀ TRÙNG THỜI GIAN HIỆU LỰC với 1 chương trình khác đang có — không chặn lưu (vẫn có thể
    // là chủ ý, VD 2 chương trình cộng dồn), chỉ nhắc để tránh tạo nhầm.
    const overlapping = DB.programs.filter(p => p.id !== row.id
      && periodOverlap(row.hieuluctu, row.hieulucden, p.hieuluctu, p.hieulucden)
      && programsOverlapDims(row, p));
    if (overlapping.length) {
      const names = overlapping.map(p=>p.ma_chietkhau).join(', ');
      const ok = confirm(`⚠ Chương trình này TRÙNG PHẠM VI mặt hàng và thời gian hiệu lực với ${overlapping.length} chương trình đang có:\n${names}\n\nMột mặt hàng có thể bị tính chiết khấu ở cả 2 chương trình cùng lúc. Bạn có chắc muốn lưu tiếp không?`);
      if (!ok) {
        saveBtn.disabled = false;
        saveBtn.innerText = originalText;
        return;
      }
    }

    if (idx != null) DB.programs[idx] = row; 
    else DB.programs.push(row);

    // 2. Gọi hàm lưu lên Google Sheets
    await savePrograms();
    
    // 3. Đóng modal và render lại giao diện
    closeModal(); 
    toast('Đã lưu dữ liệu đám mây thành công', 'ok'); 
    renderPrograms();

  } catch (error) {
    console.error(error);
    toast('Có lỗi xảy ra, vui lòng thử lại', 'err');
    saveBtn.disabled = false;
    saveBtn.innerText = originalText;
  }
}

function copyLuyKeRow(idx){
  const src = DB.programsLuyKe[idx];
  if(!src) return;
  const clone = Object.assign({}, src, { ma_ck_chinh:'', hieuluctu:'', hieulucden:'' });
  delete clone.id;
  openLuyKeForm(null, clone);
}
window.copyLuyKeRow = copyLuyKeRow;
window.toggleLuyKeKieuTinh = function(v){
  document.getElementById('lk_group_allreduced').style.display = v==='all_or_reduced' ? 'block' : 'none';
  document.getElementById('lk_group_dual').style.display = v==='dual_condition' ? 'block' : 'none';
};
async function saveLuyKeForm(idx){
  const ma_ck_chinh = document.getElementById('lk_ma_ck_chinh').value;
  if(!ma_ck_chinh){ toast('Vui lòng chọn chương trình chiết khấu chính','err'); return; }
  const thang_luyke = readMonthCheckboxValue('lk');
  if(!thang_luyke){ toast('Vui lòng chọn ít nhất 1 tháng lũy kế','err'); return; }
  const row = {
    id: idx!=null ? DB.programsLuyKe[idx].id : uid(),
    ma_ck_chinh, thang_luyke,
    ma_doanhthu_tinhck: document.getElementById('lk_ma_doanhthu_tinhck').value || '',
    thoidiem_ck: document.getElementById('lk_thoidiem_ck').value,
    tt_ck_bosung: document.getElementById('lk_tt_ck_bosung').value,
    kieu_tinh: document.getElementById('lk_kieu_tinh').value,
    sl_min: rawIntVal('lk_sl_min'), sl_max: rawIntVal('lk_sl_max'),
    dt_min: rawIntVal('lk_dt_min'), dt_max: rawIntVal('lk_dt_max'),
    dt_kehoach: rawIntVal('lk_dt_kehoach'),
    pct_kh_min: document.getElementById('lk_pct_kh_min').value,
    pct_kh_max: document.getElementById('lk_pct_kh_max').value,
    ck_bosung: document.getElementById('lk_ck_bosung').value,
    ck_reduced_pct: document.getElementById('lk_ck_reduced_pct').value,
    dk1_pct_thang_min: document.getElementById('lk_dk1_pct').value,
    dk1_rate: document.getElementById('lk_dk1_rate').value,
    dk2_pct_ky_min: document.getElementById('lk_dk2_pct').value,
    dk2_rate: document.getElementById('lk_dk2_rate').value,
    hieuluctu: document.getElementById('lk_hieuluctu').value,
    hieulucden: document.getElementById('lk_hieulucden').value
  };
  if(idx!=null) DB.programsLuyKe[idx] = row; else DB.programsLuyKe.push(row);
  await saveLuyKe();
  closeModal(); toast('Đã lưu chương trình chiết khấu lũy kế','ok'); renderLuyKe();
}
window.saveLuyKeForm = saveLuyKeForm;
window.deleteLuyKeRow = async (idx)=>{
  if(!confirm('Xóa chương trình chiết khấu lũy kế này?')) return;
  DB.programsLuyKe.splice(idx,1);
  await saveLuyKe(); toast('Đã xóa','ok'); renderLuyKe();
};
function exportLuyKeXlsx(){
  const rows = DB.programsLuyKe.map(lk=>{
    const bp = DB.programs.find(p=>p.id===lk.ma_ck_chinh);
    return {
      'Mã CT chính': bp?bp.ma_chietkhau:'', 'Tháng lũy kế': lk.thang_luyke,
      'Thời điểm CK': lk.thoidiem_ck, 'Kiểu tính': lk.kieu_tinh==='dual_condition'?'2 điều kiện':'Đạt tất cả tháng', 'SL_MIN': lk.sl_min, 'SL_MAX': lk.sl_max,
      'DT_MIN': lk.dt_min, 'DT_MAX': lk.dt_max, 'DT_KEHOACH': lk.dt_kehoach,
      'PCT_KH_MIN': lk.pct_kh_min, 'PCT_KH_MAX': lk.pct_kh_max,
      'CK_BOSUNG': lk.ck_bosung, 'CK_REDUCED_PCT': lk.ck_reduced_pct,
      'DK1_PCT_THANG_MIN': lk.dk1_pct_thang_min, 'DK1_RATE': lk.dk1_rate,
      'DK2_PCT_KY_MIN': lk.dk2_pct_ky_min, 'DK2_RATE': lk.dk2_rate,
      'TT_CK_BOSUNG': ttCkLabel(lk.tt_ck_bosung),
      'Hiệu lực từ ngày': lk.hieuluctu, 'Hiệu lực đến ngày': lk.hieulucden
    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'CHUONGTRINHCHIETKHAU_LUYKE');
  downloadWb(wb, 'CHIETKHAU_LUYKE_export.xlsx');
  toast('Đã xuất file chiết khấu lũy kế','ok');
}

/* ============================ ĐỐI CHIẾU GIÁ MUA - GIÁ CÔNG BỐ ============================ */
// So sánh giá mua thực tế (bình quân theo Sổ chi tiết mua hàng) với giá công bố NCC (tra theo Mã MH,
// đúng theo ngày phát sinh từng dòng mua hàng) — theo từng mặt hàng, và chi tiết theo từng phiếu (Số HĐ).
function computePriceComparison(fromDate, toDate, supplierFilter){
  const map = mhckMap();
  const gcbMap = giaCongBoMap();
  const purchases = DB.purchases.filter(p=>{
    if(!p.ngay) return false;
    if(fromDate && p.ngay < fromDate) return false;
    if(toDate && p.ngay > toDate) return false;
    if(supplierFilter && norm(p.nhacungcap).indexOf(norm(supplierFilter)) === -1) return false;
    return true;
  });

  const detail = [];
  const summaryAgg = {};
  purchases.forEach(p=>{
    const key = norm(p.mahang);
    const mhckRec = map[key];
    const maMH = mhckRec ? mhckRec.mamh_ncc : '';
    const gcb = maMH ? lookupGiaCongBo(maMH, p.ngay, gcbMap) : null;
    const dongia = Number(p.dongia)||0;
    const sl = Number(p.soluong)||0;
    const chenhLech = gcb!=null ? (dongia - gcb) : null;
    detail.push({
      ngay: p.ngay, sohd: p.sohd, mahang: p.mahang, tenhang: (mhckRec&&mhckRec.tenhang)||p.tenhang||'',
      nhacungcap: p.nhacungcap, soluong: sl, dongia, giaCongBo: gcb, chenhLech,
      pctChenhLech: (gcb) ? (chenhLech/gcb*100) : null
    });
    if(!summaryAgg[key]) summaryAgg[key] = { mahang:p.mahang, tenhang:(mhckRec&&mhckRec.tenhang)||p.tenhang||'', sl:0, dt:0, cbGT:0, cbSL:0, hasNCC:!!maMH, soPhieu:0 };
    const s = summaryAgg[key];
    s.sl += sl; s.dt += Number(p.giatri)||0; s.soPhieu += 1;
    if(maMH) s.hasNCC = true;
    if(gcb!=null){ s.cbGT += gcb*sl; s.cbSL += sl; }
  });

  const summary = Object.values(summaryAgg).map(s=>{
    const giaMuaTB = s.sl ? s.dt/s.sl : 0;
    const giaCongBoTB = s.cbSL ? s.cbGT/s.cbSL : 0;
    const chenhLech = (s.cbSL>0) ? (giaMuaTB - giaCongBoTB) : null;
    return {
      mahang: s.mahang, tenhang: s.tenhang, soPhieu: s.soPhieu, sl: s.sl, dt: s.dt,
      giaMuaTB, giaCongBoTB, coGiaCongBo: s.cbSL>0, hasNCC: s.hasNCC,
      chenhLech, pctChenhLech: (chenhLech!=null && giaCongBoTB) ? (chenhLech/giaCongBoTB*100) : null
    };
  }).sort((a,b)=> Math.abs(b.chenhLech||0) - Math.abs(a.chenhLech||0));

  detail.sort((a,b)=> (a.ngay||'').localeCompare(b.ngay||'') || String(a.sohd||'').localeCompare(String(b.sohd||'')));

  return { summary, detail };
}

function exportPriceCompareXlsx(){

    'Mã hàng': s.mahang, 'Tên hàng': s.tenhang, 'Số phiếu': s.soPhieu, 'Sản lượng': s.sl,

    'Giá công bố': s.coGiaCongBo ? Math.round(s.giaCongBoTB) : '',
    'Chênh lệch': s.chenhLech!=null ? Math.round(s.chenhLech) : '',
    '% Chênh lệch': s.pctChenhLech!=null ? Number(s.pctChenhLech.toFixed(2)) : ''
  }));
  const outDetail = detail.map(d=>({
    'Ngày chứng từ': d.ngay, 'Số HĐ': d.sohd, 'Mã hàng': d.mahang, 'Tên hàng': d.tenhang,
    'Nhà cung cấp': d.nhacungcap, 'Số lượng': d.soluong, 'Đơn giá mua': d.dongia,
    'Giá công bố': d.giaCongBo!=null ? d.giaCongBo : '',
    'Chênh lệch': d.chenhLech!=null ? d.chenhLech : '',
    '% Chênh lệch': d.pctChenhLech!=null ? Number(d.pctChenhLech.toFixed(2)) : ''
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(outSummary), 'TongHopTheoMatHang');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(outDetail), 'ChiTietTheoPhieu');
  downloadWb(wb, `DoiChieuGia_${from}_${to}.xlsx`);
  toast('Đã xuất báo cáo đối chiếu giá','ok');
}

/* ============================ BÁO CÁO CHIẾT KHẤU (phân tích dữ liệu đã lưu REPORT_CKTH/CKCT) ============================ */
// Nhà cung cấp không lưu trực tiếp trong CKCT theo từng dòng mặt hàng (vì báo cáo có thể được lưu ở chế
// độ "Tất cả NCC"), nên khi lọc theo Nhà cung cấp, hệ thống đối chiếu NGƯỢC lại Sổ chi tiết mua hàng để
// xác định mã hàng đó có phát sinh mua từ NCC được chọn trong đúng khoảng ngày của dòng báo cáo hay không.
function getSuppliersForSkuPeriod(mahang, tu, den){
  const set = new Set();
  DB.purchases.forEach(p=>{
    if(norm(p.mahang)!==norm(mahang)) return;
    if(tu && p.ngay < tu) return;
    if(den && p.ngay > den) return;
    if(p.nhacungcap) set.add(p.nhacungcap);
  });
  return set;
}
function ckctMatchesSupplier(row, supplier){
  if(!supplier) return true;
  return getSuppliersForSkuPeriod(row.mahang, row.tu_ngay, row.den_ngay).has(supplier);
}

// THEO YÊU CẦU: quét toàn bộ REPORT_CKTH/REPORT_CKCT tìm các dòng "trùng tháng nhưng khác khoảng
// ngày" — nguyên nhân gây trùng thực tế (do upsert chỉ ghi đè khi Từ ngày–Đến ngày khớp CHÍNH XÁC,
// nếu lệch dù 1 ngày sẽ tạo thêm dòng mới thay vì cập nhật). Kiểm tra cả trùng khóa chính xác (hiếm khi
// xảy ra vì upsert đã chặn, nhưng vẫn kiểm tra phòng trường hợp sửa tay trực tiếp trên Sheet).
// THEO YÊU CẦU: tính sẵn 1 "kế hoạch dọn dẹp" (không tự áp dụng ngay) để người dùng xem trước số lượng
// sẽ bị xoá trước khi xác nhận. Quy tắc chọn khoảng ngày GIỮ LẠI cho mỗi (chương trình, tháng, năm)
// đang có >1 khoảng ngày khác nhau (nguyên nhân gây trùng):
//   1) Ưu tiên khoảng ngày KHỚP ĐÚNG ranh giới kỳ chuẩn (dùng lại đúng snapPeriodFromDate() — cùng công
//      thức mà "Tự động tính & lưu" luôn dùng) — đây gần như chắc chắn là bản ĐÚNG.
//   2) Nếu không khoảng nào khớp chuẩn (VD dùng "Tùy chọn"/"Theo hiệu lực CTKM" nên không có ranh giới
//      để đối chiếu), giữ khoảng XUẤT HIỆN CUỐI trong mảng — heuristic hợp lý nhất khi không có trường
//      "thời gian lưu" để biết chắc bản nào mới hơn (xem giải thích tại saveSheetData/appendOrUpsertRows_).
// Sau đó áp dụng đúng quyết định "khoảng ngày giữ lại" của CKTH sang CKCT (khớp theo program_id +
// tháng/năm suy ra từ den_ngay — cùng cách checkDuplicateReports() đang nhóm CKCT), và cuối cùng khử
// nốt các dòng trùng khóa chính xác còn sót (hiếm, chỉ do sửa tay trực tiếp trên Sheet).
function buildDedupPlan_(){
  const ckth = DB.reportCKTH || [];
  const ckct = DB.reportCKCT || [];
  const keepRangeByGroup = {};
  const groups = {};
  ckth.forEach(r=>{
    const k = [r.program_id, r.thang_chietkhau, r.nam_chietkhau].join('||');
    (groups[k] = groups[k] || []).push(r);
  });
  Object.entries(groups).forEach(([k, rows])=>{
    const ranges = [...new Set(rows.map(r=>r.tu_ngay+'~'+r.den_ngay))];
    if(ranges.length<=1){ if(ranges[0]) keepRangeByGroup[k]=ranges[0]; return; }
    let canonical = null;
    for(const range of ranges){
      const sample = rows.find(r=>(r.tu_ngay+'~'+r.den_ngay)===range);
      const snap = snapPeriodFromDate(sample.tu_ngay, sample.thoidiem_chietkhau);
      if(snap && snap.from===sample.tu_ngay && snap.to===sample.den_ngay){ canonical = range; break; }
    }
    keepRangeByGroup[k] = canonical || ranges[ranges.length-1];
  });

  const ckthAfterRange = ckth.filter(r=>{
    const k = [r.program_id, r.thang_chietkhau, r.nam_chietkhau].join('||');
    const keep = keepRangeByGroup[k];
    return !keep || (r.tu_ngay+'~'+r.den_ngay)===keep;
  });
  const ckctAfterRange = ckct.filter(r=>{
    const dt = r.den_ngay ? new Date(r.den_ngay) : null;
    if(!dt) return true;
    const k = [r.program_id, dt.getMonth()+1, dt.getFullYear()].join('||');
    const keep = keepRangeByGroup[k];
    return !keep || (r.tu_ngay+'~'+r.den_ngay)===keep;
  });

  function dedupExact(list, keyFn){
    const lastIdx = {};
    list.forEach((r,i)=>{ lastIdx[keyFn(r)] = i; });
    return list.filter((r,i)=> lastIdx[keyFn(r)]===i);
  }
  const finalCkth = dedupExact(ckthAfterRange, r=>[r.program_id,r.tu_ngay,r.den_ngay].join('||'));
  const finalCkct = dedupExact(ckctAfterRange, r=>[r.program_id,r.tu_ngay,r.den_ngay,r.mahang].join('||'));

  return {
    finalCkth, finalCkct,
    removedCkth: ckth.length - finalCkth.length,
    removedCkct: ckct.length - finalCkct.length
  };
}
// Áp dụng kế hoạch dọn dẹp: GHI ĐÈ TOÀN BỘ (không phải upsert) 2 sheet REPORT_CKTH/REPORT_CKCT bằng
// đúng danh sách đã lọc — cần overwrite thật sự vì mục tiêu là XOÁ bớt dòng, upsert không xoá được.
async function applyDedupPlan_(){
  const plan = buildDedupPlan_();
  if(plan.removedCkth===0 && plan.removedCkct===0){ toast('Không có gì để dọn dẹp.','ok'); return; }
  if(!confirm(`Sẽ xoá ${plan.removedCkth} dòng báo cáo tổng hợp và ${plan.removedCkct} dòng chi tiết bị trùng, chỉ giữ lại đúng 1 khoảng ngày hợp lệ nhất cho mỗi tháng. Hành động này KHÔNG thể hoàn tác (không có thùng rác). Tiếp tục?`)) return;
  closeModal();
  toast('Đang dọn dẹp dữ liệu trùng lặp...', 'ok');
  try{
    await new Promise((res,rej)=>{
      google.script.run.withSuccessHandler(res).withFailureHandler(rej).overwriteReportCKTH(plan.finalCkth);
    });
    const version = await new Promise((res,rej)=>{
      google.script.run.withSuccessHandler(res).withFailureHandler(rej).overwriteReportCKCT(plan.finalCkct);
    });
    DB.reportCKTH = plan.finalCkth;
    DB.reportCKCT = plan.finalCkct;
    writeCache(version, snapshotDB());
    toast(`Đã dọn dẹp xong: xoá ${plan.removedCkth} dòng CKTH, ${plan.removedCkct} dòng CKCT.`, 'ok');
    if(UI.tab==='baocao') renderBaoCao();
  }catch(err){
    toast('Lỗi khi dọn dẹp: '+(err.message||err), 'err');
  }
}
window.applyDedupPlan_ = applyDedupPlan_;

/* ============================ BẢNG THEO DÕI CHIẾT KHẤU (theo Chương trình / Mã chiết khấu) ============================ */
// THEO YÊU CẦU: liệt kê từng Mã chiết khấu (Tầng 2), tách theo TỪNG KỲ (Tháng/Quý/6 Tháng/Năm — theo
// đúng "Thời điểm tính CK" đã khai trên mã đó) trong suốt khoảng hiệu lực của nó, và cho biết kỳ đó ĐÃ
// được tính & lưu báo cáo hay CHƯA, kèm mô tả dễ hiểu về cách tính. Không tạo dữ liệu mới, không đụng
// Sheet — chỉ ĐỌC DB.programs/DB.chuongtrinh/DB.dieukien/DB.reportCKTH đã có sẵn trong bộ nhớ.

// Chia khoảng [fromISO, toISO_] thành các kỳ chuẩn (Tháng/Quý/6 Tháng/Năm) bằng đúng snapPeriodFromDate
// đã dùng ở nơi khác trong app (chống trùng báo cáo) — đảm bảo các kỳ liệt kê ở đây khớp CHÍNH XÁC với
// khoảng ngày mà "Tự động tính & lưu"/"Lưu báo cáo" thủ công sẽ dùng cho cùng kỳ đó.
function enumeratePeriods_(fromISO, toISO_, thoidiem){
  if(!fromISO) return [];
  const endISO = toISO_ || todayISO(); // còn hiệu lực (chưa có ngày kết thúc) -> chỉ liệt kê tới kỳ hiện tại
  const stepMonths = { 'Tháng':1, 'Quý':3, '6 Tháng':6, 'Năm':12 };
  if(!stepMonths[thoidiem]){
    // 'Theo hiệu lực CTKM' hoặc để trống -> không có ranh giới kỳ chuẩn để tách, coi cả khoảng là 1 kỳ
    return [{ from: fromISO, to: endISO }];
  }
  const periods = [];
  let cursor = fromISO;
  let guard = 0;
  while(cursor <= endISO && guard < 400){
    const snap = snapPeriodFromDate(cursor, thoidiem);
    if(!snap) break;
    periods.push(snap);
    if(snap.to >= endISO) break;
    const next = new Date(snap.to);
    next.setDate(next.getDate()+1);
    const nextISO = toISO(next);
    if(nextISO <= cursor) break; // phòng vòng lặp vô hạn nếu dữ liệu ngày bất thường
    cursor = nextISO;
    guard++;
  }
  return periods;
}
// Mô tả dễ hiểu cách tính của 1 mã chiết khấu (hoặc 1 bậc điều kiện con của nó nếu có)
function describeCalcBac_(p){
  const ht = HT_OPTIONS.find(o=>o.v===p.ht_chietkhau)?.l || p.ht_chietkhau || '?';
  const muc = p.ht_chietkhau==='DONGIA_CODINH' ? (fmtVND(p.dongia_codinh||0)+'/đơn vị') : fmtPct(p.tl_ck||0);
  const slTxt = (Number(p.sl_min)||Number(p.sl_max)) ? `SL ${fmtNum(p.sl_min||0)}${Number(p.sl_max)?'–'+fmtNum(p.sl_max):'+'}` : '';
  const dtTxt = (Number(p.dt_min)||Number(p.dt_max)) ? `DT ${fmtVND(p.dt_min||0)}${Number(p.dt_max)?'–'+fmtVND(p.dt_max):'+'}` : '';
  const logic = (p.dieukien_sldt==='OR') ? 'HOẶC' : 'VÀ';
  const dkTxt = [slTxt, dtTxt].filter(Boolean).join(` ${logic} `);
  const khTxt = (p.pct_kh_min || p.pct_kh_max) ? ` · %KH ${fmtPct(p.pct_kh_min||0)}–${Number(p.pct_kh_max)?fmtPct(p.pct_kh_max):'∞'}` : '';
  return `${ht} ${muc}${dkTxt?(' khi đạt '+dkTxt):''}${khTxt}`;
}
function describeCalcMethod_(prog, bacList){
  if(!bacList.length) return describeCalcBac_(prog);
  return bacList.map((b,i)=>`Bậc ${i+1}: ${describeCalcBac_(Object.assign({}, prog, b))}`).join('  |  ');
}
// Mô tả cách tính CHIẾT KHẤU LŨY KẾ (chiết khấu bổ sung) — cấu trúc trường khác hẳn mã chiết khấu
// chính (dual_condition dùng 2 điều kiện độc lập cộng dồn; all_or_reduced dùng điều kiện "đủ tháng").
function describeBonusCalc_(lk){
  if((lk.kieu_tinh||'all_or_reduced')==='dual_condition'){
    return `2 điều kiện độc lập, cộng dồn %: ĐK1 mỗi tháng đạt ≥ ${fmtPct(lk.dk1_pct_thang_min||90)} KH tháng → +${fmtPct(lk.dk1_rate||0)}; ĐK2 cả kỳ đạt ≥ ${fmtPct(lk.dk2_pct_ky_min||110)} KH kỳ → +${fmtPct(lk.dk2_rate||0)} (đạt cả 2 thì cộng cả hai)`;
  }
  const thangList = String(lk.thang_luyke||'').split(',').filter(Boolean);
  const reducedTxt = (lk.ck_reduced_pct!=null && lk.ck_reduced_pct!=='' && Number(lk.ck_reduced_pct)!==100)
    ? ` (lỡ 1+ tháng nhưng cả kỳ vẫn đạt bậc riêng thì hưởng giảm còn ${fmtPct(lk.ck_reduced_pct)})` : '';
  return `Đạt chiết khấu chính đủ ${thangList.length||'?'} tháng đã chọn (Tháng ${thangList.join(', ')||'?'}) VÀ đạt bậc riêng SL ${fmtNum(lk.sl_min||0)}${Number(lk.sl_max)?'–'+fmtNum(lk.sl_max):'+'} / DT ${fmtVND(lk.dt_min||0)}${Number(lk.dt_max)?'–'+fmtVND(lk.dt_max):'+'} cả kỳ → +${fmtPct(lk.ck_bosung||0)}${reducedTxt}`;
}
// Xây dựng toàn bộ dữ liệu bảng theo dõi — 1 dòng / (Mã chiết khấu × kỳ) trong suốt hiệu lực.
function buildDiscountTrackingData_(){
  const rows = [];
  // TỐI ƯU: trước đây dùng (DB.reportCKTH||[]).find(...) BÊN TRONG 2 vòng lặp lồng nhau (từng chương
  // trình × từng kỳ) — độ phức tạp O(số chương trình × số kỳ × số dòng REPORT_CKTH), sẽ chậm dần khi
  // REPORT_CKTH phình to theo thời gian (đúng bảng đang được dùng để tính năng này). Nay dựng sẵn 1 Map
  // tra cứu theo khóa (program_id, tu_ngay, den_ngay) DUY NHẤT 1 LẦN — mỗi kỳ tra cứu O(1) thay vì quét
  // lại toàn bộ REPORT_CKTH mỗi lần.
  const ckthMap = new Map();
  const ckthByProgram = new Map(); // dùng riêng cho Chiết khấu lũy kế (xem bên dưới)
  (DB.reportCKTH||[]).forEach(r=>{
    ckthMap.set(String(r.program_id||'')+'||'+String(r.tu_ngay||'')+'||'+String(r.den_ngay||''), r);
    const pid = String(r.program_id||'');
    if(!ckthByProgram.has(pid)) ckthByProgram.set(pid, []);
    ckthByProgram.get(pid).push(r);
  });
  (DB.programs||[]).forEach(prog=>{
    const ct = DB.chuongtrinh.find(c=>c.id===prog.chuongtrinh_id);
    const bacList = (DB.dieukien||[]).filter(d=>d.program_id===prog.id);
    const cachTinh = describeCalcMethod_(prog, bacList);
    const periods = enumeratePeriods_(prog.hieuluctu, prog.hieulucden, prog.thoidiem_ck);
    const base = { chuongtrinh: ct ? ct.ma_chuongtrinh : '(không thuộc chương trình nào)', maCK: prog.ma_chietkhau, progId: prog.id, cachTinh, thoidiem: prog.thoidiem_ck||'' };
    if(!periods.length){
      rows.push(Object.assign({}, base, { tu:'', den:'', daThucHien:false, trangThai:null, soTienCK:null, ghiChu:'Chưa khai Hiệu lực từ ngày — chưa thể xác định kỳ tính' }));
      return;
    }
    periods.forEach(p=>{
      const rec = ckthMap.get(String(prog.id)+'||'+p.from+'||'+p.to);
      rows.push(Object.assign({}, base, {
        tu: p.from, den: p.to,
        daThucHien: !!rec,
        trangThai: rec ? (norm(rec.trangthai)==='DAT' ? 'Đạt' : 'Chưa đạt') : null,
        soTienCK: rec ? Number(rec.so_tien_chietkhau||0) : null
      }));
    });
  });
  // THEO YÊU CẦU: Chiết khấu lũy kế (chiết khấu bổ sung) cũng được lưu vào ĐÚNG REPORT_CKTH/CKCT, chỉ
  // khác là dùng program_id = id của chính chương trình lũy kế đó (khác id chương trình chính), mã hiển
  // thị có hậu tố "_BOSUNG" (xem saveBonusReport()) — nhưng buildDiscountTrackingData_ trước đây CHỈ
  // quét DB.programs nên các bản ghi này không hiện ra dù thực tế đã lưu đủ. Bổ sung quét thêm
  // DB.programsLuyKe ở đây. KHÁC với mã chính: kỳ lũy kế do người dùng TỰ CHỌN Từ ngày-Đến ngày mỗi lần
  // tính (không theo lưới Tháng/Quý/Năm cố định như enumeratePeriods_), nên KHÔNG thể "dự đoán trước"
  // các kỳ sẽ có — chỉ liệt kê đúng những kỳ ĐÃ THỰC SỰ được lưu (nếu chưa lưu lần nào thì hiện 1 dòng
  // nhắc "Chưa lưu báo cáo bổ sung nào" thay vì bỏ trống hoàn toàn, để không bị hiểu nhầm là bỏ sót).
  (DB.programsLuyKe||[]).forEach(lk=>{
    const baseProg = DB.programs.find(p=>p.id===lk.ma_ck_chinh);
    const ct = baseProg ? DB.chuongtrinh.find(c=>c.id===baseProg.chuongtrinh_id) : null;
    const maCK = (baseProg ? baseProg.ma_chietkhau : '?') + '_BOSUNG';
    const cachTinh = describeBonusCalc_(lk);
    const base = { chuongtrinh: ct ? ct.ma_chuongtrinh : '(không thuộc chương trình nào)', maCK, progId: lk.id, cachTinh, thoidiem:'(kỳ tự chọn)' };
    const saved = (ckthByProgram.get(String(lk.id)) || []).sort((a,b)=>String(b.tu_ngay||'').localeCompare(String(a.tu_ngay||'')));
    if(!saved.length){
      rows.push(Object.assign({}, base, { tu: lk.hieuluctu||'', den: lk.hieulucden||'', daThucHien:false, trangThai:null, soTienCK:null, ghiChu:'Chưa lưu báo cáo bổ sung nào — kỳ lũy kế do người dùng tự chọn Từ ngày-Đến ngày, không cố định theo Tháng/Quý' }));
      return;
    }
    saved.forEach(rec=>{
      rows.push(Object.assign({}, base, {
        tu: rec.tu_ngay, den: rec.den_ngay,
        daThucHien: true,
        trangThai: norm(rec.trangthai)==='DAT' ? 'Đạt' : 'Chưa đạt',
        soTienCK: Number(rec.so_tien_chietkhau||0)
      }));
    });
  });
  // Mới nhất lên trước cho dễ theo dõi kỳ hiện tại
  rows.sort((a,b)=> (b.tu||'').localeCompare(a.tu||'') || String(a.chuongtrinh).localeCompare(String(b.chuongtrinh)));
  return rows;
}

function checkDuplicateReports(){
  openModal(`<h3>Đang kiểm tra chiết khấu trùng...</h3><div class="empty"><div class="big">🔍</div>Vui lòng chờ...</div>`);

  // 1) Trùng THÁNG (cùng chương trình + cùng tháng/năm) nhưng khoảng ngày lưu khác nhau
  const monthGroups = {};
  (DB.reportCKTH||[]).forEach(r=>{
    const k = [r.program_id, r.thang_chietkhau, r.nam_chietkhau].join('||');
    if(!monthGroups[k]) monthGroups[k] = [];
    monthGroups[k].push(r);
  });
  const monthConflicts = Object.entries(monthGroups)
    .filter(([k,rows])=>{
      const distinctRanges = new Set(rows.map(r=>r.tu_ngay+'~'+r.den_ngay));
      return distinctRanges.size > 1; // cùng tháng nhưng >1 khoảng ngày khác nhau => nghi trùng
    });

  // 2) Trùng KHÓA CHÍNH XÁC (program_id + tu_ngay + den_ngay) — không nên xảy ra do cơ chế upsert,
  // chỉ có thể do sửa tay trực tiếp trên Google Sheet.
  const exactKeyCount = {};
  (DB.reportCKTH||[]).forEach(r=>{
    const k = [r.program_id, r.tu_ngay, r.den_ngay].join('||');
    exactKeyCount[k] = (exactKeyCount[k]||0) + 1;
  });
  const exactDup = Object.entries(exactKeyCount).filter(([k,c])=>c>1);

  // 3) Trùng ở REPORT_CKCT (chi tiết mặt hàng) — cùng mã hàng, cùng chương trình, khác khoảng ngày
  const ckctMonthGroups = {};
  (DB.reportCKCT||[]).forEach(r=>{
    const dt = r.den_ngay ? new Date(r.den_ngay) : null;
    if(!dt) return;
    const k = [r.program_id, r.mahang, dt.getMonth()+1, dt.getFullYear()].join('||');
    if(!ckctMonthGroups[k]) ckctMonthGroups[k] = [];
    ckctMonthGroups[k].push(r);
  });
  const ckctConflicts = Object.entries(ckctMonthGroups)
    .filter(([k,rows])=>new Set(rows.map(r=>r.tu_ngay+'~'+r.den_ngay)).size > 1);

  const findProgName = (pid) => {
    const p = DB.programs.find(x=>x.id===pid);
    if(p) return p.ma_chietkhau;
    const lk = DB.programsLuyKe.find(x=>x.id===pid);
    if(lk){ const bp = DB.programs.find(x=>x.id===lk.ma_ck_chinh); return (bp?bp.ma_chietkhau:'?')+'_BOSUNG'; }
    return pid;
  };

  const totalIssues = monthConflicts.length + exactDup.length + ckctConflicts.length;
  const dedupPlan = totalIssues>0 ? buildDedupPlan_() : null;

  const monthConflictHtml = monthConflicts.map(([k,rows])=>{
    const [pid, thang, nam] = k.split('||');
    const rowsHtml = rows.map(r=>`<tr><td class="mono">${esc(r.tu_ngay)} → ${esc(r.den_ngay)}</td><td>${norm(r.trangthai)==='DAT'?'<span class="tag tag-ok">Đạt</span>':'<span class="tag tag-no">Chưa đạt</span>'}</td><td class="num mono">${fmtVND(r.so_tien_chietkhau)}</td></tr>`).join('');
    return `<div class="card" style="margin-bottom:10px">
      <div class="card-head"><div><h2 style="font-size:14px">${esc(findProgName(pid))} — Tháng ${thang}/${nam}</h2><div class="hint" style="color:var(--red)">⚠ ${rows.length} dòng khác khoảng ngày cho cùng 1 tháng</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Khoảng ngày đã lưu</th><th>Trạng thái</th><th class="num">Số tiền CK</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    </div>`;
  }).join('');

  const ckctConflictHtml = ckctConflicts.slice(0,20).map(([k])=>{
    const [pid, mahang, thang, nam] = k.split('||');
    return `<tr><td class="mono">${esc(findProgName(pid))}</td><td class="mono">${esc(mahang)}</td><td>Tháng ${thang}/${nam}</td></tr>`;
  }).join('');

  openModal(`
    <h3>Kết quả kiểm tra chiết khấu trùng</h3>
    ${totalIssues===0
      ? `<div class="section-note" style="border-color:var(--emerald);color:var(--emerald-dark)">✓ Không phát hiện dòng nào bị trùng/xung đột. Toàn bộ ${(DB.reportCKTH||[]).length} dòng tổng hợp và ${(DB.reportCKCT||[]).length} dòng chi tiết đều nhất quán theo tháng.</div>`
      : `<div class="section-note" style="border-color:var(--red);color:var(--red)">⚠ Phát hiện ${totalIssues} vấn đề — xem chi tiết bên dưới. Nguyên nhân thường gặp: lưu thủ công và "Tự động tính & lưu" dùng 2 khoảng Từ ngày–Đến ngày khác nhau cho cùng 1 tháng.</div>`}

    ${exactDup.length ? `<div class="field"><label style="color:var(--red)">⚠ Trùng khóa chính xác (bất thường, cần kiểm tra thủ công trên Sheet)</label>
      <div class="mono" style="font-size:12px;padding:8px;background:#fff1f1;border-radius:6px">${exactDup.map(([k,c])=>`${esc(k)} — lặp ${c} lần`).join('<br>')}</div>
    </div>` : ''}

    ${monthConflicts.length ? `<div class="field"><label>Trùng tháng — khác khoảng ngày (REPORT_CKTH)</label>${monthConflictHtml}</div>` : ''}

    ${ckctConflicts.length ? `<div class="field"><label>Trùng mặt hàng theo tháng — khác khoảng ngày (REPORT_CKCT, hiện tối đa 20 dòng đầu)</label>
      <div class="table-wrap"><table><thead><tr><th>Chương trình</th><th>Mã hàng</th><th>Tháng</th></tr></thead><tbody>${ckctConflictHtml}</tbody></table></div>
      ${ckctConflicts.length>20?`<div class="hint">...còn ${ckctConflicts.length-20} dòng khác</div>`:''}
    </div>` : ''}

    ${totalIssues>0 ? `<div class="section-note">
      <b>Dọn dẹp tự động:</b> sẽ giữ lại đúng 1 khoảng ngày hợp lệ nhất cho mỗi tháng bị trùng (ưu tiên khoảng khớp đúng ranh giới kỳ chuẩn Tháng/Quý/6 Tháng/Năm), xoá các dòng còn lại — dự kiến xoá <b>${dedupPlan.removedCkth}</b> dòng CKTH và <b>${dedupPlan.removedCkct}</b> dòng CKCT. Không thể hoàn tác, nên bấm "Làm mới dữ liệu" trước để chắc chắn đang xem đúng dữ liệu mới nhất.
    </div>
    <div class="btn-row" style="justify-content:flex-end;margin-top:6px"><button class="btn btn-danger" onclick="applyDedupPlan_()">🧹 Dọn dẹp trùng lặp tự động</button></div>` : ''}
    <div class="btn-row" style="justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" onclick="closeModal()">Đóng</button></div>
  `);
}

// THEO YÊU CẦU: bảng mô tả chiết khấu theo Từ ngày–Đến ngày, theo từng Chương trình/Mã chiết khấu, cho

function renderDiscountTrackingBody_(){
  const all = buildDiscountTrackingData_();
  const f = UI._trackingFilter;
  const rows = all.filter(r=>{
    if(f.chuongtrinh && r.progId!==f.chuongtrinh) return false;
    if(f.trangthai==='chua') return !r.daThucHien;
    if(f.trangthai==='dat') return r.daThucHien && r.trangThai==='Đạt';
    if(f.trangthai==='chuadat') return r.daThucHien && r.trangThai==='Chưa đạt';
    return true;
  });
  UI._trackingRowsCache = all; // dùng lại cho xuất Excel (xuất theo bộ lọc hiện tại)
  // Lấy danh sách mã để lọc từ chính dữ liệu đã build (all) — tự động bao gồm cả mã lũy kế (_BOSUNG),
  // không chỉ Mã chiết khấu chính như trước.
  const seenProg = new Map();
  all.forEach(r=>{ if(!seenProg.has(r.progId)) seenProg.set(r.progId, r.maCK); });
  const progOptions = [...seenProg.entries()].map(([id,ma])=>`<option value="${esc(id)}" ${f.chuongtrinh===id?'selected':''}>${esc(ma)}</option>`).join('');
  const doneCount = all.filter(r=>r.daThucHien).length;
  const rowsHtml = rows.map(r=>`
    <tr>
      <td>${esc(r.chuongtrinh)}</td>
      <td class="mono">${esc(r.maCK)}</td>
      <td class="mono">${r.tu?fmtDate(r.tu):'—'}</td>
      <td class="mono">${r.den?fmtDate(r.den):'—'}</td>
      <td>${r.daThucHien ? `<span class="tag ${r.trangThai==='Đạt'?'tag-ok':'tag-no'}">✓ Đã thực hiện — ${esc(r.trangThai)}</span>` : `<span class="tag">Chưa thực hiện</span>`}</td>
      <td class="num mono">${r.soTienCK!=null?fmtVND(r.soTienCK):'—'}</td>
      <td style="font-size:11.5px;color:var(--slate-500)">${esc(r.ghiChu||r.cachTinh)}</td>
    </tr>`).join('');
  return `
    <div class="btn-row" style="margin-bottom:10px">
      <select id="trkFilterCT" onchange="UI._trackingFilter.chuongtrinh=this.value;refreshDiscountTrackingTable_()" style="min-width:200px">
        <option value="">Tất cả mã chiết khấu</option>${progOptions}
      </select>
      <select id="trkFilterTT" onchange="UI._trackingFilter.trangthai=this.value;refreshDiscountTrackingTable_()" style="min-width:160px">
        <option value="">Tất cả trạng thái</option>
        <option value="chua" ${f.trangthai==='chua'?'selected':''}>Chưa thực hiện</option>
        <option value="dat" ${f.trangthai==='dat'?'selected':''}>Đã thực hiện — Đạt</option>
        <option value="chuadat" ${f.trangthai==='chuadat'?'selected':''}>Đã thực hiện — Chưa đạt</option>
      </select>
      <button class="btn" onclick="exportDiscountTrackingXlsx()">${ICON.download||''} Xuất Excel</button>
    </div>
    <div class="hint" style="margin-bottom:8px">${all.length} kỳ trong tổng số ${(DB.programs||[]).length} mã chiết khấu · ${doneCount} kỳ đã thực hiện · ${all.length-doneCount} kỳ chưa thực hiện${f.chuongtrinh||f.trangthai?` · đang lọc: ${rows.length} kỳ`:''}</div>
    <div class="table-wrap" style="max-height:60vh;overflow:auto">
      <table>
        <thead><tr><th>Chương trình</th><th>Mã chiết khấu</th><th>Từ ngày</th><th>Đến ngày</th><th>Trạng thái</th><th class="num">Số tiền CK</th><th>Cách tính</th></tr></thead>
        <tbody>${rowsHtml || '<tr><td colspan="7" class="empty">Không có kỳ nào khớp bộ lọc.</td></tr>'}</tbody>
      </table>
    </div>`;
}

function exportDiscountTrackingXlsx(){
  const f = UI._trackingFilter;
  const all = UI._trackingRowsCache || buildDiscountTrackingData_();
  const rows = all.filter(r=>{
    if(f.chuongtrinh && r.progId!==f.chuongtrinh) return false;
    if(f.trangthai==='chua') return !r.daThucHien;
    if(f.trangthai==='dat') return r.daThucHien && r.trangThai==='Đạt';

    'Cách tính': r.ghiChu || r.cachTinh
  }));
  const wb = XLSX.utils.book_new();

  downloadWb(wb, 'BangTheoDoiChietKhau_export.xlsx');

}

function getFilteredCKCT(){
  const bf = UI._baocaoFilters;
  return (DB.reportCKCT||[]).filter(r=>{
    if(bf.from && r.tu_ngay < bf.from) return false;
    if(bf.to && r.den_ngay > bf.to) return false;
    if(bf.ht && r.hinh_thuc_chietkhau!==bf.ht) return false;
    if(bf.machietkhau && r.ma_chietkhau!==bf.machietkhau) return false;
    if(bf.supplier && !ckctMatchesSupplier(r, bf.supplier)) return false;
    return true;
  });
}

  const bf = UI._baocaoFilters;

function renderBaoCaoSkuView(rows){
  const totalTC = rows.reduce((s,r)=>s+(Number(r.chiet_khau)||0),0);
  const bf = UI._baocaoFilters;
  // THEO YÊU CẦU: Tổng doanh thu mua phải khớp đúng tập MÃ HÀNG đang có trong báo cáo chiết khấu này
  // (rows) — gộp theo mahang (không trùng lặp) trước khi cộng, vì 1 mã hàng có thể xuất hiện ở nhiều
  // dòng (nhiều mã chiết khấu/kỳ) trong REPORT_CKCT đã lưu.
  const skuRevenueMap = {};
  rows.forEach(r=>{
    const k = norm(r.mahang);
    if(!k) return;
    if(!(k in skuRevenueMap)) skuRevenueMap[k] = Number(r.doanhso)||0;
  });
  const totalDT = Object.values(skuRevenueMap).reduce((s,v)=>s+v,0);
  const rowsHtml = rows.slice(0,500).map(r=>`<tr>
    <td>${fmtDate(r.ngay_tinh)}</td><td class="mono">${esc(r.ma_chietkhau)}</td>
    <td class="mono">${esc(r.mahang)}</td><td>${esc(r.tenhang)}</td>
    <td class="num mono">${fmtNum(r.sanluong)}</td><td class="num mono">${fmtVND(r.doanhso)}</td>
    <td class="num mono">${r.gia_mua_bq?fmtVND(r.gia_mua_bq):'—'}</td>
    <td class="num mono">${r.gia_congbo_bq?fmtVND(r.gia_congbo_bq):'—'}</td>
    <td>${esc(r.hinh_thuc_chietkhau||'')}</td>
    <td class="num mono" style="color:var(--emerald-dark);font-weight:600">${fmtVND(r.chiet_khau)}</td>
  </tr>`).join('');
  document.getElementById('baocaoResultWrap').innerHTML = `
    <div class="grid grid-4">
      <div class="kpi"><div class="lbl">Số dòng</div><div class="val">${fmtNum(rows.length)}</div></div>
      <div class="kpi accent-emerald"><div class="lbl">Tổng doanh thu mua</div><div class="val mono" style="font-size:18px">${fmtVND(totalDT)}</div><div class="sub">${fmtDate(bf.from)} → ${fmtDate(bf.to)}</div></div>
      <div class="kpi accent-gold"><div class="lbl">Tổng tiền chiết khấu</div><div class="val mono" style="font-size:18px">${fmtVND(totalTC)}</div><div class="sub">${totalDT?fmtPct(totalTC/totalDT*100):''} trên doanh thu</div></div>
      <div class="kpi"><div class="lbl">Xuất dữ liệu</div><div class="val"><button class="btn btn-primary btn-sm" onclick="exportBaoCaoSkuXlsx()">${ICON.download} Xuất Excel</button></div></div>
    </div>
    <div class="card">
      ${rows.length? `<div class="table-wrap"><table>
        <thead><tr><th>Ngày tính</th><th>Mã CK</th><th>Mã hàng</th><th>Tên hàng</th><th class="num">SL</th><th class="num">Doanh số</th><th class="num">Giá mua BQ</th><th class="num">Giá công bố BQ</th><th>Hình thức CK</th><th class="num">Tiền CK</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>` : `<div class="empty">Không có dữ liệu khớp bộ lọc (kiểm tra đã "Lưu báo cáo" ở tab Tính chiết khấu chưa).</div>`}
    </div>
  `;
}
function exportBaoCaoSkuXlsx(){
  const rows = getFilteredCKCT();
  const out = rows.map(r=>({
    'Ngày tính': r.ngay_tinh, 'Mã chiết khấu': r.ma_chietkhau, 'Mã hàng': r.mahang, 'Tên hàng': r.tenhang,
    'Sản lượng': r.sanluong, 'Doanh số': r.doanhso, 'Giá mua BQ': r.gia_mua_bq, 'Giá công bố BQ': r.gia_congbo_bq,
    'Hình thức chiết khấu': r.hinh_thuc_chietkhau, 'Tiền chiết khấu': r.chiet_khau

  rows.forEach(r=>{

    const g = groups[k];
    g.sl += Number(r.sanluong)||0; g.dt += Number(r.doanhso)||0; g.tienck += Number(r.chiet_khau)||0;

function getAdjacentPeriods(refYear, refMonth){
  const thang = { key:'thang', label:`Tháng ${refMonth}/${refYear}`, from: toISO(new Date(refYear, refMonth-1, 1)), to: toISO(new Date(refYear, refMonth, 0)) };
  const q = Math.floor((refMonth-1)/3);
  let qy = refYear, qi = q-1;
  if(qi<0){ qi=3; qy=refYear-1; }
  const quy = { key:'quy', label:`Quý ${qi+1}/${qy} (liền kề)`, from: toISO(new Date(qy, qi*3, 1)), to: toISO(new Date(qy, qi*3+3, 0)) };
  const half = refMonth<=6 ? 0 : 1;
  let hy = refYear, hi = half-1;
  if(hi<0){ hi=1; hy=refYear-1; }
  const halfLabel = (hi===0 ? `6 tháng đầu năm ${hy} (liền kề)` : `6 tháng cuối năm ${hy} (liền kề)`);
  const sixT = { key:'sixT', label: halfLabel, from: toISO(new Date(hy, hi*6, 1)), to: toISO(new Date(hy, hi*6+6, 0)) };
  const nam = { key:'nam', label:`Năm ${refYear-1} (liền kề)`, from: toISO(new Date(refYear-1,0,1)), to: toISO(new Date(refYear-1,11,31)) };
  return [thang, quy, sixT, nam];
}
function periodBlockHtml(period){
  const recs = (DB.reportCKTH||[]).filter(r=> r.tu_ngay===period.from && r.den_ngay===period.to);
  const total = recs.reduce((s,r)=>s+(Number(r.so_tien_chietkhau)||0),0);
  const rowsHtml = recs.map(r=>`<tr>

    <td class="num mono" style="color:var(--emerald-dark)">${fmtVND(r.so_tien_chietkhau)}</td>
  </tr>`).join('');
  return `
    <div class="card">
      <div class="card-head"><div><h2>${esc(period.label)}</h2><div class="hint">${fmtDate(period.from)} → ${fmtDate(period.to)}</div></div></div>
      ${recs.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Mã chiết khấu</th><th>Trạng thái</th><th class="num">Tiền CK</th></tr></thead>

      </table></div>` : `<div class="empty">Chưa có báo cáo nào được lưu khớp đúng kỳ này (Từ ${fmtDate(period.from)} đến ${fmtDate(period.to)}).</div>`}
    </div>
  `;
}

function defaultQuarterRange(){
  const now = new Date();
  const q = Math.floor(now.getMonth()/3);
  const from = new Date(now.getFullYear(), q*3, 1);
  const to = new Date(now.getFullYear(), q*3+3, 0);
  return { from: toISO(from), to: toISO(to) };
}
// Quy đổi 1 ngày bất kỳ về ranh giới đầu-cuối của kỳ tương ứng (Tháng/Quý/6 Tháng/Năm)
function snapPeriodFromDate(baseDateISO, thoidiem){
  const d = new Date(baseDateISO);
  if(isNaN(d)) return null;
  const y = d.getFullYear();
  if(thoidiem==='Tháng'){
    const m = d.getMonth();
    return { from: toISO(new Date(y,m,1)), to: toISO(new Date(y,m+1,0)) };
  }
  if(thoidiem==='Quý'){
    const q = Math.floor(d.getMonth()/3);
    return { from: toISO(new Date(y,q*3,1)), to: toISO(new Date(y,q*3+3,0)) };
  }
  if(thoidiem==='6 Tháng'){
    const half = d.getMonth() < 6 ? 0 : 1;
    return { from: toISO(new Date(y,half*6,1)), to: toISO(new Date(y,half*6+6,0)) };
  }
  if(thoidiem==='Năm'){
    return { from: toISO(new Date(y,0,1)), to: toISO(new Date(y,11,31)) };
  }
  return null; // '' hoặc 'Theo hiệu lực CTKM' -> không tự quy đổi, giữ nguyên ngày đã nhập
}

  if(!UI.reportResult) return null;
  const { rows, thoidiem, supplier } = UI.reportResult;
  let { from, to } = UI.reportResult;
  // SỬA LỖI (chống trùng báo cáo do lệch khoảng ngày): trước đây "Lưu báo cáo" thủ công ở đây LUÔN
  // dùng đúng Từ ngày/Đến ngày người dùng đã chọn trên UI tại thời điểm bấm "Tính chiết khấu" — nếu vì
  // lý do nào đó (gõ tay, dán giá trị, hoặc chọn "Tùy chọn" rồi quên gõ đúng ranh giới) khoảng ngày đó
  // KHÔNG khớp chính xác với ranh giới kỳ chuẩn (VD 01/07–30/07 thay vì 01/07–31/07), thì khi
  // "Tự động tính & lưu"/"Tính chiết khấu bổ sung" sau đó tự tính lại đúng CÙNG tháng này bằng ranh
  // giới chuẩn (luôn là mùng 1 -> ngày cuối tháng, xem autoComputeAndSaveMonthsForLuyKe_), khóa chống
  // trùng (program_id, tu_ngay, den_ngay) sẽ KHÔNG khớp -> sinh thêm 1 dòng báo cáo trùng lặp cho cùng
  // 1 tháng thay vì ghi đè đúng 1 dòng duy nhất. Nay: nếu "Thời điểm chiết khấu" là 1 trong 4 kỳ chuẩn
  // (Tháng/Quý/6 Tháng/Năm), LUÔN tự chuẩn hoá lại Từ ngày/Đến ngày về đúng ranh giới kỳ đó (dùng lại
  // đúng hàm snapPeriodFromDate() đã có sẵn) ngay trước khi lưu — đảm bảo mọi đường lưu (thủ công hay
  // tự động) cho cùng 1 kỳ luôn ra đúng 1 cặp tu_ngay/den_ngay giống hệt nhau. Với "Tùy chọn" hoặc
  // "Theo hiệu lực CTKM" (không có ranh giới kỳ chuẩn để đối chiếu), giữ nguyên khoảng ngày người dùng
  // đã chọn như trước — đây vốn là lựa chọn có chủ đích của người dùng, không có gì để "chuẩn hoá".
  const snap = snapPeriodFromDate(from, thoidiem);
  if(snap && (snap.from !== from || snap.to !== to)){
    toast(`Đã tự động chuẩn hoá khoảng ngày về đúng ranh giới kỳ: ${fmtDate(snap.from)} → ${fmtDate(snap.to)}`, 'ok');
    from = snap.from; to = snap.to;
  }
  const den = to;
  const dDate = new Date(den);
  const thangCK = dDate.getMonth()+1;
  const namCK = dDate.getFullYear();
  const ckth = [], ckct = [];
  rows.forEach(r=>{
    if(!r.program) return; // chỉ lưu các dòng gắn với 1 chương trình cụ thể (bỏ qua "chưa gắn nhóm"/"chưa có CT")
    const pctHtSl = (r.program.sl_max && Number(r.program.sl_max)>0) ? (r.sl/Number(r.program.sl_max)*100) : null;
    ckth.push({
      program_id: r.program.id, // khóa an toàn tuyệt đối (Mã chiết khấu chỉ để hiển thị/tra cứu)
      ma_chietkhau: r.program.ma_chietkhau, nhom_chietkhau: r.label,
      ngay_tinh: den, thoidiem_chietkhau: thoidiem || r.program.thoidiem_ck || '',
      tu_ngay: from, den_ngay: to, nhacungcap: supplier || '',
      pct_ht_kh_dt: r.hoanthanh!=null ? Number(r.hoanthanh.toFixed(2)) : '',
      pct_ht_kh_sl: pctHtSl!=null ? Number(pctHtSl.toFixed(2)) : '',
      hinh_thuc_chietkhau: r.htChietkhau || '',
      chiet_khau: r.program.tl_ck || '', so_tien_chietkhau: r.tienck,
      thang_chietkhau: thangCK, nam_chietkhau: namCK,
      trangthai: r.dat ? 'DAT' : 'CHUA_DAT'
    });
    (r.skuDetails||[]).forEach(s=>{
      ckct.push({
        program_id: r.program.id,
        ma_chietkhau: r.program.ma_chietkhau, nhom_chietkhau: r.label,
        ngay_tinh: den, thoidiem_chietkhau: thoidiem || r.program.thoidiem_ck || '',
        tu_ngay: from, den_ngay: to, nhacungcap: supplier || '',
        pct_ht_kh_dt: r.hoanthanh!=null ? Number(r.hoanthanh.toFixed(2)) : '',
        pct_ht_kh_sl: pctHtSl!=null ? Number(pctHtSl.toFixed(2)) : '',
        hinh_thuc_chietkhau: r.htChietkhau || '',
        mahang: s.mahang, tenhang: s.tenhang, sanluong: s.sl, doanhso: s.dt,
        gia_mua_bq: s.giaMuaTB ? Math.round(s.giaMuaTB) : '',
        gia_congbo_bq: s.giaCongBoTB ? Math.round(s.giaCongBoTB) : '',
        chiet_khau: s.tienck
      });
    });
  });
  return { ckth, ckct };
}

// THEO GÓP Ý: tự động tính + lưu báo cáo (REPORT_CKTH/CT) LẦN LƯỢT cho từng tháng đã tick chọn ở khung
// Chiết khấu bổ sung — tránh phải quay lại khung "Tính chiết khấu" ở trên, tự chọn lại Từ/Đến ngày và
// bấm Lưu thủ công cho từng tháng một. Chỉ tính riêng cho đúng chương trình chính đã liên kết.
// TỐI ƯU: phần lõi (tính từng tháng bằng computeReport() rồi lưu qua saveReportToSheet()) được tách
// riêng thành autoComputeAndSaveMonthsForLuyKe_() để dùng chung cho cả 2 nút "Tự động tính & lưu" và
// "Tính chiết khấu bổ sung" — đảm bảo cả 2 nơi luôn tính theo đúng 1 công thức, không lặp code.
async function autoComputeAndSaveMonthsForLuyKe_(baseProg, thangList, thoidiem, year, onProgress){
  let savedCount = 0, skippedCount = 0;
  for(const m of thangList){
    if(onProgress) onProgress(m, year);
    const monthStart = toISO(new Date(year, m-1, 1));
    const monthEnd = toISO(new Date(year, m, 0));
    const rows = computeReport(monthStart, monthEnd, '', false, baseProg.id, thoidiem);
    const progRow = rows.find(r=>r.program && r.program.id===baseProg.id);
    if(!progRow){ skippedCount++; continue; }
    const pctHtSl = (progRow.program.sl_max && Number(progRow.program.sl_max)>0) ? (progRow.sl/Number(progRow.program.sl_max)*100) : null;
    const ckth = [{
      program_id: baseProg.id, ma_chietkhau: baseProg.ma_chietkhau, nhom_chietkhau: progRow.label,
      ngay_tinh: monthEnd, thoidiem_chietkhau: thoidiem || baseProg.thoidiem_ck || '',
      tu_ngay: monthStart, den_ngay: monthEnd, nhacungcap: '',
      pct_ht_kh_dt: progRow.hoanthanh!=null ? Number(progRow.hoanthanh.toFixed(2)) : '',
      pct_ht_kh_sl: pctHtSl!=null ? Number(pctHtSl.toFixed(2)) : '',
      hinh_thuc_chietkhau: progRow.htChietkhau || '',
      chiet_khau: (progRow.program.tl_ck || progRow.program.dongia_codinh) || '', so_tien_chietkhau: progRow.tienck,
      thang_chietkhau: m, nam_chietkhau: year,
      trangthai: progRow.dat ? 'DAT' : 'CHUA_DAT'
    }];
    const ckct = (progRow.skuDetails||[]).map(s=>({
      program_id: baseProg.id, ma_chietkhau: baseProg.ma_chietkhau, nhom_chietkhau: progRow.label,
      ngay_tinh: monthEnd, thoidiem_chietkhau: thoidiem || baseProg.thoidiem_ck || '',
      tu_ngay: monthStart, den_ngay: monthEnd, nhacungcap: '',
      pct_ht_kh_dt: progRow.hoanthanh!=null ? Number(progRow.hoanthanh.toFixed(2)) : '',
      pct_ht_kh_sl: pctHtSl!=null ? Number(pctHtSl.toFixed(2)) : '',
      hinh_thuc_chietkhau: progRow.htChietkhau || '',
      mahang: s.mahang, tenhang: s.tenhang, sanluong: s.sl, doanhso: s.dt,
      gia_mua_bq: s.giaMuaTB ? Math.round(s.giaMuaTB) : '',
      gia_congbo_bq: s.giaCongBoTB ? Math.round(s.giaCongBoTB) : '',
      chiet_khau: s.tienck
    }));
    await saveReportToSheet(ckth, ckct);
    savedCount++;
  }
  return { savedCount, skippedCount };
}
// ===== DRAFT (NHÁP) TẠM THỜI CHO BƯỚC "TÍNH CHIẾT KHẤU BỔ SUNG" =====
// THEO YÊU CẦU: trước đây "Tính chiết khấu bổ sung" gọi autoComputeAndSaveMonthsForLuyKe_() — hàm này
// GHI THẲNG lên Google Sheet (REPORT_CKTH/REPORT_CKCT) mỗi lần bấm, dù người dùng chỉ đang muốn XEM THỬ
// kết quả chứ chưa chắc muốn lưu gì. Nay tách riêng: bước kiểm tra ĐẠT/CHƯA ĐẠT từng tháng khi tính bổ
// sung chỉ tính lại rồi lưu vào 1 DRAFT (mảng tạm trong bộ nhớ trình duyệt, KHÔNG gửi lên Sheet), dùng
// draft đó để đối chiếu — xong việc là XOÁ NGAY (xem cuối runBonusCalc), không để lại dấu vết gì trên
// Sheet. Báo cáo THÁNG CHÍNH THỨC trên Sheet chỉ thay đổi khi người dùng chủ động bấm nút riêng "Tự
// động tính & lưu cho các tháng đã chọn" (autoRunAndSaveMonthsForLuyKe, vẫn dùng hàm SAVE thật như cũ)
// hoặc "Lưu báo cáo bổ sung" (saveBonusReport, lưu khoản CK bổ sung — khác với báo cáo tháng).
let DRAFT_REPORT_CKTH_ = [];
async function autoComputeMonthsDraft_(baseProg, thangList, thoidiem, year, onProgress){
  // Xoá phần draft cũ (nếu có) của đúng chương trình + thời điểm + năm + các tháng sắp tính lại, tránh
  // lẫn dữ liệu nháp từ lượt tính trước đó (VD người dùng đổi khoảng ngày rồi bấm tính lại).
  DRAFT_REPORT_CKTH_ = DRAFT_REPORT_CKTH_.filter(r => !(
    String(r.program_id) === String(baseProg.id) &&
    String(r.thoidiem_chietkhau || '') === String(thoidiem || '') &&
    Number(r.nam_chietkhau) === year &&
    thangList.includes(Number(r.thang_chietkhau))
  ));
  let computedCount = 0, skippedCount = 0;
  for (const m of thangList) {
    if (onProgress) onProgress(m, year);
    const monthStart = toISO(new Date(year, m - 1, 1));
    const monthEnd = toISO(new Date(year, m, 0));
    const rows = computeReport(monthStart, monthEnd, '', false, baseProg.id, thoidiem);
    const progRow = rows.find(r => r.program && r.program.id === baseProg.id);
    if (!progRow) { skippedCount++; continue; }
    const pctHtSl = (progRow.program.sl_max && Number(progRow.program.sl_max) > 0) ? (progRow.sl / Number(progRow.program.sl_max) * 100) : null;
    DRAFT_REPORT_CKTH_.push({
      program_id: baseProg.id, ma_chietkhau: baseProg.ma_chietkhau, nhom_chietkhau: progRow.label,
      ngay_tinh: monthEnd, thoidiem_chietkhau: thoidiem || baseProg.thoidiem_ck || '',
      tu_ngay: monthStart, den_ngay: monthEnd, nhacungcap: '',
      pct_ht_kh_dt: progRow.hoanthanh != null ? Number(progRow.hoanthanh.toFixed(2)) : '',
      pct_ht_kh_sl: pctHtSl != null ? Number(pctHtSl.toFixed(2)) : '',
      hinh_thuc_chietkhau: progRow.htChietkhau || '',
      chiet_khau: (progRow.program.tl_ck || progRow.program.dongia_codinh) || '', so_tien_chietkhau: progRow.tienck,
      thang_chietkhau: m, nam_chietkhau: year,
      trangthai: progRow.dat ? 'DAT' : 'CHUA_DAT'
    });
    computedCount++;
  }
  return { computedCount, skippedCount };
}
// Tra cứu báo cáo 1 tháng: ưu tiên DRAFT (vừa tính lại trong phiên hiện tại, luôn mới nhất) trước, nếu
// tháng đó không có trong draft (VD chưa từng bấm "Tính chiết khấu bổ sung" trong phiên này) thì mới
// rơi về báo cáo CHÍNH THỨC đã lưu trên Sheet (DB.reportCKTH, VD đã lưu từ trước qua nút "Tự động tính
// & lưu"). Dùng chung cho computeBonusDiscount() và computeDualConditionBonus() bên dưới.
function findMonthReport_(programId, thoidiemCk, thang, year){
  const draftHit = DRAFT_REPORT_CKTH_.find(r =>
    String(r.program_id || '') === String(programId) &&
    String(r.thoidiem_chietkhau || '') === String(thoidiemCk || '') &&
    Number(r.thang_chietkhau) === thang && Number(r.nam_chietkhau) === year
  );
  if (draftHit) return draftHit;
  return (DB.reportCKTH || []).find(r =>
    String(r.program_id || '') === String(programId) &&
    String(r.thoidiem_chietkhau || '') === String(thoidiemCk || '') &&
    Number(r.thang_chietkhau) === thang && Number(r.nam_chietkhau) === year
  );
}
async function autoRunAndSaveMonthsForLuyKe(){

  const thoidiem = document.getElementById('bn_thoidiem').value;

  if(!thangCsv){ toast('Chương trình lũy kế này chưa cấu hình tháng — vào sửa lại ở tab "Chiết khấu lũy kế"','err'); return; }
  const baseProg = DB.programs.find(p=>p.id===lk.ma_ck_chinh);
  if(!baseProg){ toast('Không tìm thấy chương trình chiết khấu chính đã liên kết','err'); return; }

  const year = bnTo ? new Date(bnTo).getFullYear() : new Date().getFullYear();

      baseProg, thangList, thoidiem, year,
      (m,y) => { if(btn) btn.innerHTML = `Đang xử lý tháng ${m}/${y}...`; }
    );
    toast(`Đã tự động tính & lưu ${savedCount} tháng${skippedCount?` (bỏ qua ${skippedCount} tháng không có dữ liệu mua hàng)`:''}`, 'ok');
  }catch(err){
    toast('Lỗi khi tự động tính & lưu: ' + (err.message||err), 'err');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.upload} Tự động tính & lưu cho các tháng đã chọn`; }

}
