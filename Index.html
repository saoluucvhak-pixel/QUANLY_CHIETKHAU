function computeBonusDiscount(lk, thangList, thoidiemCk, fromDate, toDate){
  const baseProg = DB.programs.find(p=>p.id===lk.ma_ck_chinh);
  if(!baseProg) return { ok:false, error:'Không tìm thấy chương trình chiết khấu chính đã liên kết' };
  if((lk.kieu_tinh||'all_or_reduced')==='dual_condition'){
    return computeDualConditionBonus(lk, baseProg, thangList, thoidiemCk, fromDate, toDate);
  }

  // BƯỚC 1: đối chiếu từng tháng lũy kế với dữ liệu ĐÃ LƯU ở REPORT_CKTH (không tính lại từ đầu)
  const year = new Date(fromDate).getFullYear();
  const monthChecks = thangList.map(m=>{
    const monthStart = toISO(new Date(year, m-1, 1));
    const monthEnd = toISO(new Date(year, m, 0));
    const inRange = monthStart <= toDate && monthEnd >= fromDate;
    if(!inRange) return { thang:m, status:'NGOAI_KHOANG', dat:false, note:'Ngoài khoảng Từ ngày - Đến ngày đã chọn' };
    const rec = findMonthReport_(baseProg.id, thoidiemCk, m, year);
    if(!rec) return { thang:m, status:'CHUA_LUU', dat:false, note:'Chưa có báo cáo đã lưu cho tháng này' };
    const dat = norm(rec.trangthai)==='DAT';
    return { thang:m, status: dat?'DAT':'CHUA_DAT', dat, note: dat?'Đạt':'Chưa đạt bậc', record:rec };
  });
  const allMonthsOk = monthChecks.length>0 && monthChecks.every(m=>m.dat);
  const monthsFailedCount = monthChecks.filter(m=>!m.dat).length;

  // BƯỚC 2: kiểm tra bậc RIÊNG của chương trình lũy kế (SL/DT/%KH) trên toàn kỳ đã chọn
  const syntheticProg = {
    dim_thuonghieu: baseProg.dim_thuonghieu, dim_nhomkh: baseProg.dim_nhomkh,
    dim_loaisp: baseProg.dim_loaisp, dim_dactinh: baseProg.dim_dactinh,
    dim_congdung: baseProg.dim_congdung, dim_quycach: baseProg.dim_quycach,
    sl_min: lk.sl_min, sl_max: lk.sl_max, dt_min: lk.dt_min, dt_max: lk.dt_max,
    dieukien_sldt: 'AND',
    dt_kehoach: lk.dt_kehoach, pct_kh_min: lk.pct_kh_min, pct_kh_max: lk.pct_kh_max,
    hieuluctu: lk.hieuluctu, hieulucden: lk.hieulucden
  };
  const ownChk = evaluateProgramForPeriod(syntheticProg, fromDate, toDate, '');
  // SỬA/BỔ SUNG THEO CHÍNH SÁCH THỰC TẾ: trước đây chỉ có 2 kết quả — ĐẠT ĐỦ (trả 100% ck_bosung) hoặc
  // KHÔNG ĐẠT (trả 0đ) khi có bất kỳ tháng nào lỡ. Nay có thêm mức GIẢM TRỪ: nếu tổng kỳ vẫn đạt kế
  // hoạch (ownChk.dat=true) nhưng có 1+ tháng không đạt, trả theo % giảm trừ đã cấu hình (ck_reduced_pct,
  // mặc định 100 = không giảm nếu không cấu hình gì khác — giữ đúng hành vi cũ cho các CT chưa cập nhật).
  const finalDat = ownChk.dat; // đạt tổng kỳ là điều kiện BẮT BUỘC để được hưởng bất kỳ mức nào
  const isReduced = finalDat && !allMonthsOk;
  const reducedPct = (lk.ck_reduced_pct==null || lk.ck_reduced_pct==='') ? 100 : Number(lk.ck_reduced_pct);
  const effectiveRatePct = !finalDat ? 0 : (isReduced ? Number(lk.ck_bosung||0)*reducedPct/100 : Number(lk.ck_bosung||0));

  let skuDetails = [], tienck = 0;
  const rate = effectiveRatePct/100;
  if(finalDat && rate>0){
    let baseSkus = ownChk.matchingSkus || [];
    if(lk.ma_doanhthu_tinhck){
      const tinhCkDims = doanhThuDims_(lk.ma_doanhthu_tinhck);
      if(tinhCkDims) baseSkus = baseSkus.filter(s=>dimsMatch(s.dims, tinhCkDims));
    }
    skuDetails = baseSkus.map(s=>({
      mahang: s.mahang, tenhang: s.tenhang, sl: s.sl, dt: s.dt, tienck: s.dt*rate
    })).sort((a,b)=>b.tienck-a.tienck);
    tienck = skuDetails.reduce((a,x)=>a+x.tienck,0);
  }
  return { ok:true, kieu_tinh:'all_or_reduced', finalDat, allMonthsOk, isReduced, monthsFailedCount, effectiveRatePct, monthChecks, ownChk, baseProg, lk, rate, tienck, skuDetails };
}

// THEO CHÍNH SÁCH "Chiết khấu thêm cho NPP/ĐL" (2 điều kiện độc lập, cộng dồn %):
// Điều kiện 1: TẤT CẢ các tháng trong kỳ đạt tối thiểu X% kế hoạch THÁNG đó (dùng đúng % đã lưu sẵn
// trong REPORT_CKTH — pct_ht_kh_dt — không cần tính lại).
// Điều kiện 2: CẢ KỲ đạt tối thiểu Y% kế hoạch CẢ KỲ (dt_kehoach của chính CT lũy kế).
// Đạt 1 trong 2 điều kiện -> cộng đúng % của điều kiện đó; đạt cả 2 -> cộng cả hai (không phải chọn max).
function computeDualConditionBonus(lk, baseProg, thangList, thoidiemCk, fromDate, toDate){
  const year = new Date(fromDate).getFullYear();
  const monthChecks = thangList.map(m=>{
    const monthStart = toISO(new Date(year, m-1, 1));
    const monthEnd = toISO(new Date(year, m, 0));
    const inRange = monthStart <= toDate && monthEnd >= fromDate;
    if(!inRange) return { thang:m, status:'NGOAI_KHOANG', dat:false, pct:null, note:'Ngoài khoảng Từ ngày - Đến ngày đã chọn' };
    const rec = findMonthReport_(baseProg.id, thoidiemCk, m, year);
    if(!rec) return { thang:m, status:'CHUA_LUU', dat:false, pct:null, note:'Chưa có báo cáo đã lưu cho tháng này' };
    const pct = rec.pct_ht_kh_dt==null || rec.pct_ht_kh_dt==='' ? null : Number(rec.pct_ht_kh_dt);
    const minReq = Number(lk.dk1_pct_thang_min||90);
    const dat = pct!=null && pct >= minReq;
    return { thang:m, status: dat?'DAT':'CHUA_DAT', dat, pct, note: dat? `Đạt (${pct}% ≥ ${minReq}%)` : (pct!=null?`Chưa đạt (${pct}% < ${minReq}%)`:'Không có dữ liệu % hoàn thành'), record:rec };
  });
  const dk1Met = monthChecks.length>0 && monthChecks.every(m=>m.dat);

  const syntheticProg = {
    dim_thuonghieu: baseProg.dim_thuonghieu, dim_nhomkh: baseProg.dim_nhomkh,
    dim_loaisp: baseProg.dim_loaisp, dim_dactinh: baseProg.dim_dactinh,
    dim_congdung: baseProg.dim_congdung, dim_quycach: baseProg.dim_quycach,
    sl_min: lk.sl_min, sl_max: lk.sl_max, dt_min: lk.dt_min, dt_max: lk.dt_max,
    dieukien_sldt: 'AND',
    dt_kehoach: lk.dt_kehoach, pct_kh_min: Number(lk.dk2_pct_ky_min||110), pct_kh_max: 0,
    hieuluctu: lk.hieuluctu, hieulucden: lk.hieulucden
  };
  const ownChk = evaluateProgramForPeriod(syntheticProg, fromDate, toDate, '');
  const dk2Met = ownChk.dat;

  const effectiveRatePct = (dk1Met ? Number(lk.dk1_rate||0) : 0) + (dk2Met ? Number(lk.dk2_rate||0) : 0);
  const finalDat = effectiveRatePct > 0;

  // Cần 1 danh sách mã hàng để phân bổ tiền CK — dùng ownChk.matchingSkus (đúng phạm vi mã hàng của CT
  // chính, doanh thu trong kỳ), kể cả khi chỉ đạt Điều kiện 1 (ownChk.dat có thể false trong TH đó vẫn
  // cần danh sách mã hàng — evaluateProgramForPeriod luôn trả matchingSkus dù dat=true/false).
  let skuDetails = [], tienck = 0;
  const rate = effectiveRatePct/100;
  if(finalDat && rate>0){
    let baseSkus = ownChk.matchingSkus || [];
    if(lk.ma_doanhthu_tinhck){
      const tinhCkDims = doanhThuDims_(lk.ma_doanhthu_tinhck);
      if(tinhCkDims) baseSkus = baseSkus.filter(s=>dimsMatch(s.dims, tinhCkDims));
    }
    skuDetails = baseSkus.map(s=>({
      mahang: s.mahang, tenhang: s.tenhang, sl: s.sl, dt: s.dt, tienck: s.dt*rate
    })).sort((a,b)=>b.tienck-a.tienck);
    tienck = skuDetails.reduce((a,x)=>a+x.tienck,0);
  }
  return { ok:true, kieu_tinh:'dual_condition', finalDat, dk1Met, dk2Met, effectiveRatePct, monthChecks, ownChk, baseProg, lk, rate, tienck, skuDetails };
}

async function runBonusCalc(){
  const luyke = document.getElementById('bn_luyke').value;
  const thoidiem = document.getElementById('bn_thoidiem').value;
  const from = document.getElementById('bn_from').value;
  const to = document.getElementById('bn_to').value;
  if(!from || !to){ toast('Vui lòng chọn Từ ngày - Đến ngày','err'); return; }
  const lk = DB.programsLuyKe.find(x=>x.id===luyke);
  if(!lk){ toast('Vui lòng chọn chương trình chiết khấu lũy kế','err'); return; }
  const thangCsv = lk.thang_luyke; // lấy thẳng từ chương trình lũy kế, không hỏi lại
  if(!thangCsv){ toast('Chương trình lũy kế này chưa cấu hình tháng — vào sửa lại ở tab "Chiết khấu lũy kế"','err'); return; }
  const baseProg = DB.programs.find(p=>p.id===lk.ma_ck_chinh);
  if(!baseProg){ toast('Không tìm thấy chương trình chiết khấu chính đã liên kết','err'); return; }
  UI._bonusFilters = { luyke, thang: thangCsv, thoidiem, from, to };
  const thangList = thangCsv.split(',').map(Number).filter(Boolean);
  const year = to ? new Date(to).getFullYear() : new Date().getFullYear();

  // SỬA THEO YÊU CẦU: "Mã chiết khấu lũy kế" chọn ở khung này chỉ phục vụ đúng việc tính chiết khấu bổ
  // sung, không dùng cho mục đích nào khác — nên trước khi đối chiếu ĐẠT/CHƯA ĐẠT từng tháng, LUÔN tự
  // tính lại bằng đúng dữ liệu Sổ mua hàng hiện tại. Khác với trước đây: giờ chỉ tính vào DRAFT (nháp)
  // trong bộ nhớ trình duyệt — KHÔNG ghi lên Sheet — nên bấm nút này để xem thử KHÔNG làm thay đổi báo
  // cáo tháng chính thức đã lưu. Draft tự động bị xoá ngay sau khi tính xong (xem finally bên dưới).
  const btn = document.getElementById('btnRunBonusCalc');
  if(btn){ btn.disabled = true; }
  try{
    await autoComputeMonthsDraft_(
      baseProg, thangList, thoidiem, year,
      (m,y) => { if(btn) btn.innerHTML = `Đang tính lại tháng ${m}/${y}...`; }
    );
    UI.bonusResult = { from, to, thoidiem, ...computeBonusDiscount(lk, thangList, thoidiem, from, to) };
    renderReport();
  }catch(err){
    toast('Lỗi khi tự động tính lại các tháng điều kiện: ' + (err.message||err), 'err');
  }finally{
    // THEO YÊU CẦU: tính xong (dù thành công hay lỗi) đều XOÁ NGAY draft — không để sót lại gây hiểu
    // nhầm dữ liệu cũ ở lượt tính tiếp theo hoặc ở bất kỳ chỗ nào khác trong app.
    DRAFT_REPORT_CKTH_ = [];
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.calc} Tính chiết khấu bổ sung`; }
  }
}
window.runBonusCalc = runBonusCalc;

      nhom_chietkhau: r.kieu_tinh==='dual_condition' ? '2 điều kiện độc lập' : 'Đạt tất cả các tháng (lũy kế)',
      ngay_tinh: r.to, thoidiem_chietkhau: r.thoidiem || r.lk.thoidiem_ck || '',
      tu_ngay: r.from, den_ngay: r.to, nhacungcap: '',

}

function exportBonusXlsx(){
  const r = UI.bonusResult;
  if(!r || !r.ok) return;
  const outMonths = r.monthChecks.map(m=>({ 'Tháng': m.thang, 'Trạng thái': m.status, 'Ghi chú': m.note||'' }));
  const outSku = r.skuDetails.map(s=>({ 'Mã hàng': s.mahang, 'Tên hàng': s.tenhang, 'Sản lượng': s.sl, 'Doanh số': s.dt, 'Tiền CK bổ sung': s.tienck }));
  outSku.push({ 'Mã hàng':'TỔNG CỘNG', 'Tiền CK bổ sung': r.tienck });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(outMonths), 'DoiChieuThangLuyKe');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(outSku), 'ChiTietCKBoSung');
  downloadWb(wb, `ChietKhauBoSung_${r.from}_${r.to}.xlsx`);
  toast('Đã xuất báo cáo chiết khấu bổ sung','ok');
}

function triggerFileImport(handler){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xls';
  input.onchange = (e) => { const f = e.target.files[0]; if(f) handler(f); };
  input.click();
}
function readWorkbook(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e) => {
      try{ resolve(XLSX.read(e.target.result, {type:'array', cellDates:true})); }
      catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function findSheet(wb, candidates){
  const names = wb.SheetNames;
  for(const c of candidates){
    const hit = names.find(n=>n.toLowerCase().replace(/[\s_]/g,'') === c.toLowerCase().replace(/[\s_]/g,''));
    if(hit) return wb.Sheets[hit];
  }
  return null;
}
function getVal(row, candidates){
  for(const c of candidates){ if(row[c]!=null && row[c]!=='') return row[c]; }
  const keys = Object.keys(row);
  for(const c of candidates){
    const k = keys.find(k=>k.toLowerCase().replace(/[\s_]/g,'')===c.toLowerCase().replace(/[\s_]/g,''));
    if(k && row[k]!=null && row[k]!=='') return row[k];
  }
  return '';
}
// SỬA LỖI NGHIÊM TRỌNG: hàm cũ dùng thẳng `new Date(v)` để parse chuỗi ngày dạng "dd/mm/yyyy"
// (định dạng Việt Nam) từ file Excel import. Trình duyệt hiểu chuỗi "07/01/2026" theo kiểu MỸ
// (mm/dd/yyyy) => ra NGÀY 1 THÁNG 7 thay vì đúng là NGÀY 7 THÁNG 1 — sai lệch âm thầm, không báo
// lỗi. Với các ngày có "ngày" (dd) > 12 (VD "31/12/2026", "25/03/2026"), JS không parse được luôn
// (vì hiểu nhầm là tháng 31/25) => trả về nguyên chuỗi gốc, phá vỡ mọi phép so sánh ngày hiệu lực
// phía sau (lọc chương trình đang áp dụng, tính chiết khấu theo kỳ...). Nay parse TƯỜNG MINH theo
// đúng thứ tự dd/mm/yyyy trước khi thử các cách khác.

// SỬA LỖI: giá trị số đọc từ Excel (VD cột "Giá công bố", "SL_MIN", "TL_CK"...) đôi khi ở dạng CHUỖI
// có dấu chấm/phẩy phân cách nghìn (VD "15.000" hoặc "15,000") thay vì số thuần — nếu không làm sạch,
// Number("15.000") hiểu nhầm "." là dấu thập phân ra 15 (sai), còn Number("15,000") ra NaN hẳn (hiển
// thị thành 0). Dùng CHUNG 1 hàm này cho MỌI nơi import số từ Excel trong toàn app (trước đây chỉ có
// ở phần import Mua hàng, khiến Giá công bố và Chương trình chiết khấu vẫn bị lỗi tương tự).
function cleanExcelNumber(val) {
  if (val === undefined || val === null || val === '') return 0;
  if (typeof val === 'number') return isFinite(val) ? val : 0;
  let str = String(val).replace(/[^0-9.,-]/g, '').trim(); // Xóa ký tự chữ (đ, $, khoảng trắng...)
  if (!str) return 0;
  // Nếu ô số chứa cả dấu chấm và dấu phẩy (Ví dụ: 1,500.00 hoặc 1.500,00)
  if (str.includes('.') && str.includes(',')) {
    if (str.lastIndexOf('.') > str.lastIndexOf(',')) {
      str = str.replace(/,/g, ''); // 1,500.00 -> 1500.00
    } else {
      str = str.replace(/\./g, '').replace(',', '.'); // 1.500,00 -> 1500.00
    }
  } else if (str.includes(',')) {
    // Nếu chỉ có dấu phẩy, kiểm tra định dạng phân cách hàng nghìn kiểu kế toán VN (ví dụ: 150,000)
    let parts = str.split(',');
    if (parts[1] && parts[1].length === 3) {
      str = str.replace(/,/g, '');
    } else {
      str = str.replace(',', '.'); // Chuỗi số thập phân kiểu Pháp: 1,5 -> 1.5
    }
  } else if (str.includes('.')) {
    let parts = str.split('.');
    if (parts.length === 2 && parts[1].length === 3) str = str.replace(/\./g, ''); // 15.000 -> 15000 kiểu VN
  }
  return Number(str) || 0;
}
function excelDateToISO(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return isNaN(v) ? '' : toISO(v);
  if(typeof v === 'number'){ const d = XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; // đã là ISO sẵn
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // dd/mm/yyyy hoặc dd-mm-yyyy
  if(m){
    const day = parseInt(m[1],10), month = parseInt(m[2],10), year = parseInt(m[3],10);
    if(month>=1 && month<=12 && day>=1 && day<=31){
      return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }
  }
  const d = new Date(s);
  return isNaN(d) ? s : toISO(d);
}

// SỬA LỖI: trước đây nếu tên tab trong file Excel không khớp CHÍNH XÁC danh sách tên kỳ vọng
// (VD file người dùng đặt tab "DM_NHOM_CHIETKHAU" thay vì "DM_THUONGHIEU"), findSheet() trả về null
// và cả dòng dữ liệu đó bị BỎ QUA ÂM THẦM (import 0 dòng, không báo lỗi gì) -> người dùng tưởng đã
// nhập thành công. Nay bổ sung: nếu không khớp tên tab, tự dò trong TẤT CẢ các tab của file xem tab
// nào có CỘT DỮ LIỆU khớp (ví dụ có cột "Ma_ThuongHieu") thì dùng tab đó, bất kể tên tab là gì.
function findSheetByColumn_(wb, candidateCols){
  for(const name of wb.SheetNames){
    const ws = wb.Sheets[name];
    const data = XLSX.utils.sheet_to_json(ws, {defval:''});
    if(data.length && getVal(data[0], candidateCols) !== ''){
      return ws;
    }
  }
  return null;
}
async function handleCatalogFile(file){
  try{
    const wb = await readWorkbook(file);
    const upsert = (list, ma, obj) => {
      const i = list.findIndex(x=>norm(x.ma)===norm(ma));
      if(i>-1) list[i] = {...list[i], ...obj}; else list.push(obj);
    };
    let counts = {};
    const map = [
      ['thuonghieu', ['DM_THUONGHIEU','DM THUONGHIEU'], ['Ma_ThuongHieu','Ma ThuongHieu'], ['Tên thương hiệu']],
      ['nhomkh', ['DM_NHOMKH'], ['Ma_NHOMKH'], ['Tên nhóm']],
      ['loaisp', ['DM_LOAISP'], ['Ma_LOAI'], ['Tên loại sản phẩm']],
      ['dactinh', ['DM_DACTINH'], ['DM_DACTINH'], ['Tên đặc tính']],
      ['congdung', ['DM_CONGDUNG'], ['DM_CONGDUNG'], ['Tên công dụng']],
    ];
    map.forEach(([key, sheetNames, maCols, tenCols])=>{
      const ws = findSheet(wb, sheetNames) || findSheetByColumn_(wb, maCols);
      if(!ws) return;
      const data = XLSX.utils.sheet_to_json(ws, {defval:''});
      let c=0;
      data.forEach(row=>{
        const ma = getVal(row, maCols); const ten = getVal(row, tenCols);
        if(!ma) return;
        upsert(DB.catalog[key], ma, {ma:String(ma).trim(), ten:String(ten||ma).trim()});
        c++;
      });
      counts[key]=c;
    });
    const wsQC = findSheet(wb, ['DM_QUYCACH']) || findSheetByColumn_(wb, ['Ma_Quycach']);
    if(wsQC){
      const data = XLSX.utils.sheet_to_json(wsQC, {defval:''});
      let c=0;
      data.forEach(row=>{
        let ma = getVal(row, ['Ma_Quycach']);
        if(ma instanceof Date) ma = excelDateToISO(ma);
        const ten = getVal(row, ['Tên Quy cách']);
        if(!ma) return;
        upsert(DB.catalog.quycach, ma, {ma:String(ma).trim(), ten:String(ten||ma).trim(), min:getVal(row,['Quy cách Min'])||null, max:getVal(row,['Quy cách Max'])||null});
        c++;
      });
      counts.quycach=c;
    }
    const wsMhck = findSheet(wb, ['DM_MHCK']) || findSheetByColumn_(wb, ['Mã hàng_misa','Mã hàng_Misa','Mã MH','MaMH']);
    if(wsMhck){
      const data = XLSX.utils.sheet_to_json(wsMhck, {defval:''});
      let c=0;
      data.forEach(row=>{
        // Mã hàng_misa: dùng để khớp với Sổ chi tiết mua hàng (bắt buộc)
        const mamhMisa = getVal(row, ['Mã hàng_misa','Mã hàng_Misa']);
        // Mã MH (cột A): mã theo Bảng giá công bố NCC — trước đây bị gộp nhầm vào Mã hàng_misa, nay tách riêng
        const maMH = getVal(row, ['Mã MH','MaMH','Mã MH_NCC']);
        const mamh = mamhMisa || maMH; // nếu thiếu Mã hàng_misa thì tạm dùng Mã MH để không mất dòng dữ liệu
        if(!mamh) return;
        const rec = {
          mamh: String(mamh).trim(),
          mamh_ncc: String(maMH||'').trim(),
          tenhang: String(getVal(row,['Tên hàng'])||'').trim(),
          thuonghieu: String(getVal(row,['DM_THUONGHIEU'])||'NO').trim() || 'NO',
          nhomkh: String(getVal(row,['DM_NHOMKH'])||'NO').trim() || 'NO',
          loaisp: String(getVal(row,['DM_LOAISP'])||'NO').trim() || 'NO',
          dactinh: String(getVal(row,['DM_DACTINH'])||'NO').trim() || 'NO',
          congdung: String(getVal(row,['DM_CONGDUNG'])||'NO').trim() || 'NO',
          quycach: String(getVal(row,['DM_QUYCACH'])||'NO').trim() || 'NO',
        };
        const i = DB.catalog.mhck.findIndex(x=>norm(x.mamh)===norm(rec.mamh));
        if(i>-1) DB.catalog.mhck[i]=rec; else DB.catalog.mhck.push(rec);
        c++;
      });
      counts.mhck=c;
    }
    ensureNO();
    // Hàm này import đồng thời cả 6 danh mục nhỏ VÀ bảng MHCK từ cùng 1 file Excel -> cần lưu cả 2
    // phần (chạy song song để không chờ tuần tự không cần thiết).
    await Promise.all([saveCatalogDims(), saveMhck()]);
    // SỬA LỖI: trước đây nếu 1 mục nào đó import được 0 dòng (do không tìm thấy tab/cột phù hợp
    // trong file Excel), người dùng không hề biết -> tưởng đã nạp xong nhưng thực ra thiếu dữ liệu.
    // Nay liệt kê rõ mục nào có dữ liệu, mục nào = 0 để người dùng biết ngay và kiểm tra lại file.
    const zeroKeys = Object.keys(counts).filter(k => !counts[k]);
    const gotKeys = Object.keys(counts).filter(k => counts[k]);
    const labelMap = {thuonghieu:'Thương hiệu', nhomkh:'Nhóm KH', loaisp:'Loại SP', dactinh:'Đặc tính', congdung:'Công dụng', quycach:'Quy cách', mhck:'Mã hàng→Nhóm CK'};
    if(gotKeys.length){
      toast(`Đã nạp: ${gotKeys.map(k=>`${labelMap[k]||k} (${counts[k]})`).join(', ')}`, 'ok');
    }
    if(zeroKeys.length){
      toast(`⚠️ Không tìm thấy dữ liệu cho: ${zeroKeys.map(k=>labelMap[k]||k).join(', ')} — kiểm tra lại tên tab/cột trong file Excel`, 'err');
    }
    renderCatalog();
  }catch(err){ toast('Lỗi cấu trúc tệp danh mục: ' + err.message, 'err'); }
}

function guessHT(text){
  const t = norm(text);
  if(t.indexOf('LŨY KẾ')>-1 || t.indexOf('LUY KE')>-1) return 'LUY_KE';
  if(t.indexOf('CÔNG BỐ')>-1 || t.indexOf('CONG BO')>-1) return 'PERCENT_GIACONGBO';
  if(t.indexOf('CỐ ĐỊNH')>-1 || t.indexOf('CO DINH')>-1) return 'DONGIA_CODINH';
  if(t.indexOf('GIÁ MUA')>-1 || t.indexOf('GIA MUA')>-1 || t.indexOf('DOANH THU')>-1) return 'PERCENT_GIAMUA';
  return 'PERCENT_GIAMUA';
}
function guessTTCK(text){
  const t = norm(text);
  if(t.indexOf('GIÁ BÁN')>-1 || t.indexOf('GIA BAN')>-1) return 'GIAM_GIABAN';
  return 'GIAM_HOADON';
}
// THEO YÊU CẦU: import hàng loạt cho Tầng 1 (Danh mục chương trình) — file cần cột Mã chương trình,
// Nội dung, Từ ngày, Đến ngày (khớp tên cột khi Xuất Excel ra từ chính app).
async function handleChuongTrinhFile(file){
  try{
    const wb = await readWorkbook(file);
    const ws = findSheet(wb, ['DM_CHUONGTRINH','CHUONGTRINH']) || wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {defval:''});
    let c=0;
    data.forEach(row=>{
      const ma = String(getVal(row,['Mã chương trình','Ma_ChuongTrinh','MA_CHUONGTRINH'])||'').trim();
      const tu = excelDateToISO(getVal(row,['Từ ngày','TU_NGAY']));
      const den = excelDateToISO(getVal(row,['Đến ngày','DEN_NGAY']));
      if(!ma || !tu || !den) return;
      const existing = DB.chuongtrinh.find(x=>norm(x.ma_chuongtrinh)===norm(ma));
      const rowObj = { id: existing?existing.id:uid(), ma_chuongtrinh: ma, noidung: String(getVal(row,['Nội dung','NOI_DUNG'])||''), tu_ngay: tu, den_ngay: den };
      if(existing) Object.assign(existing, rowObj); else DB.chuongtrinh.push(rowObj);
      c++;
    });
    await saveChuongTrinh();
    toast(`Đã nạp ${c} chương trình`,'ok');
    renderChuongTrinh();
  }catch(err){ toast('Lỗi xử lý tệp chương trình: ' + err.message, 'err'); }
}

async function handleDieuKienFile(file){

        tl_ck: getVal(row,['TL_CK']), dongia_codinh: cleanExcelNumber(getVal(row,['DONGIA_CODINH'])),

    toast(`Đã nạp ${c} bậc điều kiện${notFound?` · bỏ qua ${notFound} dòng do không tìm thấy Mã chiết khấu tương ứng (cần tạo mã chiết khấu trước)`:''}`,'ok');

async function handleProgramsFile(file){
  try{
    const wb = await readWorkbook(file);
    const ws = findSheet(wb, ['CHUONGTRINHCHIETKHAU','CTCK']) || wb.Sheets[wb.SheetNames[0]];

    data.forEach(row=>{
      const hieuluctu = excelDateToISO(getVal(row,['Hiệu lực từ ngày']));
      const hieulucden = excelDateToISO(getVal(row,['Hiệu lực đến ngày']));
      if(!hieuluctu && !hieulucden) return;
      const maCK = String(getVal(row,['Ma_Chietkhau'])||'').trim();

        dt_min: cleanExcelNumber(getVal(row,['DT_MIN'])), dt_max: cleanExcelNumber(getVal(row,['DT_MAX'])),
        thoidiem_ck: getVal(row,['THOIDIEM_CK']) || 'Quý',
        ht_chietkhau: guessHT(getVal(row,['HT_CHIETKHAU'])),
        tt_ck: guessTTCK(getVal(row,['TT_CK'])),
        dt_kehoach: cleanExcelNumber(getVal(row,['DT_KEHOACH'])), tl_ck: tl,
        // SỬA LỖI: file kế toán thực tế đặt tên cột là "DONGIA_APDUNG" chứ không phải "DONGIA_CODINH"
        // -> trước đây bị bỏ sót, đơn giá cố định luôn nhập vào trống dù file có dữ liệu.
        dongia_codinh: cleanExcelNumber(getVal(row,['DONGIA_CODINH','DONGIA_APDUNG','Đơn giá áp dụng'])),
        pct_kh_min: cleanExcelNumber(getVal(row,['PCT_KH_MIN','%KH Min'])),
        pct_kh_max: cleanExcelNumber(getVal(row,['PCT_KH_MAX','%KH Max'])),
        dieukien_sldt: (norm(getVal(row,['DIEUKIEN_SLDT','Điều kiện SL/DT']))==='OR') ? 'OR' : 'AND',

      });
      c++;

    await savePrograms();
    toast(`Đã đồng bộ ${c} chương trình lên đám mây`, 'ok');
    renderPrograms();
  }catch(err){ toast('Lỗi đọc dữ liệu: ' + err.message, 'err'); }
}

async function handlePurchasesFile(file){
  try{
    const wb = await readWorkbook(file);
    let ws = findSheet(wb, ['Báo cáo','SO_CHI_TIET_MUA_HANG','Sheet1']) || wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
    
    // NÂNG CẤP THÔNG MINH: Tìm kiếm linh hoạt dòng tiêu đề dựa trên mảng từ khóa để chống lệch dòng
    let headerIdx = aoa.findIndex(r => r.some(c => {
      let txt = String(c).trim().toUpperCase();
      return txt.includes('NGÀY CHỨNG TỪ') || txt.includes('MÃ HÀNG') || txt.includes('ĐƠN GIÁ');
    }));
    
    if(headerIdx === -1) headerIdx = 0;
    
    // Chuẩn hóa danh sách tiêu đề cột (viết hoa toàn bộ và xóa khoảng trắng thừa)
    const headers = aoa[headerIdx].map(h => String(h).trim().toUpperCase());
    const dataRows = aoa.slice(headerIdx + 1);
    
    // Hàm lấy giá trị động dựa vào danh sách header chuẩn hóa
    const col = (row, names) => { 
      for(const n of names) { 
        const i = headers.findIndex(h => h === n.trim().toUpperCase()); 
        if(i > -1 && row[i] !== undefined && row[i] !== null && row[i] !== '') return row[i]; 
      } 
      return ''; 
    };

    // Bộ chuyển đổi và ép kiểu số dùng chung toàn app: xem hàm global cleanExcelNumber() phía trên.

    const existingIds = new Set(DB.purchases.map(p=>p.id));
    let added=0, skipped=0;
    
    dataRows.forEach(row=>{
      if(!row || row.every(c=>String(c).trim()==='')) return;
      
      const mahang = String(col(row, ['Mã hàng', 'Mã MH'])).trim();
      const ngayRaw = col(row, ['Ngày chứng từ', 'Ngày CT', 'Ngày']);
      
      if(!mahang || !ngayRaw) return; // Bỏ qua nếu là dòng tổng cộng hoặc dòng rỗng không có mã hàng
      
      const ngay = excelDateToISO(ngayRaw);
      const sohd = col(row, ['Số hóa đơn', 'Số HĐ']);
      
      // Ép kiểu số an toàn qua bộ lọc cleanExcelNumber
      const soluong = cleanExcelNumber(col(row, ['Số lượng mua', 'Số lượng', 'SL']));
      const dongia = cleanExcelNumber(col(row, ['Đơn giá', 'Đơn giá mua', 'DG']));
      const giatri = cleanExcelNumber(col(row, ['Giá trị mua', 'Giá trị', 'Thành tiền']));
      
      const id = [ngay, sohd, mahang, soluong, giatri].join('|');
      if(existingIds.has(id)){ skipped++; return; }
      existingIds.add(id);
      
      DB.purchases.push({
        id, ngay, sohd, 
        diengiai: col(row,['Diễn giải']), 
        makho: col(row,['Mã kho']),
        mahang, 
        tenhang: col(row,['Tên hàng']), 
        dvt: col(row,['ĐVT']),
        soluong, dongia, giatri,
        nhacungcap: col(row,['Tên nhà cung cấp', 'Nhà cung cấp']), 
        diachi: col(row,['Địa chỉ']),
        chietkhau_goc: cleanExcelNumber(col(row,['Chiết khấu'])),
        tkno: col(row,['TK Nợ']), tkco: col(row,['TK Có']), mathongke: col(row,['Mã thống kê'])
      });
      added++;
    });

    // THEO GÓP Ý: tự động phát hiện Mã hàng MỚI xuất hiện trong Mua hàng nhưng CHƯA có trong Danh mục
    // Mã hàng→Nhóm CK — trước đây phải tự tay khai báo riêng ở 2 nơi tách biệt, dễ quên gắn nhóm. Nay
    // tự tạo sẵn dòng với 6 kích thước = "NO" và đánh dấu "cần rà soát", để không sót mã hàng nào mà
    // vẫn không tự ý gán sai nhóm (người dùng vẫn cần vào rà soát/sửa lại nhóm đúng sau).
    const knownMaHang = new Set(DB.catalog.mhck.map(r=>norm(r.mamh)));
    const newMaHangMap = {};
    DB.purchases.forEach(p=>{
      const k = norm(p.mahang);
      if(!k || knownMaHang.has(k) || newMaHangMap[k]) return;
      newMaHangMap[k] = { mamh: p.mahang, mamh_ncc:'', tenhang: p.tenhang||'', thuonghieu:'NO', nhomkh:'NO', loaisp:'NO', dactinh:'NO', congdung:'NO', quycach:'NO', can_ra_soat:true };
    });
    const autoAdded = Object.values(newMaHangMap);
    if(autoAdded.length){
      DB.catalog.mhck.push(...autoAdded);
    }

    await savePurchases();
    if(autoAdded.length) await saveMhck();
    toast(`Đã tải ${added} dòng mới lên Sheet${autoAdded.length? ` · Tự động thêm ${autoAdded.length} mã hàng mới vào Danh mục MHCK (cần rà soát lại nhóm)` : ''}`, 'ok');
    renderPurchases();
  }catch(err){ toast('Lỗi xử lý tệp mua hàng: ' + err.message, 'err'); }
}

function downloadWb(wb, filename){ XLSX.writeFile(wb, filename); }

function exportCatalogXlsx(){
  const wb = XLSX.utils.book_new();
  // SỬA LỖI: trước đây tên tab xuất ra thiếu tiền tố "DM_" (VD "THUONGHIEU") trong khi hàm import
  // (handleCatalogFile) lại tìm tab tên "DM_THUONGHIEU" -> xuất file ra rồi nhập lại chính file đó
  // sẽ luôn ra 0 dòng. Nay đặt lại tên tab xuất ra khớp đúng với tên tab hàm import tìm kiếm.
  const EXPORT_TAB_NAME = {thuonghieu:'DM_THUONGHIEU', nhomkh:'DM_NHOMKH', loaisp:'DM_LOAISP', dactinh:'DM_DACTINH', congdung:'DM_CONGDUNG', quycach:'DM_QUYCACH'};
  const EXPORT_MA_COL = {thuonghieu:'Ma_ThuongHieu', nhomkh:'Ma_NHOMKH', loaisp:'Ma_LOAI', dactinh:'DM_DACTINH', congdung:'DM_CONGDUNG', quycach:'Ma_Quycach'};
  const EXPORT_TEN_COL = {thuonghieu:'Tên thương hiệu', nhomkh:'Tên nhóm', loaisp:'Tên loại sản phẩm', dactinh:'Tên đặc tính', congdung:'Tên công dụng', quycach:'Tên Quy cách'};
  DIM_KEYS.forEach(k=>{
    const maCol = EXPORT_MA_COL[k], tenCol = EXPORT_TEN_COL[k];
    const rows = DB.catalog[k].map(r=> k==='quycach'
      ? {[maCol]:r.ma, [tenCol]:r.ten, 'Quy cách Min':r.min, 'Quy cách Max':r.max}
      : {[maCol]:r.ma, [tenCol]:r.ten});
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), EXPORT_TAB_NAME[k]);
  });
  const mh = DB.catalog.mhck.map(r=>({
    'Mã hàng_misa':r.mamh, 'Mã MH':r.mamh_ncc||'', 'Tên hàng':r.tenhang, DM_THUONGHIEU:r.thuonghieu, DM_NHOMKH:r.nhomkh,
    DM_LOAISP:r.loaisp, DM_DACTINH:r.dactinh, DM_CONGDUNG:r.congdung, DM_QUYCACH:r.quycach
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mh), 'DM_MHCK');
  downloadWb(wb, 'DM_NHOM_CHIETKHAU_export.xlsx');
  toast('Đã xuất file danh mục','ok');
}
function exportProgramsXlsx(){
  const rows = DB.programs.map(p=>{
    const ct = DB.chuongtrinh.find(c=>c.id===p.chuongtrinh_id);
    const soBac = DB.dieukien.filter(d=>d.program_id===p.id).length;
    return {
      'Ngày tạo': p.ngaytao, 'ID_CHIETKHAU': p.ghichu||p.id,
      'Mã chương trình (Tầng 1)': ct?ct.ma_chuongtrinh:'',
      'Hiệu lực từ ngày': p.hieuluctu, 'Hiệu lực đến ngày': p.hieulucden,
      'Ma_Chietkhau': p.ma_chietkhau,
      'Số bậc điều kiện con': soBac || '(dùng SL/DT ngay dưới đây)',
      'SL_MIN': p.sl_min, 'SL_MAX': p.sl_max, 'DT_MIN': p.dt_min, 'DT_MAX': p.dt_max,
      'DIEUKIEN_SLDT': p.dieukien_sldt==='OR'?'OR':'AND',
      'THOIDIEM_CK': p.thoidiem_ck, 'HT_CHIETKHAU': HT_OPTIONS.find(o=>o.v===p.ht_chietkhau)?.l || p.ht_chietkhau,
      'TT_CK': ttCkLabel(p.tt_ck),
      'DT_KEHOACH': p.dt_kehoach, 'TL_CK': p.tl_ck, 'DONGIA_CODINH': p.dongia_codinh,
      'PCT_KH_MIN': p.pct_kh_min ?? '', 'PCT_KH_MAX': p.pct_kh_max ?? ''
    };
  });
  // THEO YÊU CẦU: gộp đủ dữ liệu Bậc điều kiện con (Tầng 3) vào 1 sheet riêng, có Mã chiết khấu để đối
  // chiếu ngược lại sheet chính — trước đây xuất Excel bỏ sót hoàn toàn dữ liệu bậc con.
  const dieukienRows = DB.dieukien.map(d=>{
    const p = DB.programs.find(x=>x.id===d.program_id);
    return {
      'Ma_Chietkhau': p?p.ma_chietkhau:d.program_id, 'Ghi chú bậc': d.ghichu||'',
      'SL_MIN': d.sl_min, 'SL_MAX': d.sl_max, 'DT_MIN': d.dt_min, 'DT_MAX': d.dt_max,
      'DIEUKIEN_SLDT': d.dieukien_sldt==='OR'?'OR':'AND',
      'DT_KEHOACH': d.dt_kehoach, 'TL_CK': d.tl_ck, 'DONGIA_CODINH': d.dongia_codinh,
      'PCT_KH_MIN': d.pct_kh_min ?? '', 'PCT_KH_MAX': d.pct_kh_max ?? ''
    };
  });
  const chuongtrinhRows = DB.chuongtrinh.map(ct=>({
    'Mã chương trình': ct.ma_chuongtrinh, 'Nội dung': ct.noidung||'', 'Từ ngày': ct.tu_ngay, 'Đến ngày': ct.den_ngay
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(chuongtrinhRows), 'DM_CHUONGTRINH');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'CHUONGTRINHCHIETKHAU');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dieukienRows), 'DM_DIEUKIEN');
  downloadWb(wb, 'QUANLYCHIETKHAU_export.xlsx');
  toast('Đã xuất đầy đủ 3 tầng: Chương trình + Mã chiết khấu + Bậc điều kiện','ok');
}
function exportReportXlsx(){
  if(!UI.reportResult) return;
  const { rows, from, to, supplier } = UI.reportResult;
  const out = rows.map(r=>({
    'Nhóm chiết khấu': r.label, 'Sản lượng mua': r.sl, 'Doanh thu mua': r.dt,
    'Chương trình áp dụng': r.program ? r.program.ma_chietkhau : '',
    'Trạng thái': r.key==='unmapped' ? 'Chưa gắn nhóm' : r.key==='no_program' ? 'Chưa có chương trình phù hợp' : (r.dat ? 'Đạt bậc' : (r.datBac===false ? 'Chưa đạt bậc SL/DT' : (r.datKH===false ? 'Chưa đạt % Kế hoạch' : 'Chưa đạt bậc'))),
    'Số mã hàng': r.soMaHang,
    'Hình thức chiết khấu': r.htChietkhau || '', 'Thanh toán chiết khấu': r.ttChietkhau || '',
    'Tỷ lệ CK (%)': r.program ? r.program.tl_ck : '', 'Giá công bố BQ': r.giaCongBoTB || '',
    'Số tiền chiết khấu': r.tienck,
    '% CK theo giá mua': r.pctTheoGiaMua!=null ? Number(r.pctTheoGiaMua.toFixed(2)) : '',
    'Doanh thu kế hoạch': r.dtkh || '', '% Hoàn thành KH': r.hoanthanh ? r.hoanthanh.toFixed(1) : '',
    'Nguồn Doanh thu KH': !r.dtkhSource ? '' : (r.dtkhSource.loai==='kehoach' ? `Kế hoạch ${r.dtkhSource.ma_kehoach}${r.dtkhSource.ky?(' - kỳ '+r.dtkhSource.ky):''}` : (r.dtkhSource.loai==='chuongtrinh' ? 'Khai trực tiếp trên Mã chiết khấu (chưa có Kế hoạch áp dụng)' : 'Không có Doanh thu kế hoạch nào')),
    '%KH Min': r.program ? (r.program.pct_kh_min ?? '') : '',
    '%KH Max': r.program ? (r.program.pct_kh_max ?? '') : ''
  }));
  out.push({ 'Nhóm chiết khấu':'TỔNG CỘNG', 'Sản lượng mua':rows.reduce((s,r)=>s+r.sl,0), 'Doanh thu mua':rows.reduce((s,r)=>s+r.dt,0), 'Số tiền chiết khấu':rows.reduce((s,r)=>s+r.tienck,0) });

  // Sheet chi tiết theo từng mặt hàng nhận chiết khấu (mọi chương trình đạt bậc)
  const skuAgg = buildSkuAggregateView(rows);
  const outSku = skuAgg.map(s=>({
    'Mã hàng': s.mahang, 'Tên hàng': s.tenhang, 'Sản lượng': s.sl, 'Doanh số': s.dt,
    'Chương trình áp dụng': s.programs.map(p=>p.ma).join(', '),
    'Hình thức chiết khấu': [...new Set(s.programs.map(p=>p.ht))].filter(Boolean).join(', '),
    'Tổng tiền chiết khấu': s.tienck
  }));
  outSku.push({ 'Mã hàng':'TỔNG CỘNG', 'Tổng tiền chiết khấu': skuAgg.reduce((s,x)=>s+x.tienck,0) });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(out), 'BaoCaoTheoChuongTrinh');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(outSku), 'ChiTietTheoMatHang');
  downloadWb(wb, `BaoCaoChietKhau_${from}_${to}.xlsx`);
  toast('Đã xuất báo cáo chiết khấu thành công','ok');
}
// Các cột cho phép chọn NHIỀU mã cùng lúc (mã hỗn hợp, phân cách dấu ",") — khớp theo kiểu OR nội bộ
const MULTI_DIM_KEYS = ['loaisp','dactinh','congdung','quycach'];
const SINGLE_DIM_KEYS = ['thuonghieu','nhomkh'];

function multiDimCheckboxBox(prefix, dimKey, row){
  const raw = String(row['dim_'+dimKey]||'NO');
  const selected = raw.split(',').map(x=>norm(x.trim())).filter(Boolean);
  const isAll = selected.length===0 || selected.includes('NO');
  const options = (DB.catalog[dimKey]||[]).filter(o=>norm(o.ma)!=='NO');
  return `
    <div class="field">
      <label>${DIM_LABELS[dimKey]} <span class="hint">(chọn nhiều mã, cách nhau dấu phẩy — khớp 1 trong các mã đã chọn)</span></label>
      <div style="border:1px solid var(--slate-200);border-radius:7px;padding:8px;max-height:150px;overflow-y:auto;background:#fff">
        <label style="display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px;cursor:pointer;font-size:12.5px">
          <input type="checkbox" class="mdim_${prefix}_${dimKey}_all" ${isAll?'checked':''} onchange="onMultiDimAllToggle('${prefix}','${dimKey}',this)"> Không phân biệt (NO — tất cả)
        </label>
        <div style="border-top:1px solid var(--slate-100);margin:4px 0 6px"></div>
        ${options.length ? options.map(o=>`
          <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;cursor:pointer">
            <input type="checkbox" class="mdim_${prefix}_${dimKey}_opt" value="${esc(o.ma)}" ${(!isAll && selected.includes(norm(o.ma)))?'checked':''} ${isAll?'disabled':''} onchange="onMultiDimOptToggle('${prefix}','${dimKey}')">
            <span class="mono">${esc(o.ma)}</span> — ${esc(o.ten)}
          </label>`).join('') : `<div class="hint">Chưa có dữ liệu danh mục ${DIM_LABELS[dimKey].toLowerCase()}</div>`}
      </div>
    </div>`;
}
function onMultiDimAllToggle(prefix, dimKey, checkboxEl){
  document.querySelectorAll(`.mdim_${prefix}_${dimKey}_opt`).forEach(o=>{
    o.disabled = checkboxEl.checked;
    if(checkboxEl.checked) o.checked = false;
  });
}
window.onMultiDimAllToggle = onMultiDimAllToggle;
function onMultiDimOptToggle(prefix, dimKey){
  const anyChecked = document.querySelectorAll(`.mdim_${prefix}_${dimKey}_opt:checked`).length > 0;
  if(anyChecked){
    const allBox = document.querySelector(`.mdim_${prefix}_${dimKey}_all`);
    if(allBox) allBox.checked = false;
  }
}
window.onMultiDimOptToggle = onMultiDimOptToggle;
function readMultiDimValue(prefix, dimKey){
  const allBox = document.querySelector(`.mdim_${prefix}_${dimKey}_all`);
  if(allBox && allBox.checked) return 'NO';
  const checked = Array.from(document.querySelectorAll(`.mdim_${prefix}_${dimKey}_opt:checked`)).map(o=>o.value);
  return checked.length ? checked.join(',') : 'NO';
}

function dimSelectors(prefix, row){
  const singleHtml = SINGLE_DIM_KEYS.map(k=>`
    <div class="field"><label>${DIM_LABELS[k]}</label>
      <select id="${prefix}_${k}">${DB.catalog[k].map(o=>`<option value="${esc(o.ma)}" ${norm(o.ma)===norm(row['dim_'+k]||'NO')?'selected':''}>${esc(o.ma)} — ${esc(o.ten)}</option>`).join('')}</select>
    </div>`).join('');
  const multiHtml = MULTI_DIM_KEYS.map(k=>multiDimCheckboxBox(prefix,k,row)).join('');
  return `
    <div class="grid grid-2" style="margin-bottom:12px">${singleHtml}</div>
    <div class="grid grid-2">${multiHtml}</div>
  `;
}

document.addEventListener("DOMContentLoaded", function() {
  // THEO GÓP Ý: lấy email người dùng hiện tại 1 lần lúc mở app (không chặn giao diện) để ghi vết

  window.CURRENT_USER_EMAIL = '';
  google.script.run.withSuccessHandler(email => { window.CURRENT_USER_EMAIL = email || ''; }).withFailureHandler(()=>{}).getCurrentUserEmail();
  document.getElementById('app').innerHTML = `
    <div style="padding:60px; text-align:center; color:#69728a; font-family:Inter; font-size:15px;">
      <div style="margin-bottom:15px; font-weight:600;">🔄 Đang kết nối động cơ đồng bộ Google Sheets Cloud...</div>
      <div style="font-size:12px; color:#8993a4;">Nếu màn hình đứng im quá lâu, vui lòng kiểm tra phân quyền Google API hoặc cấu hình Code.gs.</div>
    </div>
  `;
  // SỬA LỖI: lần gọi google.script.run ĐẦU TIÊN sau khi Apps Script vừa deploy lại (hoặc sau thời
  // gian dài không có ai truy cập) có thể bị "cold start" — máy chủ cần thời gian khởi động môi trường
  // chạy, khiến lượt gọi đầu tiên chậm/thất bại dù các lượt sau đó bình thường. Nay nếu lần tải ĐẦU
  // TIÊN lúc mở trang thất bại, tự động thử lại thêm 1 lần (cách 1.5 giây) trước khi hiện màn hình lỗi.
  function attemptLoad(isRetry){
    loadAll()
      .then(function() {
        renderShell();
      })
      .catch(function(err) {
        console.error(err);
        if (!isRetry) {
          document.getElementById('app').innerHTML = `
            <div style="padding:60px; text-align:center; color:#69728a; font-family:Inter; font-size:15px;">
              <div style="margin-bottom:15px; font-weight:600;">🔄 Lần tải đầu tiên chưa thành công, đang thử lại...</div>
            </div>
          `;
          setTimeout(function(){ attemptLoad(true); }, 1500);
          return;
        }
        document.getElementById('app').innerHTML = `
          <div style="padding:60px; text-align:center; color:var(--red); font-family:Inter;">
            <h3 style="margin-bottom:10px;">❌ Lỗi đồng bộ đám mây (Cloud Sync Error)</h3>
            <p style="font-size:13px; color:var(--slate-600); max-width:520px; margin:0 auto 20px;">
              Ứng dụng không thể giao tiếp với Apps Script backend. Hãy chắc chắn bạn đã cấp quyền Trang tính và sử dụng liên kết Triển khai ứng dụng Web dạng <b>/exec</b>.
            </p>
            <div style="font-size:11px; color:var(--slate-400);" class="mono">Chi tiết: ${esc(err.message || err)}</div>
            <button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Thử tải lại trang</button>
          </div>
        `;
      });
  }
  attemptLoad(false);
});
